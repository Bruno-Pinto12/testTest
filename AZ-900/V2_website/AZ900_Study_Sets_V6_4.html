 "Management group → Subscription → Resource → Resource group"}, {"letter": "F", "text": "Management group → Resource group → Resource → Subscription"}, {"letter": "G", "text": "Management group → Resource → Subscription → Resource group"}, {"letter": "H", "text": "Management group → Resource → Resource group → Subscription"}, {"letter": "I", "text": "Subscription → Management group → Resource → Resource group"}, {"letter": "J", "text": "Subscription → Resource group → Management group → Resource"}, {"letter": "K", "text": "Subscription → Resource group → Resource → Management group"}, {"letter": "L", "text": "Subscription → Resource → Management group → Resource group"}, {"letter": "M", "text": "Subscription → Resource → Resource group → Management group"}, {"letter": "N", "text": "Resource group → Management group → Subscription → Resource"}, {"letter": "O", "text": "Resource group → Management group → Resource → Subscription"}, {"letter": "P", "text": "Resource group → Subscription → Management group → Resource"}, {"letter": "Q", "text": "Resource group → Subscription → Resource → Management group"}, {"letter": "R", "text": "Resource group → Resource → Management group → Subscription"}, {"letter": "S", "text": "Resource group → Resource → Subscription → Management group"}, {"letter": "T", "text": "Resource → Management group → Subscription → Resource group"}, {"letter": "U", "text": "Resource → Management group → Resource group → Subscription"}, {"letter": "V", "text": "Resource → Subscription → Management group → Resource group"}, {"letter": "W", "text": "Resource → Subscription → Resource group → Management group"}, {"letter": "X", "text": "Resource → Resource group → Management group → Subscription"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nThis is Azure's resource management hierarchy.\n\n### Correct order\n\n1. Management group\n2. Subscription\n3. Resource group\n4. Resource\n\n### Key concept to remember\n\nScope inheritance follows management group, subscription, resource group, resource.", "chapter": 4, "format": "ordering", "items": ["Management group", "Subscription", "Resource group", "Resource"], "intro": "Arrange these scopes from broadest to narrowest: resource, subscription, management group, resource group."}, {"id": 130, "sourceId": 130, "title": "Resource organization", "prompt": "Select Yes or No: (1) Resource groups are direct children of subscriptions. (2) A resource belongs to one resource group at a time. (3) A subscription can contain multiple resource groups.", "options": [{"letter": "A", "text": "No / Yes / Yes"}, {"letter": "B", "text": "No / No / No"}, {"letter": "C", "text": "No / Yes / No"}, {"letter": "D", "text": "Yes / No / No"}, {"letter": "E", "text": "Yes / No / Yes"}, {"letter": "F", "text": "Yes / Yes / No"}, {"letter": "G", "text": "No / No / Yes"}, {"letter": "H", "text": "Yes / Yes / Yes"}], "correct": "H", "correctLabel": "Correct answer", "details": "### Explanation\n\nResource groups are not nested, resources belong to one group, and subscriptions contain groups.\n\n### Statement-by-statement correction\n\n- **Resource groups are direct children of subscriptions. — Yes.**\n- **A resource belongs to one resource group at a time. — Yes.**\n- **A subscription can contain multiple resource groups. — Yes.**\n\n### Key concept to remember\n\nA resource group is a logical lifecycle container, not a nested folder hierarchy.", "chapter": 4, "format": "statements", "items": ["Resource groups are direct children of subscriptions.", "A resource belongs to one resource group at a time.", "A subscription can contain multiple resource groups."], "intro": "Select Yes or No:", "revision": 4, "rationales": ["A resource group is a child of a subscription.", "A resource belongs to one resource group at a time.", "A subscription can contain multiple resource groups."]}, {"id": 131, "sourceId": 131, "title": "Region pairing", "prompt": "A company deploys one VM in an Azure region that has a region pair. It assumes Azure automatically creates a copy of the VM in the paired region. Is the assumption correct?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nRegion pairing does not automatically replicate arbitrary workloads.\n\n### Why the other answers are incorrect\n\n- **B. Yes:** Cross-region replication must be configured using appropriate services and architecture.\n\n### Key concept to remember\n\nRegion pairing is not itself a disaster recovery solution.", "chapter": 4, "format": "scenario"}, {"id": 132, "sourceId": 132, "title": "Sovereign cloud", "prompt": "A government agency requires a cloud environment isolated from global Azure to satisfy specific eligibility and regulatory requirements. Which architectural concept meets this need?", "options": [{"letter": "A", "text": "Sovereign cloud environment"}, {"letter": "B", "text": "Resource group"}, {"letter": "C", "text": "Availability set"}, {"letter": "D", "text": "Region pair"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nSovereign offerings provide isolated cloud environments for specific requirements.\n\n### Why the other answers are incorrect\n\n- **B. Resource group:** This is a logical resource container.\n- **C. Availability set:** This distributes VMs across fault and update domains.\n- **D. Region pair:** This is a regional resiliency association, not sovereign isolation.\n\n### Key concept to remember\n\nSovereign clouds are distinct from ordinary geographic regions and private clouds.", "chapter": 4, "format": "scenario"}, {"id": 133, "sourceId": 133, "title": "Availability zones", "prompt": "Which TWO properties characterize availability zones? (1) Separate locations within a region. (2) Independent power, cooling and networking. (3) Automatic replication of every VM to another region. (4) Billing boundaries.", "options": [{"letter": "A", "text": "1 and 2"}, {"letter": "B", "text": "2 and 4"}, {"letter": "C", "text": "2 and 3"}, {"letter": "D", "text": "1 and 4"}, {"letter": "E", "text": "1 and 3"}, {"letter": "F", "text": "3 and 4"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nZones provide physical separation and independent supporting infrastructure.\n\n### Why the other answers are incorrect\n\n- **B. 2 and 4:** Subscriptions provide billing boundaries, not zones.\n- **C. 2 and 3:** Statement(s) 3 are not correct; statement(s) 1 are required. Zones address failures within a region; regional disaster recovery requires cross-region design.\n- **D. 1 and 4:** Statement(s) 4 are not correct; statement(s) 2 are required. Zones address failures within a region; regional disaster recovery requires cross-region design.\n- **E. 1 and 3:** VMs are not automatically replicated to another region.\n- **F. 3 and 4:** Neither describes availability zones.\n\n### Key concept to remember\n\nZones address failures within a region; regional disaster recovery requires cross-region design.", "chapter": 4, "format": "multiple", "items": ["Separate locations within a region.", "Independent power, cooling and networking.", "Automatic replication of every VM to another region.", "Billing boundaries."], "intro": "Which TWO properties characterize availability zones?", "rationales": ["Zones are physically separate locations within one region.", "Zones have independent power, cooling and networking.", "Zone deployment does not automatically create a regional VM replica.", "Subscriptions are billing and management scopes; zones are physical infrastructure boundaries."]}, {"id": 134, "sourceId": 134, "title": "Resource lifecycle", "prompt": "A development project has a temporary database, VM and network used only by that project. The team wants to remove them together at project completion. Which arrangement is most appropriate?", "options": [{"letter": "A", "text": "Place every resource in a separate tenant"}, {"letter": "B", "text": "Place the related resources in one resource group"}, {"letter": "C", "text": "Assign a Reader role to every resource"}, {"letter": "D", "text": "Create a separate Azure region for the project"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nA common lifecycle makes resource-group management and deletion convenient.\n\n### Why the other answers are incorrect\n\n- **A. Place every resource in a separate tenant:** Tenants organize identities, not individual project cleanup.\n- **C. Assign a Reader role to every resource:** Reader provides viewing permissions, not lifecycle grouping.\n- **D. Create a separate Azure region for the project:** Customers do not create Azure regions.\n\n### Key concept to remember\n\nGroup resources that share a lifecycle; deleting a group can delete all its resources, subject to protections.", "chapter": 4, "format": "scenario"}, {"id": 135, "sourceId": 135, "title": "Resource hierarchy and billing", "prompt": "Select Yes or No: (1) One Entra tenant can be associated with multiple subscriptions. (2) A subscription can trust two Entra tenants simultaneously. (3) Azure RBAC assignments at subscription scope can apply to child resources.", "options": [{"letter": "A", "text": "No / Yes / Yes"}, {"letter": "B", "text": "Yes / No / Yes"}, {"letter": "C", "text": "Yes / Yes / No"}, {"letter": "D", "text": "No / No / Yes"}, {"letter": "E", "text": "Yes / No / No"}, {"letter": "F", "text": "No / Yes / No"}, {"letter": "G", "text": "Yes / Yes / Yes"}, {"letter": "H", "text": "No / No / No"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nA tenant can support multiple subscriptions, each trusts one tenant at a time, and scoped RBAC is inherited.\n\n### Why the other answers are incorrect\n\n- **A. No / Yes / Yes:** 1 must be Yes; 2 must be No. A tenant can support multiple subscriptions, each trusts one tenant at a time, and scoped RBAC is inherited.\n- **C. Yes / Yes / No:** 2 must be No; 3 must be Yes. A tenant can support multiple subscriptions, each trusts one tenant at a time, and scoped RBAC is inherited.\n- **D. No / No / Yes:** Multiple subscriptions may use one tenant.\n- **E. Yes / No / No:** RBAC can inherit to child resources.\n- **F. No / Yes / No:** 1 must be Yes; 2 must be No; 3 must be Yes. A tenant can support multiple subscriptions, each trusts one tenant at a time, and scoped RBAC is inherited.\n- **G. Yes / Yes / Yes:** A subscription trusts one tenant at a time.\n- **H. No / No / No:** 1 must be Yes; 3 must be Yes. A tenant can support multiple subscriptions, each trusts one tenant at a time, and scoped RBAC is inherited.\n\n### Key concept to remember\n\nDirectory identity and Azure resource hierarchy are related but distinct.", "chapter": 4, "format": "statements", "items": ["One Entra tenant can be associated with multiple subscriptions.", "A subscription can trust two Entra tenants simultaneously.", "Azure RBAC assignments at subscription scope can apply to child resources."], "intro": "Select Yes or No:", "rationales": ["A Microsoft Entra tenant can be associated with multiple subscriptions.", "Each subscription trusts one tenant at a time.", "RBAC assignments at subscription scope can inherit down to child resources."]}, {"id": 136, "sourceId": 136, "title": "Azure Virtual Desktop", "prompt": "A company wants employees to access centrally hosted Windows desktops and business applications from their personal devices. Which service is designed for this purpose?", "options": [{"letter": "A", "text": "Azure Functions"}, {"letter": "B", "text": "Azure App Service"}, {"letter": "C", "text": "Azure Virtual Desktop"}, {"letter": "D", "text": "Azure Container Instances"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt delivers virtual desktops and applications remotely.\n\n### Why the other answers are incorrect\n\n- **A. Azure Functions:** It executes event-driven code.\n- **B. Azure App Service:** It hosts web apps and APIs.\n- **D. Azure Container Instances:** It runs containers without managing hosts.\n\n### Key concept to remember\n\nRemote Windows desktops or published desktop applications point to Azure Virtual Desktop.", "chapter": 5, "format": "scenario"}, {"id": 137, "sourceId": 137, "title": "VM resources", "prompt": "Which TWO resources are normally needed for a persistent Azure VM with a guest OS? (1) Managed OS disk. (2) Network interface connected to a subnet. (3) Public IP address in every case. (4) Kubernetes cluster.", "options": [{"letter": "A", "text": "1 and 4"}, {"letter": "B", "text": "1 and 2"}, {"letter": "C", "text": "1 and 3"}, {"letter": "D", "text": "2 and 4"}, {"letter": "E", "text": "2 and 3"}, {"letter": "F", "text": "3 and 4"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nThe VM needs OS storage and virtual network connectivity.\n\n### Why the other answers are incorrect\n\n- **A. 1 and 4:** Statement(s) 4 are not correct; statement(s) 2 are required. VMs need OS and network resources; public exposure is optional.\n- **C. 1 and 3:** A public IP is optional.\n- **D. 2 and 4:** A Kubernetes cluster is not a VM prerequisite.\n- **E. 2 and 3:** Statement(s) 3 are not correct; statement(s) 1 are required. VMs need OS and network resources; public exposure is optional.\n- **F. 3 and 4:** Neither is a mandatory VM requirement.\n\n### Key concept to remember\n\nVMs need OS and network resources; public exposure is optional.", "chapter": 5, "format": "multiple", "items": ["Managed OS disk.", "Network interface connected to a subnet.", "Public IP address in every case.", "Kubernetes cluster."], "intro": "Which TWO resources are normally needed for a persistent Azure VM with a guest OS?", "rationales": ["A persistent VM requires OS storage, normally a managed OS disk.", "A standard Azure VM uses a NIC attached to a subnet.", "Private-only VMs need no public IP.", "A Kubernetes cluster is not required for ordinary VMs."]}, {"id": 138, "sourceId": 138, "title": "Container Apps", "prompt": "A team wants to deploy multiple containerized microservices with managed scaling but does not need direct Kubernetes cluster administration. Which managed hosting option is most appropriate?", "options": [{"letter": "A", "text": "Azure Container Registry"}, {"letter": "B", "text": "Azure Container Apps"}, {"letter": "C", "text": "Azure Virtual Machines"}, {"letter": "D", "text": "Azure Virtual Desktop"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt provides managed containerized application hosting and scaling without direct cluster administration.\n\n### Why the other answers are incorrect\n\n- **A. Azure Container Registry:** It stores images rather than runs application workloads.\n- **C. Azure Virtual Machines:** The team would manage the guest OS and container runtime.\n- **D. Azure Virtual Desktop:** It delivers remote desktops and applications.\n\n### Key concept to remember\n\nContainer Apps fits managed serverless-style microservices; AKS fits Kubernetes orchestration needs.", "chapter": 5, "format": "scenario"}, {"id": 139, "sourceId": 139, "title": "Compute options", "prompt": "Match the requirements: (1) Kubernetes orchestration. (2) Run a short container task without managing a cluster. (3) Full guest OS control.", "options": [{"letter": "A", "text": "1 Azure VMs; 2 ACI; 3 AKS"}, {"letter": "B", "text": "1 AKS; 2 ACI; 3 Azure VMs"}, {"letter": "C", "text": "1 ACI; 2 AKS; 3 Azure VMs"}, {"letter": "D", "text": "1 AKS; 2 Azure VMs; 3 ACI"}, {"letter": "E", "text": "1 ACI; 2 Azure VMs; 3 AKS"}, {"letter": "F", "text": "1 Azure VMs; 2 AKS; 3 ACI"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nAKS orchestrates containers, ACI runs containers without managing a cluster, and VMs provide OS control.\n\n### Correct associations\n\n- **Kubernetes orchestration.** → AKS\n- **Run a short container task without managing a cluster.** → ACI\n- **Full guest OS control.** → Azure VMs\n\n### Key concept to remember\n\nDifferent compute services offer different levels of abstraction and orchestration.", "chapter": 5, "format": "matching", "items": ["Kubernetes orchestration.", "Run a short container task without managing a cluster.", "Full guest OS control."], "intro": "Match the requirements:", "targets": ["AKS", "ACI", "Azure VMs"]}, {"id": 140, "sourceId": 140, "title": "Containers and VMs", "prompt": "Select Yes or No: (1) Every container requires its own separate guest OS. (2) A VM never has a guest operating system. (3) Every container requires a dedicated physical server.", "options": [{"letter": "A", "text": "No / Yes / No"}, {"letter": "B", "text": "Yes / Yes / No"}, {"letter": "C", "text": "Yes / Yes / Yes"}, {"letter": "D", "text": "No / No / No"}, {"letter": "E", "text": "Yes / No / No"}, {"letter": "F", "text": "Yes / No / Yes"}, {"letter": "G", "text": "No / Yes / Yes"}, {"letter": "H", "text": "No / No / Yes"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nContainers share the host kernel, VMs run guest OSs, and containers do not each require a physical server.\n\n### Statement-by-statement correction\n\n- **Every container requires its own separate guest OS. — No.**\n- **A VM never has a guest operating system. — No.**\n- **Every container requires a dedicated physical server. — No.**\n\n### Key concept to remember\n\nContainers package application dependencies; virtual machines virtualize hardware and provide a guest OS.", "chapter": 5, "format": "statements", "items": ["Every container requires its own separate guest OS.", "A VM never has a guest operating system.", "Every container requires a dedicated physical server."], "intro": "Select Yes or No:", "revision": 4, "rationales": ["Containers generally share a host OS kernel rather than requiring a separate guest OS.", "A VM normally runs its own guest OS.", "Multiple containers can run on shared physical or virtual hosts."]}, {"id": 141, "sourceId": 141, "title": "VM deallocation", "prompt": "A development VM is deallocated using Azure management tools. Its managed OS disk is retained. Which charge can still apply?", "options": [{"letter": "A", "text": "Managed disk storage charges"}, {"letter": "B", "text": "VM compute charges for the deallocated instance"}, {"letter": "C", "text": "A Kubernetes cluster management fee"}, {"letter": "D", "text": "A mandatory resource group fee"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nDeallocation releases VM compute allocation but retained storage remains billable.\n\n### Why the other answers are incorrect\n\n- **B. VM compute charges for the deallocated instance:** Deallocation stops normal VM compute charges.\n- **C. A Kubernetes cluster management fee:** No cluster is described.\n- **D. A mandatory resource group fee:** Resource groups do not have a direct charge.\n\n### Key concept to remember\n\nDeallocation stops VM compute billing, not every cost associated with the VM.", "chapter": 5, "format": "scenario"}, {"id": 142, "sourceId": 142, "title": "VM availability", "prompt": "An application uses two identical VMs. The team needs to reduce the chance both undergo planned host maintenance at the same time. Which construct directly addresses this within an availability set?", "options": [{"letter": "A", "text": "Subnets"}, {"letter": "B", "text": "Management groups"}, {"letter": "C", "text": "Fault domains"}, {"letter": "D", "text": "Update domains"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nVMs in distinct update domains can be maintained at different times.\n\n### Why the other answers are incorrect\n\n- **A. Subnets:** These segment virtual network address space.\n- **B. Management groups:** These organize subscriptions.\n- **C. Fault domains:** These separate common hardware failure boundaries.\n\n### Key concept to remember\n\nUpdate domains concern planned maintenance; fault domains concern shared infrastructure failures.", "chapter": 5, "format": "scenario"}, {"id": 143, "sourceId": 143, "title": "Virtual network peering", "prompt": "Two existing VNets in different Azure regions must communicate using private IP addresses over Microsoft's backbone. The address ranges do not overlap. Which feature should be configured?", "options": [{"letter": "A", "text": "Azure Load Balancer"}, {"letter": "B", "text": "Azure DNS"}, {"letter": "C", "text": "Virtual network peering"}, {"letter": "D", "text": "A resource lock"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nGlobal VNet peering provides private connectivity between supported VNets across regions.\n\n### Why the other answers are incorrect\n\n- **A. Azure Load Balancer:** It distributes traffic to backend instances.\n- **B. Azure DNS:** It resolves names but does not establish network connectivity.\n- **D. A resource lock:** It protects management operations, not network paths.\n\n### Key concept to remember\n\nPeering connects VNets; name resolution and security rules remain separate concerns.", "chapter": 6, "format": "scenario"}, {"id": 144, "sourceId": 144, "title": "Point-to-site VPN", "prompt": "A consultant working from home must securely connect one laptop to an Azure VNet over the Internet. Which connection type is appropriate?", "options": [{"letter": "A", "text": "Site-to-site VPN"}, {"letter": "B", "text": "Private endpoint"}, {"letter": "C", "text": "Point-to-site VPN"}, {"letter": "D", "text": "ExpressRoute"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt connects an individual client device to an Azure network.\n\n### Why the other answers are incorrect\n\n- **A. Site-to-site VPN:** It connects networks rather than individual remote clients.\n- **B. Private endpoint:** It provides private access to a supported service, not a remote-client tunnel.\n- **D. ExpressRoute:** It provides private enterprise connectivity via a provider.\n\n### Key concept to remember\n\nPoint-to-site = individual client; site-to-site = network to network.", "chapter": 6, "format": "scenario"}, {"id": 145, "sourceId": 145, "title": "ExpressRoute and VPN", "prompt": "Select Yes or No: (1) ExpressRoute bypasses the public Internet. (2) ExpressRoute does not automatically encrypt all traffic. (3) Site-to-site VPN uses an encrypted tunnel.", "options": [{"letter": "A", "text": "No / No / Yes"}, {"letter": "B", "text": "Yes / Yes / Yes"}, {"letter": "C", "text": "Yes / No / No"}, {"letter": "D", "text": "Yes / Yes / No"}, {"letter": "E", "text": "No / Yes / No"}, {"letter": "F", "text": "No / No / No"}, {"letter": "G", "text": "Yes / No / Yes"}, {"letter": "H", "text": "No / Yes / Yes"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nExpressRoute is private connectivity, not implicit encryption; VPN encrypts traffic.\n\n### Statement-by-statement correction\n\n- **ExpressRoute bypasses the public Internet. — Yes.**\n- **ExpressRoute does not automatically encrypt all traffic. — Yes.**\n- **Site-to-site VPN uses an encrypted tunnel. — Yes.**\n\n### Key concept to remember\n\nPrivate connectivity and encrypted connectivity are different properties.", "chapter": 6, "format": "statements", "items": ["ExpressRoute bypasses the public Internet.", "ExpressRoute does not automatically encrypt all traffic.", "Site-to-site VPN uses an encrypted tunnel."], "intro": "Select Yes or No:", "revision": 4, "rationales": ["ExpressRoute avoids the public Internet for the private connection.", "ExpressRoute is not automatically end-to-end encrypted.", "Site-to-site VPN uses an encrypted tunnel."]}, {"id": 146, "sourceId": 146, "title": "Endpoints", "prompt": "Match each description: (1) Access a supported Azure service using a private IP in your VNet. (2) Extend subnet identity to a supported service using its public endpoint. (3) Access a service through its public address, subject to controls.", "options": [{"letter": "A", "text": "1 Private endpoint; 2 Public endpoint; 3 Service endpoint"}, {"letter": "B", "text": "1 Service endpoint; 2 Private endpoint; 3 Public endpoint"}, {"letter": "C", "text": "1 Private endpoint; 2 Service endpoint; 3 Public endpoint"}, {"letter": "D", "text": "1 Public endpoint; 2 Service endpoint; 3 Private endpoint"}, {"letter": "E", "text": "1 Service endpoint; 2 Public endpoint; 3 Private endpoint"}, {"letter": "F", "text": "1 Public endpoint; 2 Private endpoint; 3 Service endpoint"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nThe mapping distinguishes private IP access, subnet identity, and public addressing.\n\n### Correct associations\n\n- **Access a supported Azure service using a private IP in your VNet.** → Private endpoint\n- **Extend subnet identity to a supported service using its public endpoint.** → Service endpoint\n- **Access a service through its public address, subject to controls.** → Public endpoint\n\n### Key concept to remember\n\nPrivate endpoints use Private Link and a private IP; service endpoints retain the service's public endpoint.", "chapter": 6, "format": "matching", "items": ["Access a supported Azure service using a private IP in your VNet.", "Extend subnet identity to a supported service using its public endpoint.", "Access a service through its public address, subject to controls."], "intro": "Match each description:", "targets": ["Private endpoint", "Service endpoint", "Public endpoint"]}, {"id": 147, "sourceId": 147, "title": "Azure DNS", "prompt": "A company owns a domain name and wants Azure to host its public DNS records. Which service should be used?", "options": [{"letter": "A", "text": "Azure Virtual Desktop"}, {"letter": "B", "text": "Azure Firewall"}, {"letter": "C", "text": "Azure VPN Gateway"}, {"letter": "D", "text": "Azure DNS"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt hosts DNS zones and records.\n\n### Why the other answers are incorrect\n\n- **A. Azure Virtual Desktop:** It delivers remote desktops.\n- **B. Azure Firewall:** It filters network traffic.\n- **C. Azure VPN Gateway:** It establishes encrypted network connectivity.\n\n### Key concept to remember\n\nAzure DNS hosts records; it does not by itself register a domain or grant network access.", "chapter": 6, "format": "scenario"}, {"id": 148, "sourceId": 148, "title": "Network security groups", "prompt": "Which TWO statements about NSGs are correct? (1) They filter inbound and outbound traffic. (2) They can be associated with subnets or network interfaces. (3) They automatically assign public IP addresses. (4) They provide DNS hosting.", "options": [{"letter": "A", "text": "1 and 4"}, {"letter": "B", "text": "2 and 4"}, {"letter": "C", "text": "1 and 3"}, {"letter": "D", "text": "2 and 3"}, {"letter": "E", "text": "1 and 2"}, {"letter": "F", "text": "3 and 4"}], "correct": "E", "correctLabel": "Correct answer", "details": "### Explanation\n\nNSGs filter traffic at subnet or NIC scope.\n\n### Why the other answers are incorrect\n\n- **A. 1 and 4:** Statement(s) 4 are not correct; statement(s) 2 are required. NSGs control traffic, not addressing, DNS, or network connectivity.\n- **B. 2 and 4:** DNS hosting is a different service.\n- **C. 1 and 3:** An NSG does not create a public IP.\n- **D. 2 and 3:** Statement(s) 3 are not correct; statement(s) 1 are required. NSGs control traffic, not addressing, DNS, or network connectivity.\n- **F. 3 and 4:** Neither is an NSG capability.\n\n### Key concept to remember\n\nNSGs control traffic, not addressing, DNS, or network connectivity.", "chapter": 6, "format": "multiple", "items": ["They filter inbound and outbound traffic.", "They can be associated with subnets or network interfaces.", "They automatically assign public IP addresses.", "They provide DNS hosting."], "intro": "Which TWO statements about NSGs are correct?", "rationales": ["NSG rules filter inbound and outbound network traffic.", "NSGs can be associated with a subnet or a NIC.", "Public IP addresses are separately provisioned resources.", "DNS hosting is handled by DNS services."]}, {"id": 149, "sourceId": 149, "title": "Subnet isolation", "prompt": "A VNet contains a frontend subnet and a database subnet. The team wants to allow database connections only from the frontend subnet. Which feature directly provides subnet-level traffic filtering?", "options": [{"letter": "A", "text": "VNet peering"}, {"letter": "B", "text": "Network Security Group"}, {"letter": "C", "text": "Azure DNS"}, {"letter": "D", "text": "Resource groups"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nAn NSG can allow or deny traffic based on source, destination, ports and protocol.\n\n### Why the other answers are incorrect\n\n- **A. VNet peering:** It connects separate networks rather than enforcing subnet access rules.\n- **C. Azure DNS:** It resolves names.\n- **D. Resource groups:** They organize resources but do not isolate network traffic.\n\n### Key concept to remember\n\nSubnets do not automatically isolate traffic; NSGs can enforce segmentation.", "chapter": 6, "format": "scenario"}, {"id": 150, "sourceId": 150, "title": "Read-access geo redundancy", "prompt": "A storage workload requires copies in two regions and read access to the secondary region before a failover. Zone redundancy is not required. Which option is the most direct fit?", "options": [{"letter": "A", "text": "RA-GRS"}, {"letter": "B", "text": "ZRS"}, {"letter": "C", "text": "GRS"}, {"letter": "D", "text": "LRS"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt provides geographically replicated storage with a readable secondary endpoint.\n\n### Why the other answers are incorrect\n\n- **B. ZRS:** It replicates within one region only.\n- **C. GRS:** It does not provide normal secondary read access without failover.\n- **D. LRS:** It replicates within one physical location.\n\n### Key concept to remember\n\nThe RA prefix indicates read access to the secondary region; geo replication is asynchronous.", "chapter": 7, "format": "scenario"}, {"id": 151, "sourceId": 151, "title": "ZRS", "prompt": "A workload must remain resilient to the loss of one availability zone, but all storage copies must remain in the same region. Which redundancy option meets the requirement?", "options": [{"letter": "A", "text": "LRS"}, {"letter": "B", "text": "GRS"}, {"letter": "C", "text": "ZRS"}, {"letter": "D", "text": "GZRS"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt replicates data synchronously across availability zones in one region.\n\n### Why the other answers are incorrect\n\n- **A. LRS:** Copies are kept within one physical location.\n- **B. GRS:** It replicates to a secondary region.\n- **D. GZRS:** It includes replication to a secondary region.\n\n### Key concept to remember\n\nZRS is the within-region, multi-zone option; GRS and GZRS include a second region.", "chapter": 7, "format": "scenario"}, {"id": 152, "sourceId": 152, "title": "Storage redundancy behavior", "prompt": "Select Yes or No: (1) LRS stores copies in multiple Azure regions. (2) Geo-replication is asynchronous. (3) Storage replication alone guarantees recovery of accidentally deleted data.", "options": [{"letter": "A", "text": "Yes / Yes / No"}, {"letter": "B", "text": "Yes / Yes / Yes"}, {"letter": "C", "text": "Yes / No / No"}, {"letter": "D", "text": "No / No / No"}, {"letter": "E", "text": "No / Yes / No"}, {"letter": "F", "text": "No / Yes / Yes"}, {"letter": "G", "text": "Yes / No / Yes"}, {"letter": "H", "text": "No / No / Yes"}], "correct": "E", "correctLabel": "Correct answer", "details": "### Explanation\n\nLRS has three local copies, geo-replication can lag, and replication is not an independent backup.\n\n### Statement-by-statement correction\n\n- **LRS stores copies in multiple Azure regions. — No.**\n- **Geo-replication is asynchronous. — Yes.**\n- **Storage replication alone guarantees recovery of accidentally deleted data. — No.**\n\n### Key concept to remember\n\nDurability, backup and failover solve different problems.", "chapter": 7, "format": "statements", "items": ["LRS stores copies in multiple Azure regions.", "Geo-replication is asynchronous.", "Storage replication alone guarantees recovery of accidentally deleted data."], "intro": "Select Yes or No:", "revision": 4, "rationales": ["LRS stores three copies in one primary-region physical location.", "Geo-replication to the secondary region is asynchronous.", "Replication can replicate deletion; independent recovery protection is needed."]}, {"id": 153, "sourceId": 153, "title": "Cold tier", "prompt": "A company reads compliance files only a few times per year. The files must remain immediately accessible and will be retained for at least 90 days. Which of Hot, Cool, Cold and Archive typically offers the lowest storage cost while meeting immediate access?", "options": [{"letter": "A", "text": "Hot"}, {"letter": "B", "text": "Archive"}, {"letter": "C", "text": "Cold"}, {"letter": "D", "text": "Cool"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nCold is an online tier with lower storage cost than Hot and Cool.\n\n### Why the other answers are incorrect\n\n- **A. Hot:** Optimized for frequent access, with higher storage cost.\n- **B. Archive:** Archived data needs rehydration before normal reading.\n- **D. Cool:** Online but generally higher storage cost than Cold.\n\n### Key concept to remember\n\nHot, Cool and Cold are online tiers; Archive is offline.", "chapter": 7, "format": "scenario"}, {"id": 154, "sourceId": 154, "title": "Archive rehydration", "prompt": "Before an archived blob can be read normally, it must be moved to an online tier. This process is called _____.", "options": [{"letter": "A", "text": "Deallocation"}, {"letter": "B", "text": "Peering"}, {"letter": "C", "text": "Rehydration"}, {"letter": "D", "text": "Geo-replication"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt makes archived data available for normal reading.\n\n### Why the other answers are incorrect\n\n- **A. Deallocation:** Releases VM compute capacity.\n- **B. Peering:** Connects virtual networks.\n- **D. Geo-replication:** Copies data to another region.\n\n### Key concept to remember\n\nArchive saves storage costs but introduces retrieval time and costs.", "chapter": 7, "format": "completion"}, {"id": 155, "sourceId": 155, "title": "Data Box", "prompt": "An organization must transfer hundreds of terabytes to Azure. Its internet bandwidth is too limited to complete the transfer in time. Which service is designed for offline bulk data movement?", "options": [{"letter": "A", "text": "Azure Data Box"}, {"letter": "B", "text": "Azure DNS"}, {"letter": "C", "text": "Azure File Sync"}, {"letter": "D", "text": "Azure Storage Explorer"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt uses physical devices for bulk transfer when network transfer is impractical.\n\n### Why the other answers are incorrect\n\n- **B. Azure DNS:** It hosts DNS zones.\n- **C. Azure File Sync:** It synchronizes file shares over a network.\n- **D. Azure Storage Explorer:** It is a graphical online storage tool.\n\n### Key concept to remember\n\nChoose Data Box for large datasets when available network bandwidth is insufficient.", "chapter": 7, "format": "scenario"}, {"id": 156, "sourceId": 156, "title": "Storage Explorer", "prompt": "An administrator needs a graphical desktop tool to browse storage containers and manually upload or download blobs. Which tool should be used?", "options": [{"letter": "A", "text": "Azure Storage Explorer"}, {"letter": "B", "text": "Azure Migrate"}, {"letter": "C", "text": "AzCopy"}, {"letter": "D", "text": "Azure File Sync"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt provides a graphical interface for Azure Storage management.\n\n### Why the other answers are incorrect\n\n- **B. Azure Migrate:** It discovers, assesses and migrates workloads.\n- **C. AzCopy:** It is a command-line transfer utility.\n- **D. Azure File Sync:** It synchronizes Windows file servers with Azure Files.\n\n### Key concept to remember\n\nStorage Explorer is graphical; AzCopy is scripted; File Sync is ongoing hybrid synchronization.", "chapter": 7, "format": "scenario"}, {"id": 157, "sourceId": 157, "title": "Storage accounts", "prompt": "Which TWO statements are true? (1) A general-purpose v2 account supports common storage services such as blobs, queues, tables and files. (2) Premium account offerings are optimized for particular workloads. (3) Every account type supports every redundancy option. (4) Storage account names never need to be unique.", "options": [{"letter": "A", "text": "2 and 4"}, {"letter": "B", "text": "2 and 3"}, {"letter": "C", "text": "1 and 2"}, {"letter": "D", "text": "3 and 4"}, {"letter": "E", "text": "1 and 4"}, {"letter": "F", "text": "1 and 3"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nGPv2 supports common storage services, and premium offerings target specific performance needs.\n\n### Why the other answers are incorrect\n\n- **A. 2 and 4:** Storage accounts provide globally unique names in Azure.\n- **B. 2 and 3:** Statement(s) 3 are not correct; statement(s) 1 are required. Storage account type affects supported services, performance and redundancy.\n- **D. 3 and 4:** Both statements are false.\n- **E. 1 and 4:** Statement(s) 4 are not correct; statement(s) 2 are required. Storage account type affects supported services, performance and redundancy.\n- **F. 1 and 3:** Supported redundancy varies by account type.\n\n### Key concept to remember\n\nStorage account type affects supported services, performance and redundancy.", "chapter": 7, "format": "multiple", "items": ["A general-purpose v2 account supports common storage services such as blobs, queues, tables and files.", "Premium account offerings are optimized for particular workloads.", "Every account type supports every redundancy option.", "Storage account names never need to be unique."], "intro": "Which TWO statements are true?", "rationales": ["GPv2 supports Blob, File, Queue and Table storage.", "Premium account types are designed for specific performance needs.", "Redundancy support varies by account type and region.", "Storage account names must be globally unique in the Azure namespace."]}, {"id": 158, "sourceId": 158, "title": "Customer identities", "prompt": "An online retailer needs self-service sign-up and sign-in for thousands of shoppers using a customer-facing web application. Which capability is designed for this audience?", "options": [{"letter": "A", "text": "Microsoft Entra Domain Services"}, {"letter": "B", "text": "Azure RBAC"}, {"letter": "C", "text": "Microsoft Entra External ID customer identities"}, {"letter": "D", "text": "B2B collaboration"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nCustomer identity capabilities support external consumer authentication journeys.\n\n### Why the other answers are incorrect\n\n- **A. Microsoft Entra Domain Services:** It provides managed traditional domain protocols.\n- **B. Azure RBAC:** It authorizes actions on Azure resources, not consumer sign-up.\n- **D. B2B collaboration:** It primarily enables business guests and partner collaboration.\n\n### Key concept to remember\n\nDistinguish customer-facing identity from workforce and business guest collaboration.", "chapter": 8, "format": "scenario"}, {"id": 159, "sourceId": 159, "title": "B2B direct connect", "prompt": "Two partner companies configure cross-tenant trust so their users can collaborate in a supported Microsoft Teams shared channel without ordinary guest invitations. Which feature fits?", "options": [{"letter": "A", "text": "B2B collaboration"}, {"letter": "B", "text": "Azure RBAC"}, {"letter": "C", "text": "Entra Domain Services"}, {"letter": "D", "text": "B2B direct connect"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt supports configured cross-tenant collaboration for Teams shared channels.\n\n### Why the other answers are incorrect\n\n- **A. B2B collaboration:** Ordinary guest collaboration generally uses an external guest object.\n- **B. Azure RBAC:** It grants permissions on Azure resources.\n- **C. Entra Domain Services:** It provides managed traditional domain services.\n\n### Key concept to remember\n\nB2B direct connect and B2B collaboration address different external collaboration patterns.", "chapter": 8, "format": "scenario"}, {"id": 160, "sourceId": 160, "title": "Guest permissions", "prompt": "Select Yes or No: (1) A B2B guest must always create a new local account in the host tenant. (2) Inviting a guest automatically grants access to all Azure resources. (3) The host organization controls authorization to its resources.", "options": [{"letter": "A", "text": "No / No / Yes"}, {"letter": "B", "text": "Yes / Yes / No"}, {"letter": "C", "text": "No / No / No"}, {"letter": "D", "text": "No / Yes / Yes"}, {"letter": "E", "text": "Yes / Yes / Yes"}, {"letter": "F", "text": "No / Yes / No"}, {"letter": "G", "text": "Yes / No / No"}, {"letter": "H", "text": "Yes / No / Yes"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nGuest identity and resource permissions are separate.\n\n### Statement-by-statement correction\n\n- **A B2B guest must always create a new local account in the host tenant. — No.**\n- **Inviting a guest automatically grants access to all Azure resources. — No.**\n- **The host organization controls authorization to its resources. — Yes.**\n\n### Key concept to remember\n\nB2B provides authentication and collaboration; resource authorization still requires appropriate permissions.", "chapter": 8, "format": "statements", "items": ["A B2B guest must always create a new local account in the host tenant.", "Inviting a guest automatically grants access to all Azure resources.", "The host organization controls authorization to its resources."], "intro": "Select Yes or No:", "revision": 4, "rationales": ["B2B guests can typically authenticate with an existing identity.", "Invitation alone does not grant access to all resources.", "The host organization controls authorization to its resources."]}, {"id": 161, "sourceId": 161, "title": "MFA factors", "prompt": "Which TWO combinations use different authentication factor categories? (1) Password and hardware security key. (2) Password and PIN. (3) Fingerprint and possession of a registered phone. (4) Two different passwords.", "options": [{"letter": "A", "text": "1 and 4"}, {"letter": "B", "text": "1 and 2"}, {"letter": "C", "text": "3 and 4"}, {"letter": "D", "text": "2 and 3"}, {"letter": "E", "text": "2 and 4"}, {"letter": "F", "text": "1 and 3"}], "correct": "F", "correctLabel": "Correct answer", "details": "### Explanation\n\nKnowledge plus possession, and inherence plus possession, use different categories.\n\n### Why the other answers are incorrect\n\n- **A. 1 and 4:** Statement(s) 4 are not correct; statement(s) 3 are required. MFA uses multiple factor categories: knowledge, possession and inherence.\n- **B. 1 and 2:** Password and PIN are both knowledge factors.\n- **C. 3 and 4:** Two passwords do not constitute MFA.\n- **D. 2 and 3:** Statement(s) 2 are not correct; statement(s) 1 are required. MFA uses multiple factor categories: knowledge, possession and inherence.\n- **E. 2 and 4:** Both combinations use knowledge factors only.\n\n### Key concept to remember\n\nMFA uses multiple factor categories: knowledge, possession and inherence.", "chapter": 8, "format": "multiple", "items": ["Password and hardware security key.", "Password and PIN.", "Fingerprint and possession of a registered phone.", "Two different passwords."], "intro": "Which TWO combinations use different authentication factor categories?", "rationales": ["A password is knowledge; a security key is possession.", "Passwords and PINs are both knowledge factors.", "A fingerprint is inherence; verified phone possession is a possession factor.", "Two passwords belong to the same knowledge category."]}, {"id": 162, "sourceId": 162, "title": "Single sign-on", "prompt": "Employees authenticate once and then access several integrated business applications without repeatedly entering credentials, subject to access policies. What capability is illustrated?", "options": [{"letter": "A", "text": "Microsoft Purview"}, {"letter": "B", "text": "Single sign-on (SSO)"}, {"letter": "C", "text": "Azure RBAC"}, {"letter": "D", "text": "Resource locks"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nOne authentication session can be used across integrated applications.\n\n### Why the other answers are incorrect\n\n- **A. Microsoft Purview:** It governs and protects data.\n- **C. Azure RBAC:** It determines permissions, not the sign-in experience.\n- **D. Resource locks:** They prevent certain resource operations.\n\n### Key concept to remember\n\nSSO improves sign-in convenience; MFA and Conditional Access can still apply.", "chapter": 8, "format": "scenario"}, {"id": 163, "sourceId": 163, "title": "Least privilege role", "prompt": "A helpdesk employee needs to inspect the configuration of Azure VMs in a resource group without making changes or granting access. Which built-in role should be assigned at that scope?", "options": [{"letter": "A", "text": "User Access Administrator"}, {"letter": "B", "text": "Reader"}, {"letter": "C", "text": "Contributor"}, {"letter": "D", "text": "Owner"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt grants read-only management-plane access.\n\n### Why the other answers are incorrect\n\n- **A. User Access Administrator:** It manages access permissions rather than merely viewing resources.\n- **C. Contributor:** It allows resource modification.\n- **D. Owner:** It allows broad management and access assignment.\n\n### Key concept to remember\n\nChoose the narrowest sufficient role and scope; Reader does not grant all data-plane access.", "chapter": 8, "format": "scenario"}, {"id": 164, "sourceId": 164, "title": "Contributor role", "prompt": "A deployment engineer must create and modify Azure resources but must not assign Azure RBAC roles. Which built-in role best meets the requirement?", "options": [{"letter": "A", "text": "User Access Administrator"}, {"letter": "B", "text": "Reader"}, {"letter": "C", "text": "Contributor"}, {"letter": "D", "text": "Owner"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt manages resources but cannot assign Azure RBAC roles through that role.\n\n### Why the other answers are incorrect\n\n- **A. User Access Administrator:** It manages user access instead of general resource deployment.\n- **B. Reader:** It cannot create or modify resources.\n- **D. Owner:** It can grant access to others.\n\n### Key concept to remember\n\nContributor manages resources; Owner also manages access.", "chapter": 8, "format": "scenario"}, {"id": 165, "sourceId": 165, "title": "Identity services", "prompt": "Match requirements: (1) Managed LDAP and Kerberos for a legacy workload. (2) Cloud identity and sign-in for employees. (3) Require MFA when a device is noncompliant.", "options": [{"letter": "A", "text": "1 Entra ID; 2 Entra Domain Services; 3 Conditional Access"}, {"letter": "B", "text": "1 Conditional Access; 2 Entra ID; 3 Entra Domain Services"}, {"letter": "C", "text": "1 Entra Domain Services; 2 Entra ID; 3 Conditional Access"}, {"letter": "D", "text": "1 Entra Domain Services; 2 Conditional Access; 3 Entra ID"}, {"letter": "E", "text": "1 Entra ID; 2 Conditional Access; 3 Entra Domain Services"}, {"letter": "F", "text": "1 Conditional Access; 2 Entra Domain Services; 3 Entra ID"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nManaged domain protocols, cloud identity and contextual policies are distinct capabilities.\n\n### Correct associations\n\n- **Managed LDAP and Kerberos for a legacy workload.** → Entra Domain Services\n- **Cloud identity and sign-in for employees.** → Entra ID\n- **Require MFA when a device is noncompliant.** → Conditional Access\n\n### Key concept to remember\n\nIdentify whether the need is directory protocols, cloud identity, or conditional authentication.", "chapter": 8, "format": "matching", "items": ["Managed LDAP and Kerberos for a legacy workload.", "Cloud identity and sign-in for employees.", "Require MFA when a device is noncompliant."], "intro": "Match requirements:", "targets": ["Entra Domain Services", "Entra ID", "Conditional Access"]}, {"id": 166, "sourceId": 166, "title": "Defense in depth", "prompt": "Arrange the following defense-in-depth layers from outermost to innermost: Data, Network, Physical security, Application.", "options": [{"letter": "A", "text": "Data → Application → Network → Physical security"}, {"letter": "B", "text": "Physical security → Network → Application → Data"}, {"letter": "C", "text": "Physical security → Data → Network → Application"}, {"letter": "D", "text": "Network → Physical security → Data → Application"}, {"letter": "E", "text": "Physical security → Network → Data → Application"}, {"letter": "F", "text": "Physical security → Application → Network → Data"}, {"letter": "G", "text": "Physical security → Application → Data → Network"}, {"letter": "H", "text": "Physical security → Data → Application → Network"}, {"letter": "I", "text": "Network → Physical security → Application → Data"}, {"letter": "J", "text": "Network → Application → Physical security → Data"}, {"letter": "K", "text": "Network → Application → Data → Physical security"}, {"letter": "L", "text": "Network → Data → Physical security → Application"}, {"letter": "M", "text": "Network → Data → Application → Physical security"}, {"letter": "N", "text": "Application → Physical security → Network → Data"}, {"letter": "O", "text": "Application → Physical security → Data → Network"}, {"letter": "P", "text": "Application → Network → Physical security → Data"}, {"letter": "Q", "text": "Application → Network → Data → Physical security"}, {"letter": "R", "text": "Application → Data → Physical security → Network"}, {"letter": "S", "text": "Application → Data → Network → Physical security"}, {"letter": "T", "text": "Data → Physical security → Network → Application"}, {"letter": "U", "text": "Data → Physical security → Application → Network"}, {"letter": "V", "text": "Data → Network → Physical security → Application"}, {"letter": "W", "text": "Data → Network → Application → Physical security"}, {"letter": "X", "text": "Data → Application → Physical security → Network"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nPhysical controls are outermost, followed by network and application controls, with data at the center.\n\n### Correct order\n\n1. Physical security\n2. Network\n3. Application\n4. Data\n\n### Key concept to remember\n\nDefense in depth protects data through multiple independent security layers.", "chapter": 8, "format": "ordering", "items": ["Physical security", "Network", "Application", "Data"], "intro": "Arrange the following defense-in-depth layers from outermost to innermost: Data, Network, Physical security, Application."}, {"id": 167, "sourceId": 167, "title": "Azure cost factors", "prompt": "Which TWO choices can change the estimated cost of an otherwise identical Azure VM deployment? (1) Azure region. (2) VM size. (3) The name of its resource group alone. (4) The alphabetical order of tags.", "options": [{"letter": "A", "text": "1 and 4"}, {"letter": "B", "text": "2 and 4"}, {"letter": "C", "text": "3 and 4"}, {"letter": "D", "text": "1 and 3"}, {"letter": "E", "text": "1 and 2"}, {"letter": "F", "text": "2 and 3"}], "correct": "E", "correctLabel": "Correct answer", "details": "### Explanation\n\nRegion-specific rates and resource capacity can affect price.\n\n### Why the other answers are incorrect\n\n- **A. 1 and 4:** Statement(s) 4 are not correct; statement(s) 2 are required. Region, service type, capacity, consumption, licensing and network transfers can affect costs.\n- **B. 2 and 4:** Tag order does not affect resource pricing.\n- **C. 3 and 4:** Neither directly changes the resource's price.\n- **D. 1 and 3:** A resource group name has no direct pricing effect.\n- **F. 2 and 3:** Statement(s) 3 are not correct; statement(s) 1 are required. Region, service type, capacity, consumption, licensing and network transfers can affect costs.\n\n### Key concept to remember\n\nRegion, service type, capacity, consumption, licensing and network transfers can affect costs.", "chapter": 9, "format": "multiple", "items": ["Azure region.", "VM size.", "The name of its resource group alone.", "The alphabetical order of tags."], "intro": "Which TWO choices can change the estimated cost of an otherwise identical Azure VM deployment?", "rationales": ["Prices can vary between Azure regions.", "A VM size determines compute capacity and price.", "Naming a resource group does not directly change resource prices.", "Tag ordering does not change resource prices."]}, {"id": 168, "sourceId": 168, "title": "Azure Hybrid Benefit", "prompt": "An organization has eligible existing Windows Server licenses and wants to reduce licensing costs when moving supported workloads to Azure. Which option should it evaluate?", "options": [{"letter": "A", "text": "Azure Policy"}, {"letter": "B", "text": "Azure Spot VMs"}, {"letter": "C", "text": "Azure Hybrid Benefit"}, {"letter": "D", "text": "Azure Pricing Calculator"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nEligible existing licenses can be used under applicable licensing terms.\n\n### Why the other answers are incorrect\n\n- **A. Azure Policy:** It enforces configuration rules, not licensing discounts.\n- **B. Azure Spot VMs:** They discount spare compute capacity and may be evicted.\n- **D. Azure Pricing Calculator:** It estimates costs but does not provide the licensing benefit.\n\n### Key concept to remember\n\nHybrid Benefit is a licensing benefit; reservations and savings plans are consumption commitments.", "chapter": 9, "format": "scenario"}, {"id": 169, "sourceId": 169, "title": "Budget alerts", "prompt": "Select Yes or No: (1) Cost Management can alert when actual or forecast spending exceeds a configured threshold. (2) Creating a budget automatically stops all Azure resources at the threshold. (3) A budget can help track spending.", "options": [{"letter": "A", "text": "No / No / Yes"}, {"letter": "B", "text": "Yes / Yes / Yes"}, {"letter": "C", "text": "No / Yes / Yes"}, {"letter": "D", "text": "No / No / No"}, {"letter": "E", "text": "Yes / Yes / No"}, {"letter": "F", "text": "Yes / No / No"}, {"letter": "G", "text": "Yes / No / Yes"}, {"letter": "H", "text": "No / Yes / No"}], "correct": "G", "correctLabel": "Correct answer", "details": "### Explanation\n\nBudgets monitor costs and generate alerts but are not automatic spending caps.\n\n### Why the other answers are incorrect\n\n- **A. No / No / Yes:** Actual or forecast budget alerts are supported.\n- **B. Yes / Yes / Yes:** A budget alone does not shut down resources.\n- **C. No / Yes / Yes:** 1 must be Yes; 2 must be No. Budgets monitor costs and generate alerts but are not automatic spending caps.\n- **D. No / No / No:** 1 must be Yes; 3 must be Yes. Budgets monitor costs and generate alerts but are not automatic spending caps.\n- **E. Yes / Yes / No:** 2 must be No; 3 must be Yes. Budgets monitor costs and generate alerts but are not automatic spending caps.\n- **F. Yes / No / No:** Budgets help track spending.\n- **H. No / Yes / No:** 1 must be Yes; 2 must be No; 3 must be Yes. Budgets monitor costs and generate alerts but are not automatic spending caps.\n\n### Key concept to remember\n\nAn Azure budget is a monitoring and alerting tool, not a hard spending limit.", "chapter": 9, "format": "statements", "items": ["Cost Management can alert when actual or forecast spending exceeds a configured threshold.", "Creating a budget automatically stops all Azure resources at the threshold.", "A budget can help track spending."], "intro": "Select Yes or No:", "rationales": ["Budget alerts can notify on actual or forecast threshold crossings.", "Budget creation alone does not stop resources automatically.", "Budgets help monitor spending."]}, {"id": 170, "sourceId": 170, "title": "Forecast spending", "prompt": "A finance team wants to examine this month's actual expenditure and project the end-of-month cost based on existing usage. Which tool is most appropriate?", "options": [{"letter": "A", "text": "Azure Pricing Calculator"}, {"letter": "B", "text": "Microsoft Cost Management"}, {"letter": "C", "text": "Azure Advisor"}, {"letter": "D", "text": "Azure Monitor"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt analyzes actual costs and forecasts expenditure from available usage data.\n\n### Why the other answers are incorrect\n\n- **A. Azure Pricing Calculator:** It estimates a planned deployment from input assumptions.\n- **C. Azure Advisor:** It recommends improvements but is not the main cost reporting tool.\n- **D. Azure Monitor:** It collects operational telemetry, not the main billing analysis.\n\n### Key concept to remember\n\nCost Management tracks and forecasts actual cloud spending; Pricing Calculator estimates planned configurations.", "chapter": 9, "format": "scenario"}, {"id": 171, "sourceId": 171, "title": "Reservations versus spot", "prompt": "A production database workload is stable and will run continuously for three years. It cannot tolerate eviction. Which option can reduce eligible compute charges without relying on spare capacity?", "options": [{"letter": "A", "text": "Azure Reservations"}, {"letter": "B", "text": "Resource locks"}, {"letter": "C", "text": "Azure Spot VMs"}, {"letter": "D", "text": "Azure Tags"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nReservations provide discounted eligible committed usage and do not rely on evictable Spot capacity.\n\n### Why the other answers are incorrect\n\n- **B. Resource locks:** They protect management operations, not compute pricing.\n- **C. Azure Spot VMs:** They may be evicted, violating the workload requirement.\n- **D. Azure Tags:** They help organize cost reports but do not discount usage.\n\n### Key concept to remember\n\nCommitment-based pricing fits predictable workloads; Spot fits interruptible workloads.", "chapter": 9, "format": "scenario"}, {"id": 172, "sourceId": 172, "title": "Cost optimization tools", "prompt": "Match each requirement: (1) Estimate the monthly price of a proposed deployment. (2) Investigate yesterday's actual spending. (3) Receive recommendations to resize an underused VM.", "options": [{"letter": "A", "text": "1 Pricing Calculator; 2 Cost Management; 3 Azure Advisor"}, {"letter": "B", "text": "1 Cost Management; 2 Advisor; 3 Pricing Calculator"}, {"letter": "C", "text": "1 Pricing Calculator; 2 Advisor; 3 Cost Management"}, {"letter": "D", "text": "1 Advisor; 2 Pricing Calculator; 3 Cost Management"}, {"letter": "E", "text": "1 Pricing Calculator; 2 Azure Advisor; 3 Cost Management"}, {"letter": "F", "text": "1 Cost Management; 2 Pricing Calculator; 3 Azure Advisor"}, {"letter": "G", "text": "1 Cost Management; 2 Azure Advisor; 3 Pricing Calculator"}, {"letter": "H", "text": "1 Azure Advisor; 2 Pricing Calculator; 3 Cost Management"}, {"letter": "I", "text": "1 Azure Advisor; 2 Cost Management; 3 Pricing Calculator"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nThe tools address planning, actual spending analysis and optimization recommendations respectively.\n\n### Correct associations\n\n- **Estimate the monthly price of a proposed deployment.** → Pricing Calculator\n- **Investigate yesterday's actual spending.** → Cost Management\n- **Receive recommendations to resize an underused VM.** → Azure Advisor\n\n### Key concept to remember\n\nBefore deployment: calculator. Actual expenditure: Cost Management. Optimization advice: Advisor.", "chapter": 9, "format": "matching", "items": ["Estimate the monthly price of a proposed deployment.", "Investigate yesterday's actual spending.", "Receive recommendations to resize an underused VM."], "intro": "Match each requirement:", "targets": ["Pricing Calculator", "Cost Management", "Azure Advisor"]}, {"id": 173, "sourceId": 173, "title": "Data transfer costs", "prompt": "A company compares hosting a media service in two regions. The service sends substantial data to Internet users. Which additional factor should be considered when estimating costs?", "options": [{"letter": "A", "text": "Number of resource group names"}, {"letter": "B", "text": "Number of management group levels"}, {"letter": "C", "text": "Number of tag characters"}, {"letter": "D", "text": "Outbound data transfer charges"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nEgress may generate charges depending on the service and network path.\n\n### Why the other answers are incorrect\n\n- **A. Number of resource group names:** Names do not directly incur charges.\n- **B. Number of management group levels:** Hierarchy depth is not an Internet data transfer pricing factor.\n- **C. Number of tag characters:** Tag length does not determine network transfer prices.\n\n### Key concept to remember\n\nConsider egress as well as compute and storage; not every data transfer is priced the same way.", "chapter": 9, "format": "scenario"}, {"id": 174, "sourceId": 174, "title": "Commitment pricing", "prompt": "Select Yes or No: (1) Reservations discount every Azure charge, including unrelated network traffic. (2) A savings plan requires no spending commitment. (3) A commitment guarantees that all storage and networking charges are covered.", "options": [{"letter": "A", "text": "No / Yes / No"}, {"letter": "B", "text": "No / Yes / Yes"}, {"letter": "C", "text": "No / No / Yes"}, {"letter": "D", "text": "Yes / Yes / No"}, {"letter": "E", "text": "Yes / No / No"}, {"letter": "F", "text": "No / No / No"}, {"letter": "G", "text": "Yes / Yes / Yes"}, {"letter": "H", "text": "Yes / No / Yes"}], "correct": "F", "correctLabel": "Correct answer", "details": "### Explanation\n\nCommitments can discount eligible usage but do not universally cover unrelated charges.\n\n### Statement-by-statement correction\n\n- **Reservations discount every Azure charge, including unrelated network traffic. — No.**\n- **A savings plan requires no spending commitment. — No.**\n- **A commitment guarantees that all storage and networking charges are covered. — No.**\n\n### Key concept to remember\n\nUnderstand what usage qualifies for a discount rather than assuming a commitment covers the whole bill.", "chapter": 9, "format": "statements", "items": ["Reservations discount every Azure charge, including unrelated network traffic.", "A savings plan requires no spending commitment.", "A commitment guarantees that all storage and networking charges are covered."], "intro": "Select Yes or No:", "revision": 4, "rationales": ["Reservations discount eligible usage rather than every charge.", "Savings plans require an hourly spending commitment.", "Unrelated storage and networking charges are not universally covered."]}, {"id": 175, "sourceId": 175, "title": "Cost reduction after testing", "prompt": "A team finishes testing an Azure VM and wants to stop its regular compute charges while retaining its OS disk for later use. What should it do?", "options": [{"letter": "A", "text": "Add a cost-center tag"}, {"letter": "B", "text": "Deallocate the VM"}, {"letter": "C", "text": "Create a budget alert"}, {"letter": "D", "text": "Apply a CanNotDelete lock"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nDeallocation releases the compute allocation while disks can remain.\n\n### Why the other answers are incorrect\n\n- **A. Add a cost-center tag:** Tags categorize expenditure; they do not stop compute billing.\n- **C. Create a budget alert:** It monitors spending without automatically releasing compute.\n- **D. Apply a CanNotDelete lock:** It prevents deletion, not compute charges.\n\n### Key concept to remember\n\nDeallocation and deletion are different; retained storage may remain billable.", "chapter": 9, "format": "scenario"}, {"id": 176, "sourceId": 176, "title": "Policy initiative", "prompt": "An organization must apply a set of ten related resource configuration policies as one compliance package. Which Azure Policy feature meets this need?", "options": [{"letter": "A", "text": "Azure RBAC role"}, {"letter": "B", "text": "Resource lock"}, {"letter": "C", "text": "Resource group"}, {"letter": "D", "text": "Policy initiative"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nAn initiative groups policy definitions for coordinated assignment and compliance evaluation.\n\n### Why the other answers are incorrect\n\n- **A. Azure RBAC role:** It groups permissions, not resource configuration rules.\n- **B. Resource lock:** It protects operations from accidental change or deletion.\n- **C. Resource group:** It groups resources, not policy definitions.\n\n### Key concept to remember\n\nAn initiative combines multiple policy definitions into one logical governance package.", "chapter": 10, "format": "scenario"}, {"id": 177, "sourceId": 177, "title": "Policy effects", "prompt": "A team wants to identify existing resources that violate a new configuration standard, without immediately blocking deployments. Which policy effect is appropriate for reporting noncompliance?", "options": [{"letter": "A", "text": "Contributor"}, {"letter": "B", "text": "Audit"}, {"letter": "C", "text": "ReadOnly"}, {"letter": "D", "text": "Deny"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nAudit records noncompliance without the Deny effect blocking the resource operation.\n\n### Why the other answers are incorrect\n\n- **A. Contributor:** This is an RBAC role, not a policy effect.\n- **C. ReadOnly:** This is a resource lock type, not the requested policy effect.\n- **D. Deny:** It blocks applicable noncompliant requests.\n\n### Key concept to remember\n\nAudit evaluates and reports; Deny enforces by blocking noncompliant requests.", "chapter": 10, "format": "scenario"}, {"id": 178, "sourceId": 178, "title": "Tag enforcement", "prompt": "An organization requires every newly deployed supported resource to have a CostCenter tag. Which service can enforce this requirement?", "options": [{"letter": "A", "text": "Azure Advisor"}, {"letter": "B", "text": "Azure Policy"}, {"letter": "C", "text": "Azure RBAC Reader"}, {"letter": "D", "text": "Azure Tags alone"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nA policy can require the tag and deny noncompliant deployments.\n\n### Why the other answers are incorrect\n\n- **A. Azure Advisor:** It offers recommendations, not mandatory enforcement.\n- **C. Azure RBAC Reader:** Reader controls access, not resource property requirements.\n- **D. Azure Tags alone:** Tags provide metadata but do not enforce their own presence.\n\n### Key concept to remember\n\nTags describe resources; Policy can enforce required tags.", "chapter": 10, "format": "scenario"}, {"id": 179, "sourceId": 179, "title": "Tag inheritance", "prompt": "Select Yes or No: (1) Tags can help categorize costs by project. (2) Resource group tags are not automatically inherited by resources by default. (3) Azure Policy can implement tag inheritance for supported resources.", "options": [{"letter": "A", "text": "Yes / No / Yes"}, {"letter": "B", "text": "Yes / No / No"}, {"letter": "C", "text": "Yes / Yes / Yes"}, {"letter": "D", "text": "Yes / Yes / No"}, {"letter": "E", "text": "No / Yes / No"}, {"letter": "F", "text": "No / No / Yes"}, {"letter": "G", "text": "No / Yes / Yes"}, {"letter": "H", "text": "No / No / No"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nTags are useful metadata, but resource tag inheritance is not automatic and can be implemented by policy.\n\n### Statement-by-statement correction\n\n- **Tags can help categorize costs by project. — Yes.**\n- **Resource group tags are not automatically inherited by resources by default. — Yes.**\n- **Azure Policy can implement tag inheritance for supported resources. — Yes.**\n\n### Key concept to remember\n\nDo not confuse inherited RBAC and policy assignments with resource metadata inheritance.", "chapter": 10, "format": "statements", "items": ["Tags can help categorize costs by project.", "Resource group tags are not automatically inherited by resources by default.", "Azure Policy can implement tag inheritance for supported resources."], "intro": "Select Yes or No:", "revision": 4, "rationales": ["Tags can help allocate costs by project.", "Resource tags do not automatically inherit resource-group tags by default.", "Azure Policy can implement tag inheritance for supported resources."]}, {"id": 180, "sourceId": 180, "title": "Resource lock selection", "prompt": "Administrators must be able to change a storage account's configuration but must not accidentally delete the account. Which lock type should be applied?", "options": [{"letter": "A", "text": "ReadOnly"}, {"letter": "B", "text": "Azure tag"}, {"letter": "C", "text": "CanNotDelete"}, {"letter": "D", "text": "Reader role"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt permits management changes but blocks deletion while the lock remains.\n\n### Why the other answers are incorrect\n\n- **A. ReadOnly:** It also blocks management changes, exceeding the requirement.\n- **B. Azure tag:** Metadata does not prevent deletion.\n- **D. Reader role:** It prevents changes for that user and is not a resource-level safeguard.\n\n### Key concept to remember\n\nCanNotDelete allows modifications; ReadOnly blocks modifications and deletion at the protected management scope.", "chapter": 10, "format": "scenario"}, {"id": 181, "sourceId": 181, "title": "Resource lock scope", "prompt": "Select Yes or No: (1) Owners are exempt from all management-plane locks. (2) A user with permission to remove the lock can remove it. (3) A resource lock always prevents deletion of individual blobs inside a storage account.", "options": [{"letter": "A", "text": "No / No / No"}, {"letter": "B", "text": "No / Yes / No"}, {"letter": "C", "text": "Yes / No / Yes"}, {"letter": "D", "text": "Yes / Yes / No"}, {"letter": "E", "text": "No / Yes / Yes"}, {"letter": "F", "text": "Yes / No / No"}, {"letter": "G", "text": "Yes / Yes / Yes"}, {"letter": "H", "text": "No / No / Yes"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nLocks override applicable management operations, can be removed by authorized users, and do not generally protect data-plane operations.\n\n### Statement-by-statement correction\n\n- **Owners are exempt from all management-plane locks. — No.**\n- **A user with permission to remove the lock can remove it. — Yes.**\n- **A resource lock always prevents deletion of individual blobs inside a storage account. — No.**\n\n### Key concept to remember\n\nResource locks protect management-plane operations, not every action on stored data.", "chapter": 10, "format": "statements", "items": ["Owners are exempt from all management-plane locks.", "A user with permission to remove the lock can remove it.", "A resource lock always prevents deletion of individual blobs inside a storage account."], "intro": "Select Yes or No:", "revision": 4, "rationales": ["Management-plane locks can affect Owners as well as other users.", "A user with the required permission can remove a lock.", "Resource locks apply to management-plane operations and do not generally prevent blob data-plane deletion."]}, {"id": 182, "sourceId": 182, "title": "Service Trust Portal", "prompt": "An auditor asks for Microsoft's own third-party audit reports and compliance documentation about Azure. Which resource should the auditor consult?", "options": [{"letter": "A", "text": "Service Trust Portal"}, {"letter": "B", "text": "Microsoft Defender for Cloud"}, {"letter": "C", "text": "Azure Policy"}, {"letter": "D", "text": "Azure Monitor"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt provides Microsoft compliance reports, audits and security documentation.\n\n### Why the other answers are incorrect\n\n- **B. Microsoft Defender for Cloud:** It assesses the customer's cloud security posture and regulatory controls.\n- **C. Azure Policy:** It evaluates resource configurations.\n- **D. Azure Monitor:** It collects operational telemetry.\n\n### Key concept to remember\n\nService Trust Portal provides evidence about Microsoft's services; it does not certify your specific workload.", "chapter": 10, "format": "scenario"}, {"id": 183, "sourceId": 183, "title": "Microsoft Purview", "prompt": "A company needs to discover and classify sensitive data across its data estate so that it can understand where confidential information is stored. Which solution addresses this governance requirement?", "options": [{"letter": "A", "text": "Microsoft Entra Domain Services"}, {"letter": "B", "text": "Microsoft Purview"}, {"letter": "C", "text": "Azure Resource Health"}, {"letter": "D", "text": "Azure VM Scale Sets"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt provides data discovery, classification and governance capabilities.\n\n### Why the other answers are incorrect\n\n- **A. Microsoft Entra Domain Services:** It provides managed domain services.\n- **C. Azure Resource Health:** It reports the health of individual Azure resources.\n- **D. Azure VM Scale Sets:** They manage and scale VM instances.\n\n### Key concept to remember\n\nPurview addresses data governance and protection, not resource uptime or compute scaling.", "chapter": 10, "format": "scenario"}, {"id": 184, "sourceId": 184, "title": "Governance controls", "prompt": "Match each requirement: (1) Allow a user to view resource configuration only. (2) Require resources to use approved regions. (3) Prevent accidental resource deletion.", "options": [{"letter": "A", "text": "1 Azure RBAC Reader; 2 Azure Policy; 3 CanNotDelete lock"}, {"letter": "B", "text": "1 CanNotDelete lock; 2 Azure Policy; 3 Reader"}, {"letter": "C", "text": "1 Azure RBAC Reader; 2 CanNotDelete lock; 3 Azure Policy"}, {"letter": "D", "text": "1 Azure Policy; 2 Azure RBAC Reader; 3 CanNotDelete lock"}, {"letter": "E", "text": "1 Azure Policy; 2 CanNotDelete lock; 3 Azure RBAC Reader"}, {"letter": "F", "text": "1 CanNotDelete lock; 2 Azure RBAC Reader; 3 Azure Policy"}, {"letter": "G", "text": "1 CanNotDelete lock; 2 Azure Policy; 3 Azure RBAC Reader"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nEach feature meets the specific permission, configuration or protection requirement.\n\n### Correct associations\n\n- **Allow a user to view resource configuration only.** → Azure RBAC Reader\n- **Require resources to use approved regions.** → Azure Policy\n- **Prevent accidental resource deletion.** → CanNotDelete lock\n\n### Key concept to remember\n\nRBAC controls who; Policy controls allowed configurations; locks protect resource operations.", "chapter": 10, "format": "matching", "items": ["Allow a user to view resource configuration only.", "Require resources to use approved regions.", "Prevent accidental resource deletion."], "intro": "Match each requirement:", "targets": ["Azure RBAC Reader", "Azure Policy", "CanNotDelete lock"]}, {"id": 185, "sourceId": 185, "title": "Azure PowerShell", "prompt": "A Windows administrator already writes PowerShell scripts and wants to manage Azure resources using cmdlets such as Get-AzVM. Which tool should be used?", "options": [{"letter": "A", "text": "Azure Storage Explorer"}, {"letter": "B", "text": "Azure PowerShell"}, {"letter": "C", "text": "Azure CLI"}, {"letter": "D", "text": "Azure Resource Health"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nThe Az PowerShell modules provide Azure management cmdlets.\n\n### Why the other answers are incorrect\n\n- **A. Azure Storage Explorer:** It is a graphical storage management tool.\n- **C. Azure CLI:** It uses az commands rather than PowerShell cmdlets.\n- **D. Azure Resource Health:** It provides resource health information.\n\n### Key concept to remember\n\nAzure PowerShell uses cmdlets; Azure CLI uses az commands and can run from different shells.", "chapter": 11, "format": "scenario"}, {"id": 186, "sourceId": 186, "title": "Azure CLI", "prompt": "An engineer wants to automate Azure resource management using az commands from a Linux terminal. Which tool provides these commands?", "options": [{"letter": "A", "text": "Bicep"}, {"letter": "B", "text": "Azure PowerShell"}, {"letter": "C", "text": "Azure CLI"}, {"letter": "D", "text": "Azure Portal"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt is the cross-platform command-line interface using az commands.\n\n### Why the other answers are incorrect\n\n- **A. Bicep:** It declares infrastructure rather than providing the az command interface.\n- **B. Azure PowerShell:** It uses Az PowerShell cmdlets.\n- **D. Azure Portal:** It is a browser graphical interface.\n\n### Key concept to remember\n\nAzure CLI is cross-platform; Cloud Shell can provide an authenticated environment for it.", "chapter": 11, "format": "scenario"}, {"id": 187, "sourceId": 187, "title": "Cloud Shell", "prompt": "Which TWO statements about Azure Cloud Shell are correct? (1) It is accessible through a browser. (2) It supports Bash and PowerShell. (3) It is required for every Azure deployment. (4) All resources deployed from Cloud Shell are free.", "options": [{"letter": "A", "text": "1 and 2"}, {"letter": "B", "text": "2 and 4"}, {"letter": "C", "text": "2 and 3"}, {"letter": "D", "text": "3 and 4"}, {"letter": "E", "text": "1 and 3"}, {"letter": "F", "text": "1 and 4"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nCloud Shell provides an authenticated browser-based Bash or PowerShell environment.\n\n### Why the other answers are incorrect\n\n- **B. 2 and 4:** Billable resources deployed through Cloud Shell still incur charges.\n- **C. 2 and 3:** Statement(s) 3 are not correct; statement(s) 1 are required. Cloud Shell is a convenient management environment, not a special free resource pricing model.\n- **D. 3 and 4:** Neither statement is true.\n- **E. 1 and 3:** Other Azure management tools can deploy resources.\n- **F. 1 and 4:** Statement(s) 4 are not correct; statement(s) 2 are required. Cloud Shell is a convenient management environment, not a special free resource pricing model.\n\n### Key concept to remember\n\nCloud Shell is a convenient management environment, not a special free resource pricing model.", "chapter": 11, "format": "multiple", "items": ["It is accessible through a browser.", "It supports Bash and PowerShell.", "It is required for every Azure deployment.", "All resources deployed from Cloud Shell are free."], "intro": "Which TWO statements about Azur
