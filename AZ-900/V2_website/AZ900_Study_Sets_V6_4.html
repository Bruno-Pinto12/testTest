w applications to **read from the supported secondary-region endpoint** **without first failing over** the storage account. They **do not add extra replicas**, and asynchronous replication means secondary reads may return older data."},{"id":82,"term":"AzCopy","definition":"AzCopy is a command-line tool for transferring data to, from and between supported Azure storage resources. It can be used in scripts to automate large uploads, downloads and copy operations. It is primarily a transfer utility, whereas Azure Storage Explorer provides a graphical storage management interface.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"AzCopy is a **command-line tool** for **transferring data** to, from and between supported Azure storage resources. It can be used in **scripts to automate** large uploads, downloads and copy operations. It is primarily a transfer utility, whereas Azure Storage Explorer provides a graphical storage management interface."},{"id":83,"term":"Azure Storage Explorer","definition":"Azure Storage Explorer is a graphical desktop application for browsing and managing supported Azure storage resources. It allows users to inspect containers, file shares, queues and tables and perform operations such as uploads and downloads. Unlike AzCopy, it is primarily designed for interactive graphical management.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Azure Storage Explorer is a **graphical desktop application** for **browsing and managing** supported Azure storage resources. It allows users to inspect containers, file shares, queues and tables and perform operations such as uploads and downloads. Unlike AzCopy, it is primarily designed for **interactive graphical management**."},{"id":84,"term":"Azure File Sync","definition":"Azure File Sync synchronizes supported Azure file shares with Windows Server file servers in both directions. It enables local file access while centralizing data in Azure Files, with optional cloud tiering to reduce local disk usage. Changes made directly in the cloud share may wait for periodic change detection, normally 24 hours.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Azure File Sync **synchronizes supported Azure file shares with Windows Server file servers in both directions**. It enables local file access while centralizing data in Azure Files, with optional **cloud tiering** to reduce local disk usage. Changes made directly in the cloud share may wait for periodic change detection, **normally 24 hours**."},{"id":85,"term":"Azure Migrate","definition":"Azure Migrate provides tools to discover, assess and migrate workloads from existing environments to Azure. It helps identify dependencies, evaluate readiness, estimate resource requirements and coordinate migration. It focuses on workload migration rather than simply transporting large quantities of data.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Azure Migrate provides tools to **discover, assess and migrate workloads** from existing environments to Azure. It helps identify dependencies, **evaluate readiness**, estimate resource requirements and **coordinate migration**. It focuses on workload migration rather than simply transporting large quantities of data."},{"id":86,"term":"Azure Data Box","definition":"Azure Data Box transfers large volumes of data using a physical storage device supplied by Microsoft. Data is copied onto the device and transported to or from an Azure facility, reducing reliance on lengthy network transfers. It is a temporary data-transfer service rather than a permanent storage tier.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Azure Data Box transfers **large volumes of data** using a **physical storage device** supplied by Microsoft. Data is copied onto the device and transported to or from an Azure facility, **reducing reliance on lengthy network transfers**. It is a temporary data-transfer service rather than a permanent storage tier."},{"id":87,"term":"Standard general-purpose v2 (StorageV2 / GPv2)","definition":"Standard general-purpose v2 is the recommended general Azure storage account type for most standard storage workloads. It supports Blob Storage, Azure Files, Queue Storage and Table Storage, with applicable access tiers and redundancy options. Specialized premium accounts offer different performance or service capabilities.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Standard general-purpose v2 is the **recommended general Azure storage account type** for most standard storage workloads. It supports **Blob Storage, Azure Files, Queue Storage and Table Storage**, with applicable access tiers and redundancy options. Specialized premium accounts offer different performance or service capabilities."},{"id":88,"term":"Premium block blob account (BlockBlobStorage)","definition":"A premium block blob account is a specialized storage account optimized for high-performance block and append blob workloads. It is designed for applications with low-latency storage requirements or high transaction rates. It does not provide the full range of services available in a general-purpose v2 account.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"A premium block blob account is a specialized storage account optimized for **high-performance block and append blob workloads**. It is designed for applications with **low-latency storage requirements** or **high transaction rates**. It does not provide the full range of services available in a general-purpose v2 account."},{"id":89,"term":"Premium file share account (FileStorage)","definition":"A premium file share account is a specialized Azure storage account for high-performance managed file shares. It is designed for workloads that require strong file-operation performance and supports SMB or NFS depending on share configuration. It is intended for Azure Files rather than general-purpose object, queue or table storage.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"A premium file share account is a specialized Azure storage account for **high-performance managed file shares**. It is designed for workloads that require strong file-operation performance and supports **SMB or NFS** depending on share configuration. It is intended for **Azure Files** rather than general-purpose object, queue or table storage."},{"id":90,"term":"Premium page blob account","definition":"A premium page blob account is specialized for workloads requiring efficient random reads and writes to ranges of data within page blobs. It differs from storage optimized for block blobs or file shares. Modern Azure VM operating system and data disks are normally deployed as separate managed disk resources.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"A premium page blob account is specialized for workloads requiring **efficient random reads and writes** to ranges of data within **page blobs**. It differs from storage optimized for block blobs or file shares. Modern Azure VM operating system and data disks are normally deployed as separate **managed disk resources**."},{"id":91,"term":"Microsoft Entra ID (formerly Azure AD)","definition":"Microsoft Entra ID is Microsoft's cloud identity and access management service, formerly called Azure Active Directory. It provides a directory of users, groups and applications and supports authentication and access to integrated services. An Entra tenant is a dedicated directory instance, separate from Azure subscriptions and their resource-management permissions.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Microsoft Entra ID is Microsoft's **cloud identity and access management service**, **formerly called Azure Active Directory**. It provides a **directory of users, groups and applications** and supports authentication and access to integrated services. An Entra tenant is a dedicated directory instance, separate from Azure subscriptions and their resource-management permissions."},{"id":92,"term":"Microsoft Entra Domain Services","definition":"Microsoft Entra Domain Services provides managed traditional domain capabilities, including domain join, LDAP, Kerberos and NTLM. It supports applications that depend on traditional Active Directory protocols without requiring customers to deploy and maintain their own domain controllers. It is different from ordinary Entra ID cloud authentication.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Microsoft Entra Domain Services provides **managed traditional domain capabilities**, including **domain join, LDAP, Kerberos and NTLM**. It supports applications that depend on traditional Active Directory protocols **without requiring customers to deploy and maintain their own domain controllers**. It is different from ordinary Entra ID cloud authentication."},{"id":93,"term":"Authentication - AuthN","definition":"Authentication is the process of verifying that a user, device or service is the identity it claims to be. It can use credentials such as passwords, security keys or biometric methods. Successful authentication establishes identity but does not automatically grant permission to access a resource; authorization determines the permitted actions.","priority":"Related","chapter":8,"refs":"","highlightedDefinition":"Authentication is the process of **verifying that a user, device or service is the identity it claims to be**. It can use credentials such as **passwords, security keys or biometric methods**. Successful authentication establishes identity but **does not automatically grant permission** to access a resource; authorization determines the permitted actions."},{"id":94,"term":"Authorization - AuthZ","definition":"Authorization is the process of determining which resources or operations an authenticated identity is permitted to access. It uses permissions, roles and applicable policies to allow or deny actions. In Azure, RBAC provides authorization for Azure resource operations at defined management scopes.","priority":"Related","chapter":8,"refs":"","highlightedDefinition":"Authorization is the process of determining **which resources or operations an authenticated identity is permitted to access**. It uses **permissions, roles and applicable policies** to allow or deny actions. In Azure, **RBAC provides authorization** for Azure resource operations at defined management scopes."},{"id":95,"term":"Single sign-on - SSO","definition":"Single sign-on allows an identity to authenticate once and subsequently access multiple integrated applications without repeatedly entering credentials. It relies on a shared or trusted identity system. Application configuration and access policies can still require new authentication or additional verification under certain conditions.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Single sign-on allows an identity to **authenticate once** and subsequently **access multiple integrated applications** **without repeatedly entering credentials**. It relies on a shared or trusted identity system. Application configuration and access policies can still require new authentication or additional verification under certain conditions."},{"id":96,"term":"Multifactor authentication (MFA)","definition":"Multifactor authentication verifies identity using factors from at least two distinct categories: something the user knows, possesses or inherently is. Combining different factor types makes compromised passwords alone less useful to an attacker. Two passwords or two prompts from the same factor category do not constitute MFA.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Multifactor authentication verifies identity using factors from **at least two distinct categories**: something the user **knows, possesses or inherently is**. Combining different factor types makes compromised passwords alone less useful to an attacker. Two passwords or two prompts from the **same factor category do not constitute MFA**."},{"id":97,"term":"Passwordless authentication","definition":"Passwordless authentication verifies identity without requiring the user to enter an account password. It can use methods such as passkeys, security keys or Windows Hello for Business, which rely on alternative credentials. Passwordless authentication can still satisfy multifactor requirements when the method provides appropriate factors.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Passwordless authentication verifies identity **without requiring the user to enter an account password**. It can use methods such as **passkeys, security keys or Windows Hello for Business**, which rely on alternative credentials. Passwordless authentication can still satisfy **multifactor requirements** when the method provides appropriate factors."},{"id":98,"term":"Microsoft Entra Conditional Access","definition":"Microsoft Entra Conditional Access evaluates signals such as the user, target application, device state, network location and risk to make access decisions. It can block access or require controls such as MFA or a compliant device. Its available signals and controls depend on licensing and configuration; risk detection can be supplied by Entra ID Protection.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Microsoft Entra Conditional Access **evaluates signals** such as the user, target application, **device state, network location and risk** to make access decisions. It can **block access or require controls such as MFA** or a compliant device. Its available signals and controls depend on licensing and configuration; risk detection can be supplied by Entra ID Protection."},{"id":99,"term":"External identities","definition":"External identities are identities belonging to people outside an organization's workforce, including business partners, suppliers and customers. Microsoft Entra External ID supports configured collaboration and customer sign-in scenarios. The appropriate setup depends on whether the user needs access to organizational resources or a customer-facing application.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"External identities are identities belonging to people **outside an organization's workforce**, including **business partners, suppliers and customers**. **Microsoft Entra External ID** supports configured collaboration and customer sign-in scenarios. The appropriate setup depends on whether the user needs access to organizational resources or a customer-facing application."},{"id":100,"term":"Microsoft Entra B2B collaboration","definition":"Microsoft Entra B2B collaboration allows external users to access an organization's applications and resources using their existing identities. The host tenant represents the external person with a user object, commonly of type Guest, and controls their permissions and applicable access policies. Invitation or authentication alone does not grant unrestricted access.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Microsoft Entra B2B collaboration allows **external users** to access an organization's applications and resources **using their existing identities**. The host tenant represents the external person with a **user object, commonly of type Guest**, and **controls their permissions** and applicable access policies. Invitation or authentication alone does not grant unrestricted access."},{"id":101,"term":"Microsoft Entra External ID for customers","definition":"Microsoft Entra External ID for customers provides identity and access management for customer-facing applications, including customer registration and sign-in. It is configured for external consumer or business-customer identity experiences rather than ordinary workforce guest collaboration. Azure AD B2C is a separate legacy offering.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Microsoft Entra External ID for customers provides **identity and access management for customer-facing applications**, including **customer registration and sign-in**. It is configured for external consumer or business-customer identity experiences **rather than ordinary workforce guest collaboration**. Azure AD B2C is a separate legacy offering."},{"id":102,"term":"Azure role-based access control - Azure RBAC","definition":"Azure role-based access control is an authorization system that grants identities specific permissions to Azure resources at a defined scope. A role assignment connects a security principal, a role containing permissions, and the applicable scope. RBAC determines who can perform actions, whereas Azure Policy governs resource configuration requirements.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Azure role-based access control is an **authorization system** that grants identities **specific permissions** to Azure resources at a defined scope. A role assignment connects a **security principal, a role containing permissions, and the applicable scope**. RBAC determines who can perform actions, whereas Azure Policy governs resource configuration requirements."},{"id":103,"term":"Owner (Azure RBAC)","definition":"Owner is a built-in Azure RBAC role that allows an identity to manage resources and grant Azure RBAC access within its assigned scope. Its permissions remain subject to applicable restrictions, including resource locks and other access controls. Owner is broader than Contributor because it includes access-management permissions.","priority":"Related","chapter":8,"refs":"","highlightedDefinition":"Owner is a built-in Azure RBAC role that allows an identity to **manage resources and grant Azure RBAC access** within its assigned scope. Its permissions remain subject to applicable restrictions, including resource locks and other access controls. Owner is broader than Contributor because it includes **access-management permissions**."},{"id":104,"term":"Contributor (Azure RBAC)","definition":"Contributor is a built-in Azure RBAC role that allows an identity to create, modify and manage Azure resources within its assigned scope. The role does not allow the identity to assign Azure RBAC roles to other identities. Access to service data may require additional permissions.","priority":"Related","chapter":8,"refs":"","highlightedDefinition":"Contributor is a built-in Azure RBAC role that allows an identity to **create, modify and manage Azure resources** within its assigned scope. The role **does not allow the identity to assign Azure RBAC roles** to other identities. Access to service data may require additional permissions."},{"id":105,"term":"Reader (Azure RBAC)","definition":"Reader is a built-in Azure RBAC role that permits viewing Azure resource management information without modifying the resources. It does not automatically grant access to data stored inside every service. Reading storage blobs or other service data can require a separate data-plane role.","priority":"Related","chapter":8,"refs":"","highlightedDefinition":"Reader is a built-in Azure RBAC role that permits **viewing Azure resource management information** **without modifying the resources**. It does not automatically grant access to data stored inside every service. Reading storage blobs or other service data can require a **separate data-plane role**."},{"id":106,"term":"Zero Trust","definition":"Zero Trust is a security model that assumes no identity, device or request is automatically trustworthy, even inside a corporate network. Its three principles are verify explicitly, use least privilege and assume breach. Access decisions rely on available signals and aim to minimize permissions and the impact of compromise.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Zero Trust is a security model that assumes **no identity, device or request is automatically trustworthy**, even inside a corporate network. Its three principles are **verify explicitly, use least privilege and assume breach**. Access decisions rely on available signals and aim to minimize permissions and the impact of compromise."},{"id":107,"term":"Defense in depth","definition":"Defense in depth is a security strategy that applies multiple independent layers of protection across physical infrastructure, identity, perimeter, network, compute, applications and data. If one layer is bypassed or fails, other layers can reduce the likelihood or impact of compromise. It avoids relying on a single security control.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Defense in depth is a security strategy that applies **multiple independent layers of protection** across physical infrastructure, identity, perimeter, network, compute, applications and data. If one layer is bypassed or fails, **other layers can reduce the likelihood or impact of compromise**. It avoids relying on a single security control."},{"id":108,"term":"Microsoft Defender for Cloud","definition":"Microsoft Defender for Cloud provides cloud security posture management and workload protection capabilities. It assesses resource configurations, identifies security weaknesses and recommends improvements; supported protection plans can also detect threats to workloads. Some features and plans require paid licensing or activation.","priority":"Core","chapter":8,"refs":"","highlightedDefinition":"Microsoft Defender for Cloud provides **cloud security posture management and workload protection** capabilities. It **assesses resource configurations**, identifies security weaknesses and recommends improvements; supported protection plans can also **detect threats to workloads**. Some features and plans require paid licensing or activation."},{"id":109,"term":"Role assignment","definition":"A role assignment is the Azure RBAC configuration that grants a particular role to a security principal at a specified scope. The principal identifies who receives access, the role defines permitted actions, and the scope determines where those permissions apply. Applicable assignments can inherit to lower scopes.","priority":"Related","chapter":8,"refs":"","highlightedDefinition":"A role assignment is the Azure RBAC configuration that **grants a particular role to a security principal at a specified scope**. The principal identifies **who receives access**, the role defines **permitted actions**, and the scope determines **where those permissions apply**. Applicable assignments can inherit to lower scopes."},{"id":110,"term":"User Access Administrator","definition":"User Access Administrator is a built-in Azure RBAC role focused on managing access to Azure resources. It allows an authorized identity to manage Azure role assignments within its assigned scope. Its primary purpose is access administration rather than general resource deployment or application management.","priority":"Related","chapter":8,"refs":"","highlightedDefinition":"User Access Administrator is a built-in Azure RBAC role focused on **managing access to Azure resources**. It allows an authorized identity to **manage Azure role assignments** within its assigned scope. Its primary purpose is access administration rather than general resource deployment or application management."},{"id":111,"term":"Pricing calculator","definition":"The Azure Pricing Calculator estimates the expected cost of a planned Azure deployment based on selected services, configurations, regions and estimated usage. It helps compare deployment options before resources are created. Estimates are not guaranteed invoices and may differ from actual charges.","priority":"Core","chapter":9,"refs":"","highlightedDefinition":"The Azure Pricing Calculator **estimates the expected cost** of a **planned Azure deployment** based on selected services, configurations, regions and estimated usage. It helps compare deployment options **before resources are created**. Estimates are not guaranteed invoices and may differ from actual charges."},{"id":112,"term":"Microsoft Cost Management","definition":"Microsoft Cost Management provides tools for analyzing actual Azure spending, forecasting costs and allocating expenditure by relevant dimensions such as subscriptions or tags. It supports budgets and cost alerts to help track spending against targets. A budget or alert does not automatically stop or deallocate resources.","priority":"Core","chapter":9,"refs":"","highlightedDefinition":"Microsoft Cost Management provides tools for **analyzing actual Azure spending**, **forecasting costs** and allocating expenditure by relevant dimensions such as subscriptions or tags. It supports **budgets and cost alerts** to help track spending against targets. A budget or alert **does not automatically stop or deallocate resources**."},{"id":113,"term":"Azure Reservations","definition":"Azure Reservations provide discounted pricing for eligible Azure resource usage in exchange for a term commitment, commonly one or three years. They are suited to predictable workloads that can make consistent use of the reservation benefit. A reservation is a billing benefit, not a guarantee of compute capacity; unused commitments and other resource charges may still cost money.","priority":"Related","chapter":9,"refs":"","highlightedDefinition":"Azure Reservations provide **discounted pricing** for eligible Azure resource usage in exchange for a **term commitment**, commonly **one or three years**. They are suited to **predictable workloads** that can make consistent use of the reservation benefit. A reservation is a billing benefit, **not a guarantee of compute capacity**; unused commitments and other resource charges may still cost money."},{"id":114,"term":"Azure savings plan for compute","definition":"An Azure savings plan for compute provides discounted eligible compute usage in exchange for a fixed hourly spending commitment over one or three years. The benefit can apply across eligible compute resources, offering more flexibility than many resource-specific reservations. The hourly commitment remains payable even if the eligible usage is lower than expected.","priority":"Related","chapter":9,"refs":"","highlightedDefinition":"An Azure savings plan for compute provides **discounted eligible compute usage** in exchange for a **fixed hourly spending commitment** over **one or three years**. The benefit can apply across eligible compute resources, offering more flexibility than many resource-specific reservations. The hourly commitment **remains payable** even if the eligible usage is lower than expected."},{"id":115,"term":"Azure Spot Virtual Machines","definition":"Azure Spot Virtual Machines use spare Azure compute capacity at discounted prices. Azure may evict these VMs when capacity is needed or applicable price conditions are met, so their availability is not guaranteed. They are suitable for interruption-tolerant workloads that can recover or restart when an instance is removed.","priority":"Related","chapter":9,"refs":"","highlightedDefinition":"Azure Spot Virtual Machines use **spare Azure compute capacity** at **discounted prices**. Azure may **evict these VMs** when capacity is needed or applicable price conditions are met, so their availability is not guaranteed. They are suitable for **interruption-tolerant workloads** that can recover or restart when an instance is removed."},{"id":116,"term":"Azure Hybrid Benefit","definition":"Azure Hybrid Benefit is a licensing benefit that allows customers to reuse eligible existing software licenses for supported Azure workloads under applicable licensing conditions. It can reduce the software licensing component of Azure charges for qualifying products such as Windows Server or SQL Server. Eligibility and applicable license terms must be checked.","priority":"Related","chapter":9,"refs":"","highlightedDefinition":"Azure Hybrid Benefit is a licensing benefit that allows customers to **reuse eligible existing software licenses** for supported Azure workloads under applicable licensing conditions. It can **reduce the software licensing component** of Azure charges for qualifying products such as **Windows Server or SQL Server**. Eligibility and applicable license terms must be checked."},{"id":117,"term":"Tags","definition":"Tags are key-value metadata attached to supported Azure resources and management scopes to describe properties such as department, environment or application. They support organization, filtering and cost allocation. Tags do not grant access permissions and are not automatically inherited from parent scopes without additional configuration.","priority":"Core","chapter":9,"refs":"","highlightedDefinition":"Tags are **key-value metadata** attached to supported Azure resources and management scopes to describe properties such as department, environment or application. They support **organization, filtering and cost allocation**. Tags do not grant access permissions and are **not automatically inherited** from parent scopes without additional configuration."},{"id":118,"term":"Azure pricing factors","definition":"Azure pricing depends on the resources selected and how they are configured and used. Factors include resource type, size, region, storage tier, licensing, pricing commitments, usage and network data transfer. Outbound and inter-region data transfer can incur charges, so the total cost of a workload can extend beyond its compute charges.","priority":"Core","chapter":9,"refs":"","highlightedDefinition":"Azure pricing depends on the resources selected and how they are configured and used. Factors include **resource type, size, region, storage tier, licensing, pricing commitments, usage and network data transfer**. **Outbound and inter-region data transfer** can incur charges, so the total cost of a workload can extend beyond its compute charges."},{"id":119,"term":"Azure Policy","definition":"Azure Policy is a governance service that evaluates resources against defined configuration requirements. Depending on the policy effect, it can audit noncompliance, deny unsuitable deployments or support remediation of existing resources. It governs the state of resources, whereas Azure RBAC controls which actions an identity is permitted to perform.","priority":"Core","chapter":10,"refs":"","highlightedDefinition":"Azure Policy is a **governance service** that evaluates resources against **defined configuration requirements**. Depending on the policy effect, it can **audit noncompliance, deny unsuitable deployments** or support remediation of existing resources. It **governs the state of resources**, whereas Azure RBAC controls which actions an identity is permitted to perform."},{"id":120,"term":"Policy definition","definition":"A policy definition describes a resource governance rule in Azure Policy. It contains conditions specifying which resources are evaluated and an effect that determines the action when those conditions are met. It becomes applicable to resources through a policy assignment.","priority":"Related","chapter":10,"refs":"","highlightedDefinition":"A policy definition describes a **resource governance rule** in Azure Policy. It contains **conditions** specifying which resources are evaluated and an **effect** that determines the action when those conditions are met. It becomes applicable to resources through a **policy assignment**."},{"id":121,"term":"Policy assignment","definition":"A policy assignment applies a policy definition or initiative to a specific Azure management scope. It specifies where resources are evaluated and may include parameter values, exclusions or exemptions as appropriate. Assignments can apply to existing and newly deployed resources within the applicable scope.","priority":"Related","chapter":10,"refs":"","highlightedDefinition":"A policy assignment **applies a policy definition or initiative** to a **specific Azure management scope**. It specifies where resources are evaluated and may include parameter values, exclusions or exemptions as appropriate. Assignments can apply to **existing and newly deployed resources** within the applicable scope."},{"id":122,"term":"Initiative","definition":"An initiative is a collection of Azure Policy definitions grouped together to address a common governance objective. It allows related requirements to be assigned and monitored as a single unit, simplifying consistent governance across resources. An initiative groups policies rather than RBAC roles.","priority":"Related","chapter":10,"refs":"","highlightedDefinition":"An initiative is a **collection of Azure Policy definitions** grouped together to address a **common governance objective**. It allows related requirements to be assigned and monitored as a **single unit**, simplifying consistent governance across resources. An initiative groups policies rather than RBAC roles."},{"id":123,"term":"Azure resource lock","definition":"An Azure resource lock protects Azure resources from accidental deletion or modification through management-plane operations. Locks apply even to users with Owner permissions until someone authorized removes them. They are not backups and do not generally prevent changes to data inside a service through its data plane.","priority":"Core","chapter":10,"refs":"","highlightedDefinition":"An Azure resource lock protects Azure resources from **accidental deletion or modification** through **management-plane operations**. Locks apply **even to users with Owner permissions** until someone authorized removes them. They are **not backups** and do not generally prevent changes to data inside a service through its data plane."},{"id":124,"term":"CanNotDelete (Delete) resource lock","definition":"A CanNotDelete resource lock, also called Delete, prevents management-plane deletion of resources in its applicable scope while allowing authorized read and modification operations. The lock can inherit from a parent scope to resources beneath it. Users with permission to remove the lock can remove it before deleting the resource.","priority":"Core","chapter":10,"refs":"","highlightedDefinition":"A CanNotDelete resource lock, also called Delete, **prevents management-plane deletion** of resources in its applicable scope while **allowing authorized read and modification operations**. The lock can **inherit from a parent scope** to resources beneath it. Users with permission to remove the lock can remove it before deleting the resource."},{"id":125,"term":"ReadOnly resource lock","definition":"A ReadOnly resource lock allows management-plane reads while generally preventing resource creation, configuration changes and deletion within its applicable scope. It is more restrictive than CanNotDelete. Some operations that appear to be read-only can also be blocked if they use management-plane write or POST requests.","priority":"Core","chapter":10,"refs":"","highlightedDefinition":"A ReadOnly resource lock **allows management-plane reads** while generally **preventing resource creation, configuration changes and deletion** within its applicable scope. It is **more restrictive than CanNotDelete**. Some operations that appear to be read-only can also be blocked if they use management-plane write or POST requests."},{"id":126,"term":"Microsoft Purview","definition":"Microsoft Purview provides capabilities for discovering, classifying, governing and protecting organizational data, as well as supporting compliance activities. Sensitivity labels can classify documents and apply persistent protection such as encryption, depending on configuration. Its focus is data governance and information protection rather than enforcing Azure resource deployment rules.","priority":"Core","chapter":10,"refs":"","highlightedDefinition":"Microsoft Purview provides capabilities for **discovering, classifying, governing and protecting organizational data**, as well as supporting compliance activities. **Sensitivity labels** can classify documents and apply **persistent protection such as encryption**, depending on configuration. Its focus is data governance and information protection rather than enforcing Azure resource deployment rules."},{"id":127,"term":"Azure portal","definition":"The Azure portal is a browser-based graphical interface for creating, configuring, monitoring and managing Azure resources. It presents resource settings and management tools through visual pages rather than requiring command-line commands. It is available at https://portal.azure.com and uses Azure's management platform to perform operations.","priority":"Core","chapter":11,"refs":"","highlightedDefinition":"The Azure portal is a **browser-based graphical interface** for **creating, configuring, monitoring and managing Azure resources**. It presents resource settings and management tools through visual pages rather than requiring command-line commands. It is available at https://portal.azure.com and uses Azure's management platform to perform operations."},{"id":128,"term":"Azure Cloud Shell","definition":"Azure Cloud Shell is a managed, browser-accessible command-line environment with Bash and PowerShell options and preinstalled Azure management tools. It allows users to run Azure CLI or Azure PowerShell commands without installing them locally. Resources deployed through the shell and applicable storage can still incur charges.","priority":"Core","chapter":11,"refs":"","highlightedDefinition":"Azure Cloud Shell is a **managed, browser-accessible command-line environment** with **Bash and PowerShell** options and preinstalled Azure management tools. It allows users to run Azure CLI or Azure PowerShell commands **without installing them locally**. Resources deployed through the shell and applicable storage can still incur charges."},{"id":129,"term":"Azure CLI","definition":"Azure CLI is a cross-platform command-line tool for creating, configuring and managing Azure resources. It uses commands beginning with `az` and supports interactive administration as well as scripted automation. It can be installed locally or used through Azure Cloud Shell.","priority":"Core","chapter":11,"refs":"","highlightedDefinition":"Azure CLI is a **cross-platform command-line tool** for creating, configuring and managing Azure resources. It uses commands beginning with `az` and supports interactive administration as well as **scripted automation**. It can be installed locally or used through **Azure Cloud Shell**."},{"id":130,"term":"Azure PowerShell","definition":"Azure PowerShell is a collection of PowerShell modules, including the `Az` modules, for managing Azure resources through cmdlets and scripts. It supports automation of Azure administration using PowerShell syntax and objects. Azure CLI can perform many equivalent operations but uses a different command syntax.","priority":"Core","chapter":11,"refs":"","highlightedDefinition":"Azure PowerShell is a collection of **PowerShell modules**, including the `Az` modules, for managing Azure resources through **cmdlets and scripts**. It supports automation of Azure administration using **PowerShell syntax and objects**. Azure CLI can perform many equivalent operations but uses a different command syntax."},{"id":131,"term":"Infrastructure as Code - IaC","definition":"Infrastructure as Code is the practice of defining infrastructure configurations in files rather than relying on manual deployment steps. These definitions can be version-controlled, reviewed and deployed repeatedly to create consistent environments. Azure supports declarative infrastructure deployment through ARM templates and Bicep.","priority":"Core","chapter":11,"refs":"","highlightedDefinition":"Infrastructure as Code is the practice of **defining infrastructure configurations in files** rather than relying on manual deployment steps. These definitions can be **version-controlled**, reviewed and **deployed repeatedly** to create consistent environments. Azure supports declarative infrastructure deployment through **ARM templates and Bicep**."},{"id":132,"term":"ARM template","definition":"An ARM template is a declarative JSON file that describes Azure resources and their desired configuration for deployment through Azure Resource Manager. ARM interprets the resource definitions and dependencies to perform deployment operations. Templates specify the desired infrastructure rather than a sequence of manual or shell commands.","priority":"Core","chapter":11,"refs":"","highlightedDefinition":"An ARM template is a **declarative JSON file** that describes Azure resources and their **desired configuration** for deployment through **Azure Resource Manager**. ARM interprets the resource definitions and dependencies to perform deployment operations. Templates specify the desired infrastructure **rather than a sequence of manual or shell commands**."},{"id":133,"term":"Bicep","definition":"Bicep is a declarative language designed to define Azure infrastructure using a more concise syntax than ARM template JSON. Bicep definitions are compiled into ARM templates and deployed through Azure Resource Manager. It is used to manage infrastructure as code, not to write application business logic.","priority":"Related","chapter":11,"refs":"","highlightedDefinition":"Bicep is a **declarative language** designed to define Azure infrastructure using a **more concise syntax than ARM template JSON**. Bicep definitions are **compiled into ARM templates** and deployed through Azure Resource Manager. It is used to manage infrastructure as code, not to write application business logic."},{"id":134,"term":"Azure Arc","definition":"Azure Arc extends supported Azure management and governance capabilities to resources located outside Azure, including on-premises infrastructure and other cloud environments. Connected resources can be represented in Azure and managed using supported services and policies. Arc does not physically move those resources into Azure.","priority":"Core","chapter":11,"refs":"","highlightedDefinition":"Azure Arc **extends supported Azure management and governance capabilities** to resources located **outside Azure**, including **on-premises infrastructure and other cloud environments**. Connected resources can be represented in Azure and managed using supported services and policies. Arc **does not physically move** those resources into Azure."},{"id":135,"term":"Azure Monitor","definition":"Azure Monitor is Azure's monitoring platform for collecting, analyzing and acting on infrastructure and application telemetry, including metrics, logs, traces and events. It provides tools for visualizing performance, investigating issues and triggering alerts or automated actions. It is the broader monitoring platform rather than a recommendation service such as Azure Advisor.","priority":"Core","chapter":12,"refs":"","highlightedDefinition":"Azure Monitor is Azure's monitoring platform for **collecting, analyzing and acting on** infrastructure and application telemetry, including **metrics, logs, traces and events**. It provides tools for visualizing performance, investigating issues and **triggering alerts or automated actions**. It is the broader monitoring platform rather than a recommendation service such as Azure Advisor."},{"id":136,"term":"Metrics","definition":"Metrics are numerical measurements collected over time to describe the behavior, performance or health of a system. Azure Monitor can display these time-series measurements, aggregate them and evaluate them against alert thresholds. Metrics represent measured values, such as CPU utilization, rather than detailed event records.","priority":"Related","chapter":12,"refs":"","highlightedDefinition":"Metrics are **numerical measurements collected over time** to describe the behavior, performance or health of a system. Azure Monitor can display these **time-series measurements**, aggregate them and evaluate them against alert thresholds. Metrics represent measured values, such as **CPU utilization**, rather than detailed event records."},{"id":137,"term":"Logs","definition":"Logs are recorded events or observations that contain information about system activity, errors, requests or other operations. They can include timestamps and contextual properties that support searching, filtering and correlation. Unlike numerical metrics, logs provide detailed records for investigating what happened and why.","priority":"Related","chapter":12,"refs":"","highlightedDefinition":"Logs are **recorded events or observations** that contain information about system activity, errors, requests or other operations. They can include **timestamps and contextual properties** that support searching, filtering and correlation. Unlike numerical metrics, logs provide **detailed records** for investigating what happened and why."},{"id":138,"term":"Log Analytics / Kusto Query Language (KQL)","definition":"Log Analytics is a tool in Azure Monitor for querying and analyzing collected log data. It uses Kusto Query Language (KQL) to filter, aggregate and correlate records, often across multiple resources in a workspace. Application Insights focuses on application observability, and its telemetry can also be investigated using queries.","priority":"Core","chapter":12,"refs":"","highlightedDefinition":"Log Analytics is a tool in Azure Monitor for **querying and analyzing collected log data**. It uses **Kusto Query Language (KQL)** to **filter, aggregate and correlate records**, often across multiple resources in a workspace. Application Insights focuses on application observability, and its telemetry can also be investigated using queries."},{"id":139,"term":"Log Analytics workspace","definition":"A Log Analytics workspace is a logical environment in Azure Monitor for collecting, storing and managing log data from supported resources. It provides a common scope for log queries and configuration of settings such as data retention and access permissions. Multiple resources can send relevant telemetry to the same workspace.","priority":"Related","chapter":12,"refs":"","highlightedDefinition":"A Log Analytics workspace is a logical environment in Azure Monitor for **collecting, storing and managing log data** from supported resources. It provides a **common scope for log queries** and configuration of settings such as **data retention and access permissions**. Multiple resources can send relevant telemetry to the same workspace."},{"id":140,"term":"Azure Monitor Application Insights","definition":"Application Insights is an application observability feature of Azure Monitor that collects telemetry from instrumented applications. It helps investigate application performance and failures using request rates, response times, exceptions, dependencies and related traces. Its focus is application behavior rather than only infrastructure-level resource utilization.","priority":"Core","chapter":12,"refs":"","highlightedDefinition":"Application Insights is an **application observability feature of Azure Monitor** that collects telemetry from instrumented applications. It helps investigate application performance and failures using **request rates, response times, exceptions, dependencies and related traces**. Its focus is application behavior rather than only infrastructure-level resource utilization."},{"id":141,"term":"Azure Service Health","definition":"Azure Service Health provides personalized information about Azure platform incidents, planned maintenance and health advisories relevant to a customer's subscriptions and services. It helps customers understand whether platform events may affect their environment and can provide notifications. Azure Status gives a public overview, while Resource Health focuses on individual resources.","priority":"Core","chapter":12,"refs":"","highlightedDefinition":"Azure Service Health provides **personalized information** about Azure **platform incidents, planned maintenance and health advisories** relevant to a **customer's subscriptions and services**. It helps customers understand whether platform events may affect their environment and can provide notifications. Azure Status gives a public overview, while Resource Health focuses on individual resources."},{"id":142,"term":"Azure Resource Health","definition":"Azure Resource Health provides information about the availability and health of a specific Azure resource. It helps determine whether a resource is experiencing problems related to the Azure platform and supports investigation of its health history. It is more resource-specific than Azure Service Health.","priority":"Related","chapter":12,"refs":"","highlightedDefinition":"Azure Resource Health provides information about the **availability and health of a specific Azure resource**. It helps determine whether a resource is experiencing problems related to the Azure platform and supports investigation of its **health history**. It is more resource-specific than Azure Service Health."},{"id":143,"term":"Azure Advisor","definition":"Azure Advisor analyzes deployed Azure resources and provides personalized recommendations in areas such as reliability, security, performance, operational excellence and cost. It identifies opportunities to improve existing configurations, but does not automatically implement every recommendation. Cost Management analyzes spending, while the Pricing Calculator estimates planned costs.","priority":"Core","chapter":12,"refs":"","highlightedDefinition":"Azure Advisor analyzes deployed Azure resources and provides **personalized recommendations** in areas such as **reliability, security, performance, operational excellence and cost**. It identifies opportunities to improve existing configurations, but **does not automatically implement every recommendation**. Cost Management analyzes spending, while the Pricing Calculator estimates planned costs."},{"id":144,"term":"Azure Monitor alerts / action groups","definition":"Azure Monitor alert rules detect defined conditions in supported telemetry or activity data, such as a metric exceeding a threshold. An action group specifies notifications or automated actions to execute when an associated alert fires. The alert rule determines when an issue is detected; the action group determines the configured response.","priority":"Related","chapter":12,"refs":"","highlightedDefinition":"Azure Monitor **alert rules detect defined conditions** in supported telemetry or activity data, such as a metric exceeding a threshold. An **action group specifies notifications or automated actions** to execute **when an associated alert fires**. The alert rule determines when an issue is detected; the action group determines the configured response."},{"id":145,"term":"Azure Status","definition":"Azure Status is a public service-health page that reports broadly significant issues affecting Azure services and regions. It provides a general overview without requiring access to a particular Azure subscription. It does not report every customer-specific incident; Azure Service Health provides more personalized information.","priority":"Related","chapter":12,"refs":"","highlightedDefinition":"Azure Status is a **public service-health page** that reports **broadly significant issues** affecting Azure services and regions. It provides a general overview **without requiring access to a particular Azure subscription**. It does not report every customer-specific incident; Azure Service Health provides more personalized information."},{"id":146,"term":"Azure Kubernetes Service (AKS)","definition":"Azure Kubernetes Service is a managed service for deploying and operating Kubernetes clusters on Azure. Azure manages the Kubernetes control plane, while other management responsibilities depend on the chosen mode. The service supports container scheduling, orchestration, scaling and deployment across cluster nodes. It is intended for workloads requiring Kubernetes capabilities rather than simple standalone container execution through ACI.","priority":"Optional","chapter":5,"refs":"Q25, Q43, Q50, Q98","highlightedDefinition":"Azure Kubernetes Service is a **managed service for deploying and operating Kubernetes clusters** on Azure. Azure manages the **Kubernetes control plane**, while other management responsibilities depend on the chosen mode. The service supports **container scheduling, orchestration, scaling and deployment** across cluster nodes. It is intended for workloads requiring Kubernetes capabilities rather than simple standalone container execution through ACI."},{"id":147,"term":"AKS virtual nodes / elastic bursting","definition":"AKS virtual nodes extend a Kubernetes cluster's available execution capacity by allowing eligible pods to run on Azure Container Instances. This supports elastic bursting without directly adding conventional VM-based cluster nodes for every workload. Virtual node integration must be configured, and not all pod features or workload types are supported.","priority":"Optional","chapter":5,"refs":"Q98","highlightedDefinition":"AKS virtual nodes extend a Kubernetes cluster's available execution capacity by allowing **eligible pods to run on Azure Container Instances**. This supports **elastic bursting** **without directly adding conventional VM-based cluster nodes** for every workload. Virtual node integration must be configured, and not all pod features or workload types are supported."},{"id":148,"term":"Transport Layer Security (TLS)","definition":"Transport Layer Security is a protocol that protects network traffic in transit through encryption and integrity protection, with authentication as applicable. HTTPS uses TLS to secure web connections. An App Service minimum TLS version of 1.2 also permits newer supported versions; TLS is distinct from encryption of stored data.","priority":"Optional","chapter":5,"refs":"Q33","highlightedDefinition":"Transport Layer Security is a protocol that **protects network traffic in transit** through **encryption and integrity protection**, with authentication as applicable. **HTTPS uses TLS** to secure web connections. An App Service minimum TLS version of 1.2 also permits **newer supported versions**; TLS is distinct from encryption of stored data."},{"id":149,"term":"Azure Virtual Network service endpoint","definition":"A virtual network service endpoint extends the identity of an authorized Azure subnet to supported Azure services through the Microsoft network. It allows service network-access rules to recognize that subnet while the service continues to use its public endpoint. Unlike a private endpoint, it does not assign a private IP for the service within the VNet.","priority":"Optional","chapter":6,"refs":"Q79, Q146","highlightedDefinition":"A virtual network service endpoint extends the **identity of an authorized Azure subnet** to supported Azure services through the **Microsoft network**. It allows service network-access rules to recognize that subnet while the service **continues to use its public endpoint**. Unlike a private endpoint, it **does not assign a private IP** for the service within the VNet."},{"id":150,"term":"Azure Firewall","definition":"Azure Firewall is a managed, centralized, stateful network security service for inspecting and filtering traffic routed through it. It can enforce network and application traffic rules across connected networks when routing is configured appropriately. Network Security Groups instead provide distributed traffic filtering at subnet or network-interface scope.","priority":"Optional","chapter":6,"refs":"Q54","highlightedDefinition":"Azure Firewall is a **managed, centralized, stateful network security service** for **inspecting and filtering traffic** routed through it. It can enforce **network and application traffic rules** across connected networks when routing is configured appropriately. Network Security Groups instead provide distributed traffic filtering at subnet or network-interface scope."},{"id":151,"term":"Azure Application Gateway / WAF","definition":"Azure Application Gateway is an application-layer load-balancing service for HTTP and HTTPS traffic, supporting routing decisions based on application-level information. Its optional Web Application Firewall helps protect web applications against common attacks such as SQL injection and cross-site scripting. It differs from layer-4 network load balancing.","priority":"Optional","chapter":6,"refs":"Q54, Q88","highlightedDefinition":"Azure Application Gateway is an **application-layer load-balancing** service for **HTTP and HTTPS** traffic, supporting routing decisions based on application-level information. Its optional **Web Application Firewall** helps protect web applications against common attacks such as **SQL injection and cross-site scripting**. It differs from layer-4 network load balancing."},{"id":152,"term":"Azure DDoS Protection","definition":"Azure DDoS Protection helps maintain service availability by detecting and mitigating distributed denial-of-service traffic. Azure provides built-in infrastructure protection, with enhanced IP Protection and Network Protection offerings for eligible resources. It focuses on network-level denial-of-service threats, while a WAF addresses common application-layer web attacks.","priority":"Optional","chapter":6,"refs":"Q100","highlightedDefinition":"Azure DDoS Protection helps maintain service availability by **detecting and mitigating distributed denial-of-service traffic**. Azure provides **built-in infrastructure protection**, with enhanced **IP Protection and Network Protection** offerings for eligible resources. It focuses on network-level denial-of-service threats, while a WAF addresses common application-layer web attacks."},{"id":153,"term":"Azure Bastion","definition":"Azure Bastion is a managed service that provides secure RDP and SSH connectivity to Azure virtual machines through supported connection methods. It allows administrators to access VMs without assigning a public IP address to each target VM or exposing its management ports directly to the internet. Bastion does not replace VM authentication or authorization.","priority":"Optional","chapter":6,"refs":"Brochure E","highlightedDefinition":"Azure Bastion is a managed service that provides **secure RDP and SSH connectivity** to Azure virtual machines through supported connection methods. It allows administrators to access VMs **without assigning a public IP address to each target VM** or exposing its **management ports** directly to the internet. Bastion does not replace VM authentication or authorization."},{"id":154,"term":"Azure Load Balancer","definition":"Azure Load Balancer distributes incoming TCP and UDP network traffic across healthy backend instances at layer 4 of the network model. It uses configured rules and health probes to direct traffic and improve workload availability. Unlike Application Gateway, it does not route requests based on HTTP application content.","priority":"Optional","chapter":6,"refs":"Brochure E","highlightedDefinition":"Azure Load Balancer distributes incoming **TCP and UDP network traffic** across **healthy backend instances** at **layer 4** of the network model. It uses configured rules and **health probes** to direct traffic and improve workload availability. Unlike Application Gateway, it does not route requests based on HTTP application content."},{"id":155,"term":"Smart tier (Blob Storage)","definition":"The Blob Storage Smart tier automatically transitions eligible data among the Hot, Cool and Cold online tiers according to access patterns. It helps balance storage and access costs without requiring every tier transition to be selected manually. It is not an offline archive tier and does not replace a separate archival strategy.","priority":"Optional","chapter":7,"refs":"Brochure 7","highlightedDefinition":"The Blob Storage Smart tier **automatically transitions eligible data** among the **Hot, Cool and Cold online tiers** according to **access patterns**. It helps balance storage and access costs without requiring every tier transition to be selected manually. It is not an offline archive tier and does not replace a separate archival strategy."},{"id":156,"term":"Microsoft Entra ID Protection","definition":"Microsoft Entra ID Protection, formerly Azure AD Identity Protection, detects risks associated with cloud identities and sign-ins. Its risk signals can be used by configured risk-based Conditional Access policies to block access or require remediation and additional verification where supported. Risk detection is distinct from enforcing access decisions.","priority":"Optional","chapter":8,"refs":"Q56, Q72","highlightedDefinition":"Microsoft Entra ID Protection, formerly Azure AD Identity Protection, **detects risks associated with cloud identities and sign-ins**. Its risk signals can be used by configured **risk-based Conditional Access policies** to block access or require remediation and additional verification where supported. **Risk detection is distinct from enforcing access decisions**."},{"id":157,"term":"Microsoft Entra Connect Sync","definition":"Microsoft Entra Connect Sync synchronizes identity information from on-premises Active Directory to Microsoft Entra ID, supporting hybrid identity arrangements. It helps users maintain a consistent identity across integrated on-premises and cloud services. Single sign-on and multifactor authentication depend on the configured integration and application support, not synchronization alone.","priority":"Optional","chapter":8,"refs":"Q68","highlightedDefinition":"Microsoft Entra Connect Sync **synchronizes identity information from on-premises Active Directory to Microsoft Entra ID**, supporting **hybrid identity** arrangements. It helps users maintain a consistent identity across integrated on-premises and cloud services. Single sign-on and multifactor authentication depend on the configured integration and application support, **not synchronization alone**."},{"id":158,"term":"Microsoft Entra B2B direct connect","definition":"Microsoft Entra B2B direct connect provides a cross-tenant collaboration arrangement between organizations for supported scenarios such as Teams shared channels. Users authenticate with their home organization under configured cross-tenant access settings. Unlike ordinary B2B collaboration, this scenario does not require a conventional guest user object in the resource tenant.","priority":"Optional","chapter":8,"refs":"Q159","highlightedDefinition":"Microsoft Entra B2B direct connect provides a **cross-tenant collaboration** arrangement between organizations for supported scenarios such as **Teams shared channels**. Users authenticate with their **home organization** under configured cross-tenant access settings. Unlike ordinary B2B collaboration, this scenario **does not require a conventional guest user object** in the resource tenant."},{"id":159,"term":"Security group / Microsoft 365 group","definition":"Security groups organize identities for collective permission assignments to supported resources. Microsoft 365 groups are primarily designed for collaboration, providing members with access to shared Microsoft 365 resources. Both group types can grant access in supported scenarios, but they serve different principal purposes.","priority":"Optional","chapter":8,"refs":"Q69","highlightedDefinition":"**Security groups** organize identities for **collective permission assignments** to supported resources. **Microsoft 365 groups** are **primarily designed for collaboration**, providing members with access to shared Microsoft 365 resources. Both group types can grant access in supported scenarios, but they serve different principal purposes."},{"id":160,"term":"Windows Hello for Business","definition":"Windows Hello for Business provides passwordless authentication on supported Windows devices through a device-bound credential. A locally verified PIN or biometric gesture unlocks the credential used to authenticate the user. The PIN is not a conventional account password transmitted to the identity provider.","priority":"Optional","chapter":8,"refs":"Q52","highlightedDefinition":"Windows Hello for Business provides **passwordless authentication** on supported Windows devices through a **device-bound credential**. A locally verified **PIN or biometric gesture** unlocks the credential used to authenticate the user. The PIN is not a conventional account password transmitted to the identity provider."},{"id":161,"term":"Microsoft Authenticator / OATH-TOTP","definition":"Microsoft Authenticator is an authentication application supporting compatible sign-in approval methods and time-based one-time passcodes. OATH-TOTP uses a time-based algorithm to generate temporary authentication codes; OTP refers more broadly to one-time passwords. Authenticator supplies authentication methods, whereas Conditional Access determines when additional verification is required.","priority":"Optional","chapter":8,"refs":"Q64","highlightedDefinition":"Microsoft Authenticator is an authentication application supporting compatible **sign-in approval methods** and **time-based one-time passcodes**. OATH-TOTP uses a time-based algorithm to generate **temporary authentication codes**; OTP refers more broadly to one-time passwords. Authenticator supplies authentication methods, whereas Conditional Access determines when additional verification is required."},{"id":162,"term":"Microsoft Defender for Identity","definition":"Microsoft Defender for Identity is a security service focused on detecting threats involving on-premises Active Directory and other supported identity environments. It analyzes identity-related activity to identify suspicious behavior and potential account compromise. It is the identity-focused service, distinct from Microsoft Defender for Endpoint, which focuses on endpoint threats.","priority":"Optional","chapter":8,"refs":"Q61 nuance","highlightedDefinition":"Microsoft Defender for Identity is a security service focused on **detecting threats involving on-premises Active Directory** and other supported identity environments. It analyzes **identity-related activity** to identify suspicious behavior and potential account compromise. It is the identity-focused service, **distinct from Microsoft Defender for Endpoint**, which focuses on endpoint threats."},{"id":163,"term":"Microsoft Defender for Endpoint","definition":"Microsoft Defender for Endpoint provides threat prevention, detection, investigation and response for supported endpoint devices and servers. It analyzes endpoint activity to help detect malware and other security threats. Its main purpose is endpoint security rather than monitoring Active Directory identities, which is the focus of Defender for Identity.","priority":"Optional","chapter":8,"refs":"Q61 nuance","highlightedDefinition":"Microsoft Defender for Endpoint provides **threat prevention, detection, investigation and response** for supported **endpoint devices and servers**. It analyzes endpoint activity to help detect malware and other security threats. Its main purpose is **endpoint security** rather than monitoring Active Directory identities, which is the focus of Defender for Identity."},{"id":164,"term":"Regulatory compliance dashboard (Defender for Cloud)","definition":"The regulatory compliance dashboard in Microsoft Defender for Cloud evaluates applicable resource configurations against supported technical controls from compliance standards, such as PCI DSS or HIPAA. It displays assessment results and helps identify areas requiring remediation. These technical assessments do not certify legal compliance or guarantee that every regulatory obligation has been met.","priority":"Optional","chapter":8,"refs":"Q65, Q85","highlightedDefinition":"The regulatory compliance dashboard in Microsoft Defender for Cloud **evaluates applicable resource configurations** against supported technical controls from compliance standards, such as **PCI DSS or HIPAA**. It displays assessment results and helps **identify areas requiring remediation**. These technical assessments **do not certify legal compliance** or guarantee that every regulatory obligation has been met."},{"id":165,"term":"Microsoft Entra Privileged Identity Management (PIM)","definition":"Microsoft Entra Privileged Identity Management controls and monitors privileged role access through mechanisms such as eligible assignments and time-limited activation. It helps reduce permanent administrative privileges by allowing authorized users to activate access when required. Additional approval, verification and auditing controls can be configured where supported.","priority":"Optional","chapter":8,"refs":"Brochure 8","highlightedDefinition":"Microsoft Entra Privileged Identity Management controls and monitors **privileged role access** through mechanisms such as **eligible assignments and time-limited activation**. It helps **reduce permanent administrative privileges** by allowing authorized users to activate access when required. Additional approval, verification and auditing controls can be configured where supported."},{"id":166,"term":"Azure Key Vault","definition":"Azure Key Vault is a managed service for securely storing and controlling access to secrets, cryptographic keys and certificates. It helps applications use sensitive credentials and cryptographic material without embedding them directly in application code. Access to vault contents remains subject to appropriate permissions and security configuration.","priority":"Optional","chapter":8,"refs":"Brochure E","highlightedDefinition":"Azure Key Vault is a managed service for **securely storing and controlling access** to **secrets, cryptographic keys and certificates**. It helps applications use sensitive credentials and cryptographic material **without embedding them directly in application code**. Access to vault contents remains subject to appropriate permissions and security configuration."},{"id":167,"term":"Microsoft Sentinel","definition":"Microsoft Sentinel is a security information and event management (SIEM) and security orchestration, automation and response (SOAR) platform. It collects and correlates security data from supported sources to detect threats, investigate incidents and automate response workflows. Defender for Cloud instead focuses primarily on cloud security posture and workload protection.","priority":"Optional","chapter":8,"refs":"Brochure 8","highlightedDefinition":"Microsoft Sentinel is a **security information and event management (SIEM)** and **security orchestration, automation and response (SOAR)** platform. It collects and correlates security data from supported sources to **detect threats, investigate incidents and automate response workflows**. Defender for Cloud instead focuses primarily on cloud security posture and workload protection."},{"id":168,"term":"Service Trust Portal","definition":"The Service Trust Portal provides Microsoft compliance documentation, audit reports and other information about Microsoft's security and privacy practices. Organizations can use these materials for supplier assurance and compliance assessments. It does not evaluate whether the customer's own Azure resources are correctly configured or compliant.","priority":"Optional","chapter":10,"refs":"Q182","highlightedDefinition":"The Service Trust Portal provides **Microsoft compliance documentation, audit reports** and other information about Microsoft's security and privacy practices. Organizations can use these materials for **supplier assurance and compliance assessments**. It **does not evaluate whether the customer's own Azure resources are correctly configured or compliant**."},{"id":169,"term":"Azure Automation / runbook","definition":"Azure Automation is a service for automating recurring administrative and operational tasks. Runbooks contain scripts or workflows that can execute according to configured schedules or triggers, including suitable monitoring alert integrations. It is oriented toward operational automation, while Logic Apps provides connector-based integration workflows.","priority":"Optional","chapter":11,"refs":"Q47","highlightedDefinition":"Azure Automation is a service for **automating recurring administrative and operational tasks**. **Runbooks contain scripts or workflows** that can execute according to configured **schedules or triggers**, including suitable monitoring alert integrations. It is oriented toward operational automation, while Logic Apps provides connector-based integration workflows."},{"id":170,"term":"Azure Logic Apps","definition":"Azure Logic Apps is a managed integration service for building automated workflows using triggers, actions and connectors. It allows applications and services to exchange data and perform multistep operations in response to configured events. It differs from script-centric Azure Automation runbooks, although both can support operational responses to alerts.","priority":"Optional","chapter":11,"refs":"Q47","highlightedDefinition":"Azure Logic Apps is a managed integration service for building **automated workflows** using **triggers, actions and connectors**. It allows applications and services to **exchange data and perform multistep operations** in response to configured events. It differs from script-centric Azure Automation runbooks, although both can support operational responses to alerts."},{"id":171,"term":"Power Automate","definition":"Power Automate is a low-code automation service for connecting business applications and automating recurring processes such as notifications, approvals and data transfers. It belongs to the Microsoft Power Platform and emphasizes productivity and business workflows. Azure Logic Apps provides Azure-hosted integration workflows with related capabilities.","priority":"Optional","chapter":11,"refs":"Q15","highlightedDefinition":"Power Automate is a **low-code automation** service for **connecting business applications** and automating recurring processes such as notifications, approvals and data transfers. It belongs to the **Microsoft Power Platform** and emphasizes **productivity and business workflows**. Azure Logic Apps provides Azure-hosted integration workflows with related capabilities."},{"id":172,"term":"Azure Event Grid","definition":"Azure Event Grid is an event distribution service that routes discrete event notifications from producers to interested subscribers using an event-driven model. It enables applications to react when an event occurs without tightly coupling the event source to the consumer. It differs from Service Bus, which provides richer brokered enterprise messaging.","priority":"Optional","chapter":"E","refs":"Q24","highlightedDefinition":"Azure Event Grid is an **event distribution service** that routes **discrete event notifications** from **producers to interested subscribers** using an event-driven model. It enables applications to **react when an event occurs** without tightly coupling the event source to the consumer. It differs from Service Bus, which provides richer brokered enterprise messaging."},{"id":173,"term":"Azure Service Bus","definition":"Azure Service Bus is a managed enterprise messaging service that uses queues and topics to exchange messages asynchronously between applications. It supports reliable message delivery and processing features, allowing producers and consumers to operate independently. Its focus is brokered messaging rather than discrete event notifications or high-volume telemetry streaming.","priority":"Optional","chapter":"E","refs":"Q24","highlightedDefinition":"Azure Service Bus is a **managed enterprise messaging** service that uses **queues and topics** to **exchange messages asynchronously** between applications. It supports **reliable message delivery** and processing features, allowing producers and consumers to operate independently. Its focus is brokered messaging rather than discrete event notifications or high-volume telemetry streaming."},{"id":174,"term":"Azure Event Hubs","definition":"Azure Event Hubs is a managed event ingestion and streaming service designed to receive high volumes of event data, such as application logs or device telemetry. Downstream applications can consume and process these streams for analytics or monitoring. It is distinct from brokered queues intended for reliable processing of individual business messages.","priority":"Optional","chapter":"E","refs":"Brochure E","highlightedDefinition":"Azure Event Hubs is a managed **event ingestion and streaming** service designed to receive **high volumes of event data**, such as **application logs or device telemetry**. Downstream applications can consume and process these streams for analytics or monitoring. It is distinct from brokered queues intended for reliable processing of individual business messages."},{"id":175,"term":"Azure IoT Hub","definition":"Azure IoT Hub is a managed service for communication between Internet of Things devices and cloud applications. It provides device-oriented capabilities such as device identities, telemetry ingestion and supported communication from the cloud to devices. Event Hubs is a more general-purpose high-throughput event streaming service.","priority":"Optional","chapter":"E","refs":"Q24","highlightedDefinition":"Azure IoT Hub is a managed service for **communication between Internet of Things devices and cloud applications**. It provides device-oriented capabilities such as **device identities, telemetry ingestion** and supported communication from the **cloud to devices**. Event Hubs is a more general-purpose high-throughput event streaming service."},{"id":176,"term":"Azure SQL Database / Azure Database for MySQL","definition":"Azure SQL Database and Azure Database for MySQL are managed relational database platforms that reduce the need to operate database server infrastructure and patch the underlying operating system. Customers manage their data, schemas, access and application use. The services use different database engines and SQL dialects, so they are not directly interchangeable.","priority":"Optional","chapter":"E","refs":"Q5, Q8, Q11","highlightedDefinition":"Azure SQL Database and Azure Database for MySQL are **managed relational database platforms** that reduce the need to operate database server infrastructure and patch the underlying operating system. **Customers manage their data, schemas, access** and application use. The services use **different database engines and SQL dialects**, so they are not directly interchangeable."},{"id":177,"term":"Azure Cosmos DB","definition":"Azure Cosmos DB is a managed distributed NoSQL database service supporting flexible data models and geographically distributed access where configured. It provides managed scaling and replication capabilities according to the selected configuration. It is designed for NoSQL workloads rather than conventional relational database tables and joins.","priority":"Optional","chapter":"E","refs":"Q8","highlightedDefinition":"Azure Cosmos DB is a **managed distributed NoSQL database service** supporting **flexible data models** and geographically distributed access where configured. It provides **managed scaling and replication** capabilities according to the selected configuration. It is designed for NoSQL workloads **rather than conventional relational database tables and joins**."}]</script>

function parseMarkdown(raw){const text=raw.replace(/\r\n?/g,'\n').split(/^## Brochure reference index\s*$/m)[0];const sections=[...text.matchAll(/^## Question (\d+)\s+[—–-]\s+(.+)\n([\s\S]*?)(?=^## Question \d+\s+[—–-]\s+|$(?![\s\S]))/gm)];const chapters=new Map([...raw.matchAll(/^\|\s*(\d{3})\s*\|\s*(\d+|E)\s*\|\s*$/gm)].map(m=>[Number(m[1]),m[2]==='E'?'E':Number(m[2])]));if(!sections.length)throw Error('No compatible question headings found. Use ## Question 001 — Topic.');return sections.map((m,i)=>{let b=m[3].trim(), answer=b.match(/^\*\*([^\n]*answer[^\n]*?):\s*([A-Z])\.\s*(.*?)\*\*\s*$/mi), opt=[...b.matchAll(/^- ([A-Z])\. (.+)$/gm)].filter(x=>!answer||x.index<answer.index);if(!answer||opt.length<2||!opt.some(o=>o[1]===answer[2]))throw Error('Cannot parse answer/options for question '+m[1]);const detail=b.indexOf('### ',answer.index);if(detail<0)throw Error('No explanation for question '+m[1]);return {id:i+1,sourceId:Number(m[1]),title:m[2].trim(),prompt:b.slice(0,opt[0].index).trim(),options:opt.map(o=>({letter:o[1],text:o[2].trim()})),correct:answer[2],correctLabel:answer[1],details:b.slice(detail).replace(/\n---\s*$/,'').trim(),chapter:chapters.get(Number(m[1]))||null}})}
