e Cloud Shell are correct?", "rationales": ["Cloud Shell is available through a browser.", "Cloud Shell offers Bash and PowerShell.", "Azure also supports other deployment interfaces and tools.", "Resources incur their normal charges regardless of management interface."]}, {"id": 188, "sourceId": 188, "title": "Bicep", "prompt": "A team wants to define infrastructure declaratively using Azure-native, concise syntax that compiles into ARM template JSON. Which language should it use?", "options": [{"letter": "A", "text": "KQL"}, {"letter": "B", "text": "Bicep"}, {"letter": "C", "text": "Azure PowerShell"}, {"letter": "D", "text": "Azure CLI"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nBicep is a declarative Azure infrastructure language that compiles to ARM templates.\n\n### Why the other answers are incorrect\n\n- **A. KQL:** It queries log data.\n- **C. Azure PowerShell:** It provides management cmdlets, not this declarative language.\n- **D. Azure CLI:** It runs management commands rather than being a declarative template language.\n\n### Key concept to remember\n\nBicep and ARM templates both support Infrastructure as Code.", "chapter": 11, "format": "scenario"}, {"id": 189, "sourceId": 189, "title": "Infrastructure as Code", "prompt": "Select Yes or No: (1) ARM templates use JSON. (2) Bicep can describe desired infrastructure state. (3) Infrastructure as Code supports repeatable deployments.", "options": [{"letter": "A", "text": "No / No / Yes"}, {"letter": "B", "text": "Yes / No / No"}, {"letter": "C", "text": "No / Yes / No"}, {"letter": "D", "text": "No / Yes / Yes"}, {"letter": "E", "text": "No / No / No"}, {"letter": "F", "text": "Yes / Yes / No"}, {"letter": "G", "text": "Yes / No / Yes"}, {"letter": "H", "text": "Yes / Yes / Yes"}], "correct": "H", "correctLabel": "Correct answer", "details": "### Explanation\n\nDeclarative templates support consistent and repeatable deployments.\n\n### Statement-by-statement correction\n\n- **ARM templates use JSON. — Yes.**\n- **Bicep can describe desired infrastructure state. — Yes.**\n- **Infrastructure as Code supports repeatable deployments. — Yes.**\n\n### Key concept to remember\n\nIaC makes infrastructure definitions reviewable, repeatable and source-controllable.", "chapter": 11, "format": "statements", "items": ["ARM templates use JSON.", "Bicep can describe desired infrastructure state.", "Infrastructure as Code supports repeatable deployments."], "intro": "Select Yes or No:", "revision": 4, "rationales": ["ARM templates use JSON.", "Bicep is a declarative language for describing infrastructure.", "Infrastructure as Code supports consistent, repeatable deployments."]}, {"id": 190, "sourceId": 190, "title": "Azure Resource Manager", "prompt": "A developer submits a request from the Azure portal to create a resource group. Which Azure layer handles resource-management requests from the portal, CLI, PowerShell and ARM templates?", "options": [{"letter": "A", "text": "Azure Resource Manager (ARM)"}, {"letter": "B", "text": "Azure Monitor"}, {"letter": "C", "text": "Azure Storage Explorer"}, {"letter": "D", "text": "Microsoft Entra Domain Services"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nARM is the deployment and management control plane for Azure resources.\n\n### Why the other answers are incorrect\n\n- **B. Azure Monitor:** It collects and analyzes telemetry.\n- **C. Azure Storage Explorer:** It manages storage through a graphical client.\n- **D. Microsoft Entra Domain Services:** It provides managed domain protocols.\n\n### Key concept to remember\n\nARM is the common resource management layer; ARM templates are one way to describe deployments.", "chapter": 11, "format": "scenario"}, {"id": 191, "sourceId": 191, "title": "Azure Arc", "prompt": "A company keeps supported Linux servers in its datacenter and in another cloud. It wants centralized Azure-based management without first migrating those machines. Which solution should it use?", "options": [{"letter": "A", "text": "Azure Data Box"}, {"letter": "B", "text": "Azure Migrate"}, {"letter": "C", "text": "Azure File Sync"}, {"letter": "D", "text": "Azure Arc"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt extends supported Azure management capabilities to non-Azure resources.\n\n### Why the other answers are incorrect\n\n- **A. Azure Data Box:** It transfers large datasets using physical devices.\n- **B. Azure Migrate:** It assesses and migrates workloads to Azure.\n- **C. Azure File Sync:** It synchronizes file shares.\n\n### Key concept to remember\n\nArc manages resources where they already run; Migrate helps move workloads to Azure.", "chapter": 11, "format": "scenario"}, {"id": 192, "sourceId": 192, "title": "Management interfaces", "prompt": "Match each requirement: (1) Graphical administration in a browser. (2) Manage resources from a phone. (3) Authenticated browser terminal with Bash or PowerShell.", "options": [{"letter": "A", "text": "1 Azure portal; 2 Cloud Shell; 3 Azure mobile app"}, {"letter": "B", "text": "1 Cloud Shell; 2 Azure portal; 3 Azure mobile app"}, {"letter": "C", "text": "1 Azure mobile app; 2 Azure portal; 3 Cloud Shell"}, {"letter": "D", "text": "1 Azure portal; 2 Azure mobile app; 3 Azure Cloud Shell"}, {"letter": "E", "text": "1 Azure portal; 2 Azure Cloud Shell; 3 Azure mobile app"}, {"letter": "F", "text": "1 Azure mobile app; 2 Azure portal; 3 Azure Cloud Shell"}, {"letter": "G", "text": "1 Azure mobile app; 2 Azure Cloud Shell; 3 Azure portal"}, {"letter": "H", "text": "1 Azure Cloud Shell; 2 Azure portal; 3 Azure mobile app"}, {"letter": "I", "text": "1 Azure Cloud Shell; 2 Azure mobile app; 3 Azure portal"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nEach interface matches the requested device or interaction style.\n\n### Correct associations\n\n- **Graphical administration in a browser.** → Azure portal\n- **Manage resources from a phone.** → Azure mobile app\n- **Authenticated browser terminal with Bash or PowerShell.** → Azure Cloud Shell\n\n### Key concept to remember\n\nChoose the management interface according to graphical, mobile or terminal requirements.", "chapter": 11, "format": "matching", "items": ["Graphical administration in a browser.", "Manage resources from a phone.", "Authenticated browser terminal with Bash or PowerShell."], "intro": "Match each requirement:", "targets": ["Azure portal", "Azure mobile app", "Azure Cloud Shell"]}, {"id": 193, "sourceId": 193, "title": "Azure Resource Health", "prompt": "One virtual machine is unexpectedly unavailable. You want Azure's health assessment for that specific VM and possible platform-related causes. Which feature should you inspect?", "options": [{"letter": "A", "text": "Azure Pricing Calculator"}, {"letter": "B", "text": "Azure Service Health"}, {"letter": "C", "text": "Azure Resource Health"}, {"letter": "D", "text": "Azure Advisor"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt provides health information for individual Azure resources.\n\n### Why the other answers are incorrect\n\n- **A. Azure Pricing Calculator:** It estimates planned costs.\n- **B. Azure Service Health:** It focuses on Azure service incidents and advisories affecting subscriptions.\n- **D. Azure Advisor:** It provides optimization recommendations.\n\n### Key concept to remember\n\nResource Health is resource-specific; Service Health is subscription-relevant platform health.", "chapter": 12, "format": "scenario"}, {"id": 194, "sourceId": 194, "title": "Azure Status", "prompt": "A company is considering a region where it has no subscriptions deployed. It wants the public global overview of Azure platform availability. Which view is best suited?", "options": [{"letter": "A", "text": "Azure Resource Health"}, {"letter": "B", "text": "Application Insights"}, {"letter": "C", "text": "Azure Service Health"}, {"letter": "D", "text": "Azure Status"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt provides a public broad view of Azure service status by region.\n\n### Why the other answers are incorrect\n\n- **A. Azure Resource Health:** It focuses on an individual deployed resource.\n- **B. Application Insights:** It monitors instrumented applications.\n- **C. Azure Service Health:** It provides personalized information for services and regions relevant to your subscriptions.\n\n### Key concept to remember\n\nStatus is public and global; Service Health is personalized; Resource Health is individual.", "chapter": 12, "format": "scenario"}, {"id": 195, "sourceId": 195, "title": "Azure health tools", "prompt": "Match each requirement: (1) Public global platform status. (2) Planned Azure maintenance affecting your subscription. (3) Health of a particular storage account.", "options": [{"letter": "A", "text": "1 Azure Status; 2 Resource Health; 3 Service Health"}, {"letter": "B", "text": "1 Azure Status; 2 Service Health; 3 Resource Health"}, {"letter": "C", "text": "1 Service Health; 2 Resource Health; 3 Azure Status"}, {"letter": "D", "text": "1 Resource Health; 2 Service Health; 3 Azure Status"}, {"letter": "E", "text": "1 Service Health; 2 Azure Status; 3 Resource Health"}, {"letter": "F", "text": "1 Resource Health; 2 Azure Status; 3 Service Health"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nThe tools correspond to global, personalized service and individual resource scopes.\n\n### Correct associations\n\n- **Public global platform status.** → Azure Status\n- **Planned Azure maintenance affecting your subscription.** → Service Health\n- **Health of a particular storage account.** → Resource Health\n\n### Key concept to remember\n\nRemember the three health scopes: global platform, affected services, individual resources.", "chapter": 12, "format": "matching", "items": ["Public global platform status.", "Planned Azure maintenance affecting your subscription.", "Health of a particular storage account."], "intro": "Match each requirement:", "targets": ["Azure Status", "Service Health", "Resource Health"]}, {"id": 196, "sourceId": 196, "title": "Azure Monitor metrics", "prompt": "An administrator needs a numerical time series showing the CPU percentage of a virtual machine over the last hour. Which telemetry type is most directly suited?", "options": [{"letter": "A", "text": "Metrics"}, {"letter": "B", "text": "Resource tags"}, {"letter": "C", "text": "Logs"}, {"letter": "D", "text": "Azure Policy definitions"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nMetrics are timestamped numerical measurements such as CPU utilization.\n\n### Why the other answers are incorrect\n\n- **B. Resource tags:** They provide metadata, not CPU time-series telemetry.\n- **C. Logs:** Logs contain event records and diagnostic information; metrics are the direct numerical time-series representation here.\n- **D. Azure Policy definitions:** They describe governance rules.\n\n### Key concept to remember\n\nMetrics measure values over time; logs provide richer event and diagnostic records.", "chapter": 12, "format": "scenario"}, {"id": 197, "sourceId": 197, "title": "Log Analytics and KQL", "prompt": "An operations engineer wants to write a query that filters Azure Monitor log records by error type and groups results by resource. Which tool should be used?", "options": [{"letter": "A", "text": "Log Analytics"}, {"letter": "B", "text": "Azure Advisor"}, {"letter": "C", "text": "Azure Pricing Calculator"}, {"letter": "D", "text": "Azure Service Health"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt provides a KQL query experience for analyzing collected logs.\n\n### Why the other answers are incorrect\n\n- **B. Azure Advisor:** It supplies best-practice recommendations.\n- **C. Azure Pricing Calculator:** It estimates costs.\n- **D. Azure Service Health:** It reports platform incidents and advisories.\n\n### Key concept to remember\n\nLog Analytics queries Azure Monitor logs using KQL.", "chapter": 12, "format": "scenario"}, {"id": 198, "sourceId": 198, "title": "Alert action groups", "prompt": "An existing Azure Monitor alert rule detects CPU utilization above a threshold. The team wants the rule to send email notifications and trigger an automated response. Which feature defines those responses?", "options": [{"letter": "A", "text": "Resource group"}, {"letter": "B", "text": "Azure Policy initiative"}, {"letter": "C", "text": "Log Analytics workspace"}, {"letter": "D", "text": "Action group"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt defines reusable notification and action configurations associated with alerts.\n\n### Why the other answers are incorrect\n\n- **A. Resource group:** It organizes Azure resources.\n- **B. Azure Policy initiative:** It groups governance policy definitions.\n- **C. Log Analytics workspace:** It stores and organizes collected logs.\n\n### Key concept to remember\n\nAn alert rule defines when to trigger; an action group defines what happens in response.", "chapter": 12, "format": "scenario"}, {"id": 199, "sourceId": 199, "title": "Application Insights", "prompt": "Which TWO measurements are most directly associated with Application Insights for an instrumented web app? (1) Request response times. (2) Failed requests and exceptions. (3) The Azure subscription billing invoice total. (4) The allowed deployment region policy.", "options": [{"letter": "A", "text": "1 and 4"}, {"letter": "B", "text": "2 and 3"}, {"letter": "C", "text": "2 and 4"}, {"letter": "D", "text": "3 and 4"}, {"letter": "E", "text": "1 and 3"}, {"letter": "F", "text": "1 and 2"}], "correct": "F", "correctLabel": "Correct answer", "details": "### Explanation\n\nApplication Insights focuses on application requests, failures and performance telemetry.\n\n### Why the other answers are incorrect\n\n- **A. 1 and 4:** Statement(s) 4 are not correct; statement(s) 2 are required. Application Insights is a specialized Azure Monitor capability for application performance and behavior.\n- **B. 2 and 3:** Statement(s) 3 are not correct; statement(s) 1 are required. Application Insights is a specialized Azure Monitor capability for application performance and behavior.\n- **C. 2 and 4:** Allowed deployment regions are governed through Azure Policy.\n- **D. 3 and 4:** Neither is application performance telemetry.\n- **E. 1 and 3:** Billing totals belong to cost and billing tools.\n\n### Key concept to remember\n\nApplication Insights is a specialized Azure Monitor capability for application performance and behavior.", "chapter": 12, "format": "multiple", "items": ["Request response times.", "Failed requests and exceptions.", "The Azure subscription billing invoice total.", "The allowed deployment region policy."], "intro": "Which TWO measurements are most directly associated with Application Insights for an instrumented web app?", "rationales": ["Request duration is application performance telemetry.", "Failed requests and exceptions are application health telemetry.", "Invoice totals belong to cost and billing tools.", "Deployment-region restrictions belong to governance policies."]}, {"id": 200, "sourceId": 200, "title": "Azure Advisor", "prompt": "Select Yes or No: (1) Azure Advisor recommends improvements to deployed resources. (2) It provides recommendations for cost and reliability. (3) It automatically implements every recommendation without user action.", "options": [{"letter": "A", "text": "No / No / No"}, {"letter": "B", "text": "No / Yes / Yes"}, {"letter": "C", "text": "Yes / No / Yes"}, {"letter": "D", "text": "Yes / Yes / Yes"}, {"letter": "E", "text": "No / Yes / No"}, {"letter": "F", "text": "No / No / Yes"}, {"letter": "G", "text": "Yes / Yes / No"}, {"letter": "H", "text": "Yes / No / No"}], "correct": "G", "correctLabel": "Correct answer", "details": "### Explanation\n\nAdvisor identifies improvement opportunities but does not automatically apply every change.\n\n### Why the other answers are incorrect\n\n- **A. No / No / No:** 1 must be Yes; 2 must be Yes. Advisor identifies improvement opportunities but does not automatically apply every change.\n- **B. No / Yes / Yes:** 1 must be Yes; 3 must be No. Advisor identifies improvement opportunities but does not automatically apply every change.\n- **C. Yes / No / Yes:** 2 must be Yes; 3 must be No. Advisor identifies improvement opportunities but does not automatically apply every change.\n- **D. Yes / Yes / Yes:** Recommendations are not universal automatic changes.\n- **E. No / Yes / No:** Advisor analyzes deployed resources.\n- **F. No / No / Yes:** 1 must be Yes; 2 must be Yes; 3 must be No. Advisor identifies improvement opportunities but does not automatically apply every change.\n- **H. Yes / No / No:** Cost and reliability are recommendation categories.\n\n### Key concept to remember\n\nAdvisor recommends; Azure Policy enforces; Azure Monitor observes and alerts.", "chapter": 12, "format": "statements", "items": ["Azure Advisor recommends improvements to deployed resources.", "It provides recommendations for cost and reliability.", "It automatically implements every recommendation without user action."], "intro": "Select Yes or No:", "rationales": ["Advisor analyzes deployed resources; Pricing Calculator estimates proposed deployment costs.", "Advisor includes cost and reliability recommendations.", "Advisor recommendations are not all applied automatically."]}]</script>
<script id="embedded-glossary" type="application/json">[{"id":1,"term":"Cloud computing","definition":"Cloud computing is the delivery of computing resources, such as servers, storage, networking and applications, over a network on demand. Customers can provision and release resources without purchasing the underlying physical equipment, and charges depend on the chosen service and pricing model.","priority":"Core","chapter":1,"refs":"","highlightedDefinition":"Cloud computing is the **delivery of computing resources**, such as servers, storage, networking and applications, **over a network on demand**. Customers can provision and release resources **without purchasing the underlying physical equipment**, and charges depend on the chosen service and pricing model."},{"id":2,"term":"Public cloud","definition":"A public cloud is a cloud environment operated by a service provider for multiple customers using shared physical infrastructure. Each customer manages its own resources and access permissions, so the term public describes the deployment model rather than unrestricted public access to customer data.","priority":"Core","chapter":1,"refs":"","highlightedDefinition":"A public cloud is a cloud environment operated by a service provider for **multiple customers** using **shared physical infrastructure**. Each customer manages its own resources and access permissions, so the term public describes the deployment model **rather than unrestricted public access** to customer data."},{"id":3,"term":"Private cloud","definition":"A private cloud provides cloud infrastructure dedicated to a single organization, either in its own facilities or hosted by a provider. It offers greater control over dedicated infrastructure while retaining cloud capabilities such as self-service provisioning and resource pooling. Virtualization alone does not necessarily constitute a private cloud.","priority":"Core","chapter":1,"refs":"","highlightedDefinition":"A private cloud provides cloud infrastructure **dedicated to a single organization**, either in its own facilities or hosted by a provider. It offers greater control over dedicated infrastructure while retaining cloud capabilities such as **self-service provisioning and resource pooling**. **Virtualization alone** does not necessarily constitute a private cloud."},{"id":4,"term":"Hybrid cloud","definition":"A hybrid cloud combines public cloud services with private cloud or on-premises infrastructure in an integrated environment. It allows an organization to operate workloads across both environments, keeping selected systems or data locally while using public cloud capacity and services where appropriate.","priority":"Core","chapter":1,"refs":"","highlightedDefinition":"A hybrid cloud combines **public cloud services with private cloud or on-premises infrastructure** in an integrated environment. It allows an organization to **operate workloads across both environments**, keeping selected systems or data locally while using public cloud capacity and services where appropriate."},{"id":5,"term":"Shared responsibility model","definition":"The shared responsibility model divides security and operational responsibilities between the cloud provider and the customer. Microsoft manages the physical infrastructure; responsibility for the operating system, applications and network configuration varies with the service model. Customers remain responsible for their data, identities and access configuration.","priority":"Core","chapter":1,"refs":"","highlightedDefinition":"The shared responsibility model **divides security and operational responsibilities** between the cloud provider and the customer. Microsoft manages the **physical infrastructure**; responsibility for the operating system, applications and network configuration varies with the service model. Customers remain responsible for their **data, identities and access configuration**."},{"id":6,"term":"Consumption-based model","definition":"A consumption-based model charges for resources according to measured usage, such as storage capacity, transactions, execution time or provisioned compute capacity. The customer does not necessarily pay the same amount every month, and billing depends on the service's specific meters. Not all cloud pricing is strictly consumption-based.","priority":"Core","chapter":1,"refs":"","highlightedDefinition":"A consumption-based model charges for resources according to **measured usage**, such as storage capacity, transactions, execution time or provisioned compute capacity. The customer does not necessarily pay the same amount every month, and billing depends on the service's **specific meters**. **Not all cloud pricing is strictly consumption-based**."},{"id":7,"term":"Pay-as-you-go","definition":"Pay-as-you-go is a pricing option that charges for billable resource usage without a long-term reservation commitment. It allows customers to adjust resources as requirements change. Provisioned resources may continue to generate charges even when they are not actively used.","priority":"Related","chapter":1,"refs":"","highlightedDefinition":"Pay-as-you-go is a pricing option that charges for **billable resource usage** **without a long-term reservation commitment**. It allows customers to adjust resources as requirements change. Provisioned resources may **continue to generate charges** even when they are not actively used."},{"id":8,"term":"Capital expenditure - CapEx","definition":"Capital expenditure is an upfront investment in assets intended to be used over an extended period, such as physical servers or networking equipment. An organization must commit funds and plan capacity before the equipment can be used, rather than paying only for ongoing consumption.","priority":"Related","chapter":1,"refs":"","highlightedDefinition":"Capital expenditure is an **upfront investment in assets** intended to be used over an **extended period**, such as physical servers or networking equipment. An organization must commit funds and **plan capacity before** the equipment can be used, rather than paying only for ongoing consumption."},{"id":9,"term":"Operational expenditure - OpEx","definition":"Operational expenditure is an ongoing cost of running a business or service, such as recurring cloud service charges. In cloud computing, operating costs can vary with consumption and resource configuration. Moving from capital investment to operating expenditure does not necessarily reduce total costs.","priority":"Related","chapter":1,"refs":"","highlightedDefinition":"Operational expenditure is an **ongoing cost** of running a business or service, such as **recurring cloud service charges**. In cloud computing, operating costs can vary with consumption and resource configuration. Moving from capital investment to operating expenditure **does not necessarily reduce total costs**."},{"id":10,"term":"Economies of scale","definition":"Economies of scale occur when the average cost of delivering a service decreases as the scale of operations increases. Cloud providers can purchase equipment in large quantities and share datacenter operating costs across many customers, which can reduce the cost per unit of computing capacity.","priority":"Related","chapter":1,"refs":"","highlightedDefinition":"Economies of scale occur when the **average cost of delivering a service decreases** as the **scale of operations increases**. Cloud providers can purchase equipment in large quantities and **share datacenter operating costs** across many customers, which can reduce the cost per unit of computing capacity."},{"id":11,"term":"Serverless computing","definition":"Serverless computing is a model in which the cloud provider manages the servers and execution environment, allowing developers to focus on application code and configuration. Scaling and billing depend on the hosting plan; some plans charge for provisioned capacity. Physical servers still exist, but the customer does not directly administer them.","priority":"Core","chapter":1,"refs":"","highlightedDefinition":"Serverless computing is a model in which the **cloud provider manages the servers** and execution environment, allowing developers to focus on **application code and configuration**. Scaling and billing depend on the hosting plan; some plans **charge for provisioned capacity**. Physical servers still exist, but the customer does not directly administer them."},{"id":12,"term":"Multicloud","definition":"Multicloud describes the use of services from more than one cloud provider. It allows organizations to combine different providers' capabilities or distribute workloads between them. Unlike hybrid cloud, multicloud does not necessarily involve a private or on-premises environment.","priority":"Related","chapter":1,"refs":"","highlightedDefinition":"Multicloud describes the use of services from **more than one cloud provider**. It allows organizations to combine different providers' capabilities or distribute workloads between them. Unlike hybrid cloud, multicloud **does not necessarily involve a private or on-premises environment**."},{"id":13,"term":"High availability - HA","definition":"High availability is the design of a system to remain accessible and operational despite certain component failures or maintenance events. It is achieved through suitable redundancy, traffic distribution and failure recovery mechanisms. Using Azure alone does not guarantee high availability without an appropriate architecture.","priority":"Core","chapter":2,"refs":"","highlightedDefinition":"High availability is the design of a system to **remain accessible and operational** despite certain **component failures or maintenance events**. It is achieved through suitable **redundancy, traffic distribution and failure recovery** mechanisms. Using Azure alone does not guarantee high availability without an appropriate architecture."},{"id":14,"term":"Scalability","definition":"Scalability is the ability of a system to change its computing capacity to meet different workload requirements. Capacity can be adjusted vertically by changing the size of an instance or horizontally by adding and removing instances. Scaling may be manual or automatic.","priority":"Core","chapter":2,"refs":"","highlightedDefinition":"Scalability is the ability of a system to **change its computing capacity** to meet different workload requirements. Capacity can be adjusted **vertically by changing the size** of an instance or **horizontally by adding and removing instances**. Scaling may be manual or automatic."},{"id":15,"term":"Vertical scaling / scale up / scale down","definition":"Vertical scaling changes the resources assigned to an individual instance, such as its CPU capacity or memory. Scaling up increases its capacity, while scaling down reduces it. The number of instances remains unchanged, and resizing may require a restart or other interruption.","priority":"Related","chapter":2,"refs":"","highlightedDefinition":"Vertical scaling changes the resources assigned to an **individual instance**, such as its CPU capacity or memory. **Scaling up increases** its capacity, while **scaling down reduces** it. The **number of instances remains unchanged**, and resizing may require a restart or other interruption."},{"id":16,"term":"Horizontal scaling / scale out / scale in","definition":"Horizontal scaling changes the number of instances serving a workload. Scaling out adds instances to handle more demand, while scaling in removes unnecessary instances. Applications must be designed to distribute work across the available instances.","priority":"Related","chapter":2,"refs":"","highlightedDefinition":"Horizontal scaling changes the **number of instances** serving a workload. **Scaling out adds instances** to handle more demand, while **scaling in removes** unnecessary instances. Applications must be designed to distribute work across the available instances."},{"id":17,"term":"Elasticity","definition":"Elasticity is the ability to dynamically adjust resource capacity in response to fluctuating demand, including reducing capacity when demand decreases. It helps avoid maintaining unnecessary resources during quiet periods. Scalability describes the broader ability to change capacity; elasticity emphasizes matching capacity to changing demand.","priority":"Related","chapter":2,"refs":"","highlightedDefinition":"Elasticity is the ability to **dynamically adjust resource capacity** in response to **fluctuating demand**, including **reducing capacity when demand decreases**. It helps avoid maintaining unnecessary resources during quiet periods. Scalability describes the broader ability to change capacity; elasticity emphasizes matching capacity to changing demand."},{"id":18,"term":"Reliability","definition":"Reliability is the ability of a system to perform its intended function consistently and recover from failures. It depends on the behavior of the application and its dependencies, not only the availability of the infrastructure. Redundancy, retry mechanisms and recovery planning can improve reliability.","priority":"Core","chapter":2,"refs":"","highlightedDefinition":"Reliability is the ability of a system to **perform its intended function consistently** and **recover from failures**. It depends on the behavior of the application and its dependencies, not only the availability of the infrastructure. **Redundancy, retry mechanisms and recovery planning** can improve reliability."},{"id":19,"term":"Fault tolerance","definition":"Fault tolerance is the ability of a system to continue operating when one or more supported components fail. Redundant components and automatic failover can allow service to continue without requiring the failed component to be restored first. Disaster recovery instead focuses on recovering after a disruptive failure.","priority":"Related","chapter":2,"refs":"","highlightedDefinition":"Fault tolerance is the ability of a system to **continue operating** when one or more supported **components fail**. **Redundant components and automatic failover** can allow service to continue without requiring the failed component to be restored first. Disaster recovery instead focuses on recovering after a disruptive failure."},{"id":20,"term":"Disaster recovery - DR","definition":"Disaster recovery is the combination of architecture, procedures and resources used to restore systems after a major disruption. It may involve backups, geographic replication, failover and tested recovery procedures. Recovery requirements are commonly expressed through recovery point and recovery time objectives.","priority":"Related","chapter":2,"refs":"","highlightedDefinition":"Disaster recovery is the combination of architecture, procedures and resources used to **restore systems after a major disruption**. It may involve **backups, geographic replication, failover** and tested recovery procedures. Recovery requirements are commonly expressed through **recovery point and recovery time objectives**."},{"id":21,"term":"Recovery Point Objective - RPO","definition":"The recovery point objective defines the maximum acceptable amount of data loss after a disruption, measured as a period of time. It determines how recent the recovered data must be and influences backup and replication frequency. It measures acceptable data loss rather than recovery duration.","priority":"Related","chapter":2,"refs":"","highlightedDefinition":"The recovery point objective defines the **maximum acceptable amount of data loss** after a disruption, measured as a **period of time**. It determines how recent the recovered data must be and influences **backup and replication frequency**. It measures acceptable data loss rather than recovery duration."},{"id":22,"term":"Recovery Time Objective - RTO","definition":"The recovery time objective defines the target maximum duration of service interruption after a disruption. It guides the design of recovery procedures, standby capacity and failover mechanisms. Unlike RPO, it measures how quickly the service must be restored rather than how much data can be lost.","priority":"Related","chapter":2,"refs":"","highlightedDefinition":"The recovery time objective defines the **target maximum duration of service interruption** after a disruption. It guides the design of **recovery procedures**, standby capacity and failover mechanisms. Unlike RPO, it measures **how quickly the service must be restored** rather than how much data can be lost."},{"id":23,"term":"Predictability","definition":"Predictability is the ability to anticipate cloud performance and spending sufficiently to plan resources and budgets. It is supported by performance monitoring, cost estimation, appropriate capacity choices and pricing commitments. It does not mean that future workload behavior or charges are guaranteed to be fixed.","priority":"Core","chapter":2,"refs":"","highlightedDefinition":"Predictability is the ability to **anticipate cloud performance and spending** sufficiently to plan resources and budgets. It is supported by performance monitoring, **cost estimation**, appropriate capacity choices and **pricing commitments**. It does not mean that future workload behavior or charges are guaranteed to be fixed."},{"id":24,"term":"Manageability","definition":"Manageability is the ability to deploy, configure, monitor and operate cloud resources efficiently. Cloud platforms provide graphical interfaces, command-line tools, infrastructure definitions and automation to simplify these tasks and make management more consistent across resources.","priority":"Core","chapter":2,"refs":"","highlightedDefinition":"Manageability is the ability to **deploy, configure, monitor and operate** cloud resources efficiently. Cloud platforms provide **graphical interfaces, command-line tools**, infrastructure definitions and **automation** to simplify these tasks and make management more consistent across resources."},{"id":25,"term":"Service-level agreement (SLA)","definition":"A service-level agreement is a contractual commitment from a service provider, often defining an availability target and conditions for service credits. The applicable commitment depends on the service and its configuration. It does not guarantee uninterrupted operation of the customer's entire application.","priority":"Related","chapter":2,"refs":"","highlightedDefinition":"A service-level agreement is a **contractual commitment** from a service provider, often defining an **availability target** and conditions for **service credits**. The applicable commitment depends on the service and its configuration. It does not guarantee uninterrupted operation of the customer's entire application."},{"id":26,"term":"Cloud governance","definition":"Cloud governance is the set of policies, standards and oversight processes used to ensure that cloud resources meet organizational requirements. It covers areas such as configuration, security, permitted deployment locations and cost organization. Governance defines resource guardrails, while access control determines who can perform actions.","priority":"Core","chapter":2,"refs":"","highlightedDefinition":"Cloud governance is the set of **policies, standards and oversight processes** used to ensure that cloud resources meet **organizational requirements**. It covers areas such as configuration, security, permitted deployment locations and cost organization. Governance defines **resource guardrails**, while access control determines who can perform actions."},{"id":27,"term":"Infrastructure as a Service - IaaS","definition":"Infrastructure as a Service provides virtualized compute, storage and networking resources. The provider manages the physical infrastructure, while the customer manages the guest operating system, installed applications, data and relevant configurations. Azure Virtual Machines offer this model when operating-system-level control is needed.","priority":"Core","chapter":3,"refs":"","highlightedDefinition":"Infrastructure as a Service provides **virtualized compute, storage and networking** resources. The provider manages the physical infrastructure, while the **customer manages the guest operating system**, installed applications, data and relevant configurations. **Azure Virtual Machines** offer this model when operating-system-level control is needed."},{"id":28,"term":"Platform as a Service - PaaS","definition":"Platform as a Service provides a managed environment for developing, deploying and running applications. The provider manages the physical infrastructure, operating system and application hosting platform, while the customer manages application code, data and relevant settings. Azure App Service is a PaaS offering.","priority":"Core","chapter":3,"refs":"","highlightedDefinition":"Platform as a Service provides a **managed environment** for developing, deploying and running applications. The **provider manages the physical infrastructure, operating system and application hosting platform**, while the **customer manages application code**, data and relevant settings. **Azure App Service** is a PaaS offering."},{"id":29,"term":"Software as a Service - SaaS","definition":"Software as a Service provides a complete, ready-to-use application operated by the service provider. The provider maintains the application and underlying infrastructure, while the customer manages users, access, data and available application settings. Microsoft 365 is a SaaS offering.","priority":"Core","chapter":3,"refs":"","highlightedDefinition":"Software as a Service provides a **complete, ready-to-use application** operated by the service provider. The **provider maintains the application** and underlying infrastructure, while the **customer manages users, access, data** and available application settings. **Microsoft 365** is a SaaS offering."},{"id":30,"term":"Datacenter","definition":"A datacenter is a physical facility that houses computing equipment, network infrastructure, power supplies and cooling systems. Azure organizes datacenters into geographic regions and, where supported, availability zones. A datacenter is a physical facility rather than a logical management scope.","priority":"Core","chapter":4,"refs":"","highlightedDefinition":"A datacenter is a **physical facility** that houses **computing equipment, network infrastructure, power supplies and cooling systems**. Azure organizes datacenters into geographic regions and, where supported, availability zones. A datacenter is a physical facility rather than a logical management scope."},{"id":31,"term":"Azure region","definition":"An Azure region is a geographic area containing one or more datacenters connected by a low-latency network. Resources are deployed to supported regions based on service availability, latency, cost and data-location requirements. A region may contain multiple availability zones.","priority":"Core","chapter":4,"refs":"","highlightedDefinition":"An Azure region is a **geographic area** containing **one or more datacenters** connected by a **low-latency network**. Resources are deployed to supported regions based on service availability, latency, cost and data-location requirements. A region may contain multiple availability zones."},{"id":32,"term":"Region pair","definition":"A region pair is an association between certain Azure regions that can support geographic redundancy and disaster recovery for specific services. Not all Azure regions are paired. Pairing does not automatically replicate all resources or create a disaster recovery solution for every workload.","priority":"Core","chapter":4,"refs":"","highlightedDefinition":"A region pair is an **association between certain Azure regions** that can support **geographic redundancy and disaster recovery** for specific services. **Not all Azure regions are paired**. Pairing does not automatically replicate all resources or create a disaster recovery solution for every workload."},{"id":33,"term":"Availability Zone - AZ","definition":"An availability zone is a physically separate group of one or more datacenters within an Azure region, with independent power, cooling and networking. Distributing supported resources across zones reduces exposure to a single-zone failure. A resource deployed in only one zone does not automatically have cross-zone redundancy.","priority":"Core","chapter":4,"refs":"","highlightedDefinition":"An availability zone is a **physically separate group** of one or more datacenters **within an Azure region**, with **independent power, cooling and networking**. Distributing supported resources across zones reduces exposure to a **single-zone failure**. A resource deployed in only one zone does not automatically have cross-zone redundancy."},{"id":34,"term":"Sovereign region","definition":"A sovereign region or cloud environment is designed to satisfy specific geographic, regulatory or sovereignty requirements. Azure Government and Azure operated by 21Vianet are environments serving particular requirements, and their service availability and operational arrangements may differ from public Azure.","priority":"Core","chapter":4,"refs":"","highlightedDefinition":"A sovereign region or cloud environment is designed to satisfy specific **geographic, regulatory or sovereignty requirements**. **Azure Government** and **Azure operated by 21Vianet** are environments serving particular requirements, and their service availability and operational arrangements may differ from public Azure."},{"id":35,"term":"Azure resource","definition":"An Azure resource is an individually manageable item deployed or represented in Azure, such as a virtual machine, storage account or virtual network. Each resource has a type, configuration and management scope that determines how Azure Resource Manager identifies and manages it.","priority":"Core","chapter":4,"refs":"","highlightedDefinition":"An Azure resource is an **individually manageable item** deployed or represented in Azure, such as a virtual machine, storage account or virtual network. Each resource has a **type, configuration and management scope** that determines how Azure Resource Manager identifies and manages it."},{"id":36,"term":"Resource group (RG)","definition":"A resource group is a logical container for related Azure resources that can be managed together for access, deployment and lifecycle purposes. Resource-group-scoped resources belong to one group at a time, groups cannot be nested, and their resources can span regions. The group itself has no fee; deleting it generally deletes its contained resources, subject to protections.","priority":"Core","chapter":4,"refs":"","highlightedDefinition":"A resource group is a **logical container for related Azure resources** that can be managed together for access, deployment and lifecycle purposes. Resource-group-scoped resources belong to **one group at a time**, groups **cannot be nested**, and their resources **can span regions**. The group itself has **no fee**; deleting it generally deletes its contained resources, subject to protections."},{"id":37,"term":"Azure subscription","definition":"An Azure subscription is a management, billing and quota boundary for Azure resources. It allows organizations to separate environments, allocate costs and manage access and service limits. A subscription is associated with one Microsoft Entra tenant at a time, while a tenant can be associated with multiple subscriptions.","priority":"Core","chapter":4,"refs":"","highlightedDefinition":"An Azure subscription is a **management, billing and quota boundary** for Azure resources. It allows organizations to separate environments, allocate costs and manage access and service limits. A subscription is associated with **one Microsoft Entra tenant at a time**, while a tenant can be associated with **multiple subscriptions**."},{"id":38,"term":"Management group","definition":"A management group is a hierarchical management scope used to organize multiple Azure subscriptions. It enables organizations to assign applicable governance policies and access permissions centrally so that they inherit to child scopes. Management groups can contain subscriptions and other management groups.","priority":"Core","chapter":4,"refs":"","highlightedDefinition":"A management group is a **hierarchical management scope** used to **organize multiple Azure subscriptions**. It enables organizations to assign applicable governance policies and access permissions centrally so that they **inherit to child scopes**. Management groups can contain subscriptions and other management groups."},{"id":39,"term":"Azure resource hierarchy / scope","definition":"The Azure resource hierarchy normally organizes resources under management groups, subscriptions and resource groups. Permissions and applicable policies can inherit from higher scopes to lower ones, while tags do not automatically inherit. Some ARM resources are deployed directly at subscription, management-group or tenant scope rather than inside a resource group.","priority":"Core","chapter":4,"refs":"","highlightedDefinition":"The Azure resource hierarchy normally organizes resources under **management groups, subscriptions and resource groups**. **Permissions and applicable policies can inherit** from higher scopes to lower ones, while **tags do not automatically inherit**. Some ARM resources are deployed directly at subscription, management-group or tenant scope rather than inside a resource group."},{"id":40,"term":"Azure Virtual Machines - VMs","definition":"Azure Virtual Machines are IaaS compute resources that run operating systems and applications on virtualized hardware. Customers choose the VM configuration and manage the guest OS, installed software and related settings. Microsoft manages the physical servers and virtualization infrastructure.","priority":"Core","chapter":5,"refs":"","highlightedDefinition":"Azure Virtual Machines are **IaaS compute resources** that run **operating systems and applications** on virtualized hardware. Customers choose the VM configuration and manage the **guest OS**, installed software and related settings. **Microsoft manages the physical servers** and virtualization infrastructure."},{"id":41,"term":"VM supporting resources","definition":"A VM deployment requires a compute size, an operating system image or disk, and network configuration including a network interface and virtual network/subnet. Additional data disks, public IP addresses and network security groups depend on the workload design. A public IP is not necessary for private-only access.","priority":"Core","chapter":5,"refs":"","highlightedDefinition":"A VM deployment requires a **compute size**, an **operating system image or disk**, and network configuration including a **network interface and virtual network/subnet**. Additional data disks, public IP addresses and network security groups depend on the workload design. A **public IP is not necessary** for private-only access."},{"id":42,"term":"Azure Virtual Machine Scale Sets (VMSS)","definition":"Virtual Machine Scale Sets manage a collection of virtual machines and can increase or decrease the number of instances through configured autoscaling. Uniform orchestration uses a common VM model, while Flexible orchestration supports more varied instances. Scale sets manage compute capacity; traffic distribution is a separate load-balancing function.","priority":"Core","chapter":5,"refs":"","highlightedDefinition":"Virtual Machine Scale Sets manage a **collection of virtual machines** and can increase or decrease the number of instances through **configured autoscaling**. **Uniform orchestration** uses a common VM model, while **Flexible orchestration** supports more varied instances. Scale sets manage compute capacity; traffic distribution is a separate **load-balancing function**."},{"id":43,"term":"Availability set","definition":"An availability set distributes VMs across fault domains and update domains to reduce the impact of shared hardware failures and planned platform maintenance. Deploying multiple suitable VMs in an availability set improves resilience within that arrangement. It does not distribute VMs across availability zones or regions.","priority":"Core","chapter":5,"refs":"","highlightedDefinition":"An availability set distributes VMs across **fault domains and update domains** to reduce the impact of **shared hardware failures** and **planned platform maintenance**. Deploying multiple suitable VMs in an availability set improves resilience within that arrangement. It **does not distribute VMs across availability zones** or regions."},{"id":44,"term":"Fault domain","definition":"A fault domain groups infrastructure components that share a possible source of failure, such as power or networking hardware. Placing redundant VMs in separate fault domains reduces the chance that a single hardware failure affects all instances simultaneously.","priority":"Related","chapter":5,"refs":"","highlightedDefinition":"A fault domain groups infrastructure components that **share a possible source of failure**, such as **power or networking hardware**. Placing redundant VMs in **separate fault domains** reduces the chance that a single hardware failure affects all instances simultaneously."},{"id":45,"term":"Update domain","definition":"An update domain is a logical group of VMs in an availability set that may undergo planned platform maintenance together. Distributing VMs across multiple update domains reduces the risk that planned updates interrupt all instances at the same time.","priority":"Related","chapter":5,"refs":"","highlightedDefinition":"An update domain is a logical group of VMs in an availability set that may undergo **planned platform maintenance together**. Distributing VMs across **multiple update domains** reduces the risk that planned updates interrupt all instances at the same time."},{"id":46,"term":"Azure Virtual Desktop - AVD","definition":"Azure Virtual Desktop is a managed desktop and application virtualization service that delivers Windows desktops and applications remotely to users. It provides access to centrally hosted working environments without requiring applications or desktops to run locally on every user's device.","priority":"Core","chapter":5,"refs":"","highlightedDefinition":"Azure Virtual Desktop is a **managed desktop and application virtualization** service that delivers **Windows desktops and applications remotely** to users. It provides access to centrally hosted working environments without requiring applications or desktops to run locally on every user's device."},{"id":47,"term":"Azure App Service / Web Apps","definition":"Azure App Service is a managed PaaS platform for hosting web applications, REST APIs and mobile application backends. Microsoft manages the underlying hosting infrastructure and operating system, while customers deploy application code and configure settings, scaling and access. It is distinct from event-triggered function execution.","priority":"Core","chapter":5,"refs":"","highlightedDefinition":"Azure App Service is a **managed PaaS platform** for hosting **web applications, REST APIs and mobile application backends**. Microsoft manages the underlying hosting infrastructure and operating system, while **customers deploy application code** and configure settings, scaling and access. It is distinct from event-triggered function execution."},{"id":48,"term":"Container","definition":"A container is an isolated application execution environment that packages application code and its dependencies. Containers generally share the underlying host OS kernel instead of running a complete separate guest operating system. This makes them comparatively lightweight and helps applications run consistently across compatible environments.","priority":"Core","chapter":5,"refs":"","highlightedDefinition":"A container is an **isolated application execution environment** that packages application **code and its dependencies**. Containers generally **share the underlying host OS kernel** instead of running a complete separate guest operating system. This makes them comparatively lightweight and helps applications run consistently across compatible environments."},{"id":49,"term":"Container image","definition":"A container image is a packaged template containing the application, dependencies and configuration needed to create a container. Multiple container instances can be created from the same image. The image is the reusable template, while a container is an instance created from it.","priority":"Related","chapter":5,"refs":"","highlightedDefinition":"A container image is a **packaged template** containing the **application, dependencies and configuration** needed to create a container. Multiple container instances can be created from the same image. The image is the reusable template, while a **container is an instance** created from it."},{"id":50,"term":"Azure Container Instances - ACI","definition":"Azure Container Instances runs containers on managed infrastructure without requiring customers to provision VMs or manage an orchestration cluster. It provides a straightforward way to execute containerized workloads on demand, particularly isolated tasks or simple deployments that do not require full Kubernetes orchestration.","priority":"Core","chapter":5,"refs":"","highlightedDefinition":"Azure Container Instances **runs containers on managed infrastructure** **without requiring customers to provision VMs** or manage an orchestration cluster. It provides a straightforward way to execute containerized workloads on demand, particularly **isolated tasks or simple deployments** that do not require full Kubernetes orchestration."},{"id":51,"term":"Azure Container Apps","definition":"Azure Container Apps is a managed platform for running containerized applications and microservices without directly managing their underlying orchestration infrastructure. It supports application-level features such as managed scaling based on HTTP traffic or events. It provides more application hosting capabilities than basic container execution.","priority":"Core","chapter":5,"refs":"","highlightedDefinition":"Azure Container Apps is a managed platform for running **containerized applications and microservices** **without directly managing their underlying orchestration infrastructure**. It supports application-level features such as **managed scaling based on HTTP traffic or events**. It provides more application hosting capabilities than basic container execution."},{"id":52,"term":"Azure Functions","definition":"Azure Functions is a managed compute service for executing small units of application code in response to events or configured triggers, such as HTTP requests, schedules and messages. The hosting plan determines scaling behavior, execution limits and billing. Not every plan scales to zero or charges only per execution.","priority":"Core","chapter":5,"refs":"","highlightedDefinition":"Azure Functions is a managed compute service for **executing small units of application code** in response to **events or configured triggers**, such as HTTP requests, schedules and messages. The **hosting plan determines scaling behavior**, execution limits and billing. Not every plan scales to zero or charges only per execution."},{"id":53,"term":"Stopped vs deallocated VM","definition":"A stopped but allocated Azure VM retains its compute allocation and continues to incur compute charges even if the guest OS is shut down. A deallocated VM releases that allocation and stops instance compute billing. Attached storage, other billable resources and pricing commitments may still incur costs.","priority":"Related","chapter":5,"refs":"","highlightedDefinition":"A **stopped but allocated** Azure VM retains its compute allocation and **continues to incur compute charges** even if the guest OS is shut down. A **deallocated VM** releases that allocation and **stops instance compute billing**. Attached **storage**, other billable resources and pricing commitments may still incur costs."},{"id":54,"term":"Azure Virtual Network - VNet","definition":"An Azure Virtual Network is a logical private network that connects Azure resources using configured IP address ranges, subnets and routing. It can also connect to other virtual or on-premises networks using appropriate connectivity services. Network security groups and other controls determine which traffic is permitted.","priority":"Core","chapter":6,"refs":"","highlightedDefinition":"An Azure Virtual Network is a **logical private network** that connects Azure resources using configured **IP address ranges, subnets and routing**. It can also connect to **other virtual or on-premises networks** using appropriate connectivity services. Network security groups and other controls determine which traffic is permitted."},{"id":55,"term":"Subnet","definition":"A subnet divides a virtual network's IP address space into smaller address ranges for organizing connected resources. Resources in different subnets of the same VNet can generally communicate by default, subject to routing and security controls. Subnets alone do not automatically create security isolation.","priority":"Core","chapter":6,"refs":"","highlightedDefinition":"A subnet divides a virtual network's IP address space into **smaller address ranges** for organizing connected resources. Resources in **different subnets of the same VNet can generally communicate by default**, subject to routing and security controls. Subnets alone **do not automatically create security isolation**."},{"id":56,"term":"Public endpoint","definition":"A public endpoint is an access point for a service that uses a public IP address or publicly routable address. Access can still require authentication and be restricted by firewall rules or network configuration. Having a public endpoint does not necessarily mean that anonymous or unrestricted access is permitted.","priority":"Core","chapter":6,"refs":"","highlightedDefinition":"A public endpoint is an access point for a service that uses a **public IP address or publicly routable address**. Access can still require **authentication** and be restricted by **firewall rules** or network configuration. Having a public endpoint does not necessarily mean that anonymous or unrestricted access is permitted."},{"id":57,"term":"Private endpoint / Azure Private Link","definition":"Azure Private Link enables private connectivity to supported services through a private endpoint. A private endpoint is a network interface with a private IP address from a customer's VNet that provides access to the target service. DNS and public-access settings must be configured appropriately; creating a private endpoint does not automatically disable public access.","priority":"Core","chapter":6,"refs":"","highlightedDefinition":"Azure Private Link enables **private connectivity** to supported services through a private endpoint. A private endpoint is a **network interface with a private IP address** from a customer's VNet that provides access to the target service. **DNS and public-access settings** must be configured appropriately; creating a private endpoint **does not automatically disable public access**."},{"id":58,"term":"VNet peering","definition":"VNet peering connects two Azure virtual networks so their resources can communicate privately using Microsoft's network rather than the public internet. Peering relationships are not transitive by default, so a connection between two VNets does not automatically connect them to a third network.","priority":"Core","chapter":6,"refs":"","highlightedDefinition":"VNet peering **connects two Azure virtual networks** so their resources can communicate **privately using Microsoft's network** rather than the public internet. Peering relationships are **not transitive by default**, so a connection between two VNets does not automatically connect them to a third network."},{"id":59,"term":"Azure VPN Gateway","definition":"Azure VPN Gateway provides encrypted network connectivity between an Azure VNet and other networks or individual devices. Site-to-site and point-to-site VPNs commonly use the public internet, while VNet-to-VNet connections use the Azure backbone. It provides VPN connectivity rather than a dedicated private circuit such as ExpressRoute.","priority":"Core","chapter":6,"refs":"","highlightedDefinition":"Azure VPN Gateway provides **encrypted network connectivity** between an Azure VNet and other networks or individual devices. **Site-to-site and point-to-site VPNs** commonly use the public internet, while **VNet-to-VNet connections use the Azure backbone**. It provides VPN connectivity rather than a dedicated private circuit such as ExpressRoute."},{"id":60,"term":"Azure ExpressRoute","definition":"Azure ExpressRoute provides private connectivity between an organization's network and Microsoft cloud services through a connectivity provider, bypassing the public internet. It can offer more predictable network performance for supported connections. Private connectivity does not automatically mean the traffic is encrypted.","priority":"Core","chapter":6,"refs":"","highlightedDefinition":"Azure ExpressRoute provides **private connectivity** between an organization's network and Microsoft cloud services through a connectivity provider, **bypassing the public internet**. It can offer more predictable network performance for supported connections. Private connectivity **does not automatically mean the traffic is encrypted**."},{"id":61,"term":"Azure DNS","definition":"Azure DNS is a managed service for hosting DNS zones and records that map domain names to network addresses or other DNS targets. It supports name resolution for applications and resources. Hosting DNS records is different from registering a domain name or distributing network traffic.","priority":"Core","chapter":6,"refs":"","highlightedDefinition":"Azure DNS is a managed service for **hosting DNS zones and records** that map domain names to network addresses or other DNS targets. It supports **name resolution** for applications and resources. Hosting DNS records is **different from registering a domain name** or distributing network traffic."},{"id":62,"term":"Network Security Group - NSG","definition":"A Network Security Group contains stateful rules that allow or deny inbound and outbound network traffic based on properties such as addresses, ports and protocol. NSGs can be associated with subnets or network interfaces. They filter traffic but do not independently provide internet connectivity or application-layer inspection.","priority":"Related","chapter":6,"refs":"","highlightedDefinition":"A Network Security Group contains **stateful rules** that **allow or deny inbound and outbound network traffic** based on properties such as addresses, ports and protocol. NSGs can be associated with **subnets or network interfaces**. They filter traffic but do not independently provide internet connectivity or application-layer inspection."},{"id":63,"term":"Site-to-site (S2S) VPN","definition":"A site-to-site VPN establishes an encrypted tunnel between an organization's network and an Azure virtual network. It generally connects network gateways so devices on the remote network can communicate with private Azure resources, subject to routing and security controls. It connects networks rather than individual client devices.","priority":"Related","chapter":6,"refs":"","highlightedDefinition":"A site-to-site VPN establishes an **encrypted tunnel** between an **organization's network and an Azure virtual network**. It generally connects network gateways so devices on the remote network can communicate with private Azure resources, subject to routing and security controls. It **connects networks rather than individual client devices**."},{"id":64,"term":"Point-to-site (P2S) VPN","definition":"A point-to-site VPN establishes an encrypted connection from an individual client device to an Azure virtual network. It allows remote users to access private Azure resources when appropriate authentication, routing and permissions are configured. Unlike site-to-site VPN, it does not require connecting an entire remote network.","priority":"Related","chapter":6,"refs":"","highlightedDefinition":"A point-to-site VPN establishes an **encrypted connection** from an **individual client device** to an Azure virtual network. It allows remote users to access private Azure resources when appropriate authentication, routing and permissions are configured. Unlike site-to-site VPN, it **does not require connecting an entire remote network**."},{"id":65,"term":"Virtual network gateway / local network gateway","definition":"A virtual network gateway is the Azure-side gateway that establishes and handles VPN connections to an Azure VNet. A local network gateway is an Azure configuration resource that represents the remote VPN device and its network address ranges. Together they describe both sides of a site-to-site VPN connection.","priority":"Related","chapter":6,"refs":"","highlightedDefinition":"A virtual network gateway is the **Azure-side gateway** that establishes and handles VPN connections to an Azure VNet. A **local network gateway** is an Azure configuration resource that **represents the remote VPN device and its network address ranges**. Together they describe both sides of a site-to-site VPN connection."},{"id":66,"term":"Storage account","definition":"An Azure storage account is a management resource that provides a namespace and shared configuration for supported storage services. Its account type determines the available services and performance characteristics, while its settings control region, redundancy and security. A general-purpose v2 account supports blobs, files, queues and tables.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"An Azure storage account is a management resource that provides a **namespace and shared configuration** for supported storage services. Its **account type** determines the available services and performance characteristics, while its settings control **region, redundancy and security**. A general-purpose v2 account supports **blobs, files, queues and tables**."},{"id":67,"term":"Azure Blob Storage","definition":"Azure Blob Storage is a managed object storage service for large amounts of unstructured data, including documents, media and backups. Objects called blobs are organized into containers and accessed through storage APIs or supported tools. Access tiers and redundancy options allow customers to balance cost, retrieval requirements and resilience.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Azure Blob Storage is a **managed object storage** service for large amounts of **unstructured data**, including documents, media and backups. Objects called **blobs are organized into containers** and accessed through storage APIs or supported tools. Access tiers and redundancy options allow customers to balance cost, retrieval requirements and resilience."},{"id":68,"term":"Azure Files","definition":"Azure Files provides fully managed file shares that applications and users can access using supported file protocols such as SMB or NFS. It allows workloads to use shared file paths without maintaining their own file server infrastructure. Azure File Sync can extend supported Azure file shares to Windows Server.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Azure Files provides **fully managed file shares** that applications and users can access using supported file protocols such as **SMB or NFS**. It allows workloads to use shared file paths **without maintaining their own file server infrastructure**. Azure File Sync can extend supported Azure file shares to Windows Server."},{"id":69,"term":"Azure Queue Storage","definition":"Azure Queue Storage stores messages that application components can send and retrieve asynchronously. Producers can add work to a queue without requiring a consumer to process it immediately, which helps decouple components and handle fluctuating workloads. Azure Service Bus provides richer enterprise messaging features when required.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Azure Queue Storage stores messages that application components can **send and retrieve asynchronously**. Producers can add work to a queue without requiring a consumer to process it immediately, which helps **decouple components** and handle **fluctuating workloads**. Azure Service Bus provides richer enterprise messaging features when required."},{"id":70,"term":"Azure Table Storage","definition":"Azure Table Storage is a schemaless NoSQL service for structured, non-relational data stored as entities and properties. Each entity is identified by its PartitionKey and RowKey, and entities can have different sets of properties. It is not a relational database with a fixed table schema and SQL joins.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Azure Table Storage is a **schemaless NoSQL** service for structured, non-relational data stored as **entities and properties**. Each entity is identified by its **PartitionKey and RowKey**, and entities can have different sets of properties. It is **not a relational database** with a fixed table schema and SQL joins."},{"id":71,"term":"Azure Managed Disks","definition":"Azure Managed Disks are managed block-storage volumes used by Azure virtual machines for operating system and data disks. Azure handles the underlying storage infrastructure, while customers choose supported disk types, capacity and performance characteristics. They provide persistent disk storage rather than shared file or object storage.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Azure Managed Disks are **managed block-storage volumes** used by Azure virtual machines for **operating system and data disks**. Azure handles the underlying storage infrastructure, while customers choose supported disk types, capacity and performance characteristics. They provide **persistent disk storage** rather than shared file or object storage."},{"id":72,"term":"Hot access tier","definition":"The Hot access tier is an online Blob Storage tier intended for data accessed or modified frequently. It generally has a higher storage cost per gigabyte but lower access charges than cooler tiers. Total cost depends on both stored capacity and the frequency and type of operations.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"The Hot access tier is an **online Blob Storage tier** intended for data accessed or modified **frequently**. It generally has a **higher storage cost per gigabyte** but **lower access charges** than cooler tiers. Total cost depends on both stored capacity and the frequency and type of operations."},{"id":73,"term":"Cool access tier","definition":"The Cool access tier is an online Blob Storage tier intended for infrequently accessed data that must remain readily available. It generally reduces storage cost compared with Hot but increases access charges. For GPv2 block blobs, a typical 30-day minimum billable retention period applies, and early deletion or tier changes can incur charges.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"The Cool access tier is an online Blob Storage tier intended for **infrequently accessed** data that must remain **readily available**. It generally reduces storage cost compared with Hot but **increases access charges**. For GPv2 block blobs, a typical **30-day minimum billable retention** period applies, and early deletion or tier changes can incur charges."},{"id":74,"term":"Cold access tier","definition":"The Cold access tier is an online Blob Storage tier for rarely accessed data that still requires fast retrieval. Storage costs are generally lower and access costs higher than warmer tiers. GPv2 block blobs typically have a 90-day minimum billable retention period. Unlike Archive, Cold does not require rehydration before reading.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"The Cold access tier is an online Blob Storage tier for **rarely accessed** data that still requires **fast retrieval**. Storage costs are generally lower and access costs higher than warmer tiers. GPv2 block blobs typically have a **90-day minimum billable retention** period. Unlike Archive, Cold **does not require rehydration** before reading."},{"id":75,"term":"Archive access tier","definition":"The Archive access tier stores rarely accessed blob data offline at a low storage cost per gigabyte. Data must be rehydrated to an online tier before it can be read, which takes time and can incur retrieval charges. A typical 180-day minimum billable retention period applies, making Archive suitable for long-term retention with non-urgent access.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"The Archive access tier stores rarely accessed blob data **offline** at a **low storage cost per gigabyte**. Data must be **rehydrated to an online tier** before it can be read, which takes time and can incur retrieval charges. A typical **180-day minimum billable retention** period applies, making Archive suitable for long-term retention with non-urgent access."},{"id":76,"term":"Rehydration","definition":"Rehydration is the process of making an archived blob available for reading by moving or copying its data into an online access tier. The operation is not immediate and may involve additional charges depending on the retrieval method and priority. This delay is an important limitation of Archive storage.","priority":"Related","chapter":7,"refs":"","highlightedDefinition":"Rehydration is the process of making an **archived blob available for reading** by moving or copying its data into an **online access tier**. The operation is **not immediate** and may involve additional charges depending on the retrieval method and priority. This delay is an important limitation of Archive storage."},{"id":77,"term":"Locally redundant storage - LRS","definition":"Locally redundant storage maintains three synchronous copies of data within one datacenter in the primary region. It protects against certain local hardware failures and is generally the lowest-cost redundancy option. It does not protect against the loss of the entire datacenter or primary region.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Locally redundant storage maintains **three synchronous copies** of data within **one datacenter** in the primary region. It protects against certain local hardware failures and is generally the **lowest-cost redundancy option**. It **does not protect against the loss of the entire datacenter** or primary region."},{"id":78,"term":"Zone-redundant storage - ZRS","definition":"Zone-redundant storage synchronously replicates data across three availability zones within the primary region. This helps keep data accessible during the failure of a single zone where supported. ZRS does not include geographic replication to a secondary region.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Zone-redundant storage **synchronously replicates data across three availability zones** within the **primary region**. This helps keep data accessible during the failure of a single zone where supported. ZRS **does not include geographic replication** to a secondary region."},{"id":79,"term":"Geo-redundant storage - GRS","definition":"Geo-redundant storage maintains locally redundant copies in the primary region and asynchronously replicates data to a locally redundant secondary region. It provides protection against regional disasters, but recent writes may not yet have reached the secondary location. Ordinary GRS does not provide direct secondary-region read access before failover.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Geo-redundant storage maintains **locally redundant copies** in the primary region and **asynchronously replicates data** to a locally redundant **secondary region**. It provides protection against regional disasters, but recent writes may not yet have reached the secondary location. Ordinary GRS **does not provide direct secondary-region read access** before failover."},{"id":80,"term":"Geo-zone-redundant storage - GZRS","definition":"Geo-zone-redundant storage combines synchronous zone redundancy in the primary region with asynchronous replication to a locally redundant secondary region. It provides resilience against primary-region zone failures and geographic disasters. Secondary copies can lag behind the primary data, and direct secondary reads require the appropriate read-access option.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"Geo-zone-redundant storage combines **synchronous zone redundancy** in the primary region with **asynchronous replication** to a **locally redundant secondary region**. It provides resilience against primary-region zone failures and geographic disasters. Secondary copies can lag behind the primary data, and direct secondary reads require the appropriate read-access option."},{"id":81,"term":"Read-access geo-redundancy (RA-GRS / RA-GZRS)","definition":"RA-GRS and RA-GZRS are read-access variants of geo-redundant and geo-zone-redundant storage. They allow applications to read from the supported secondary-region endpoint without first failing over the storage account. They do not add extra replicas, and asynchronous replication means secondary reads may return older data.","priority":"Core","chapter":7,"refs":"","highlightedDefinition":"RA-GRS and RA-GZRS are **read-access variants** of geo-redundant and geo-zone-redundant storage. They allo
