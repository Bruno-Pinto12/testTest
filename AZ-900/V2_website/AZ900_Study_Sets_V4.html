|\n| Azure Policy | Enforce resource configuration standards |\n| Defender for Cloud | Improve security posture |\n\n**Exam distinction:** Prevent deletion only → CanNotDelete. Prevent creation, modification and deletion within a resource group → ReadOnly.\n\n**Exam keywords:** Resource locks, ReadOnly, CanNotDelete, inheritance, administrators, management plane.", "chapter": 10}, {"id": 78, "sourceId": 78, "title": "Defense in Depth", "prompt": "Which security model uses multiple protective layers so that failure of one control does not expose data?", "options": [{"letter": "A", "text": "Consumption-based pricing"}, {"letter": "B", "text": "Defense in depth"}, {"letter": "C", "text": "Availability sets"}, {"letter": "D", "text": "Resource tags"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nDefense in depth layers security controls. Pricing concerns billing; availability sets improve VM resilience; tags classify resources.\n\n### Key concept to remember\n\nDefense in depth layers security controls.", "chapter": 8}, {"id": 79, "sourceId": 79, "title": "Private Endpoints", "prompt": "Which feature assigns a private IP address in a VNet to access a supported Azure PaaS service?", "options": [{"letter": "A", "text": "Service endpoint"}, {"letter": "B", "text": "Azure DNS"}, {"letter": "C", "text": "Private endpoint"}, {"letter": "D", "text": "ExpressRoute"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nPrivate endpoints use Private Link and a private IP. Service endpoints extend subnet identity without assigning the service a private IP in the VNet; DNS resolves names; ExpressRoute provides private connectivity to Azure.\n\n### Key concept to remember\n\nPrivate endpoints use Private Link and a private IP.", "chapter": 6}, {"id": 80, "sourceId": 80, "title": "AzCopy", "prompt": "You need to automate movement of multiple files to a storage account. What command line tool can you use to script copying blobs or files to or from your storage account? (choose the best answer)", "options": [{"letter": "A", "text": "Azure File Sync"}, {"letter": "B", "text": "Azure Storage Explorer"}, {"letter": "C", "text": "AzCopy"}, {"letter": "D", "text": "Azure Data Box"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzCopy is a command-line utility designed to copy blobs and files to or from Azure Storage accounts. It supports scripting and automated data transfers.\n\n### Why the other answers are incorrect\n\n- **A. Azure File Sync:** Provides continuous bidirectional synchronization between on-premises Windows Server file shares and Azure Files. It is not a general-purpose command-line data transfer utility.\n- **B. Azure Storage Explorer:** Provides a graphical user interface for managing Azure Storage resources, uploading and downloading files. AzCopy is more appropriate for scripting and automating data transfers.\n- **D. Azure Data Box:** Uses physical storage devices to transfer large volumes of data to or from Azure, particularly when network bandwidth is limited. It is not a command-line utility.\n\n### Key concept to remember\n\n| Tool or service | Main purpose |\n|---|---|\n| AzCopy | Command-line data transfers |\n| Azure Storage Explorer | Graphical storage management |\n| Azure File Sync | Continuous bidirectional file synchronization |\n| Azure Data Box | Large-scale offline data transfers |\n| Azure Migrate | Assess and migrate workloads to Azure |\n\n| Command | Purpose |\n|---|---|\n| `azcopy copy` | Copy files or blobs between supported locations |\n| `azcopy sync` | Synchronize a destination with a source |\n| `azcopy login` | Authenticate using Microsoft Entra ID |\n\n**Example:** Upload files from a local directory to an Azure Blob Storage container.\n\n```powershell\nazcopy copy \"C:\\Documents\\*\" \"https://account.blob.core.windows.net/container\" --recursive=true\n```\n\nAppropriate authentication and storage permissions are required.\n\n**Exam distinction:** Command-line utility, scripts and automated transfers = AzCopy; graphical interface = Azure Storage Explorer; continuous bidirectional synchronization = Azure File Sync; physical devices and limited network bandwidth = Azure Data Box.\n\nAzCopy supports synchronization operations, but it is not a continuous bidirectional synchronization service like Azure File Sync.\n\n**Exam keywords:** AzCopy, CLI, scripting, automated data transfers, Blob Storage, Azure Files.", "chapter": 7}, {"id": 81, "sourceId": 81, "title": "Locally Redundant Storage (LRS)", "prompt": "Which Azure storage redundancy option would you select for development workloads where minimizing expense is the highest priority?", "options": [{"letter": "A", "text": "Zone Redundant Storage (ZRS)"}, {"letter": "B", "text": "Geo-Redundant Storage (GRS)"}, {"letter": "C", "text": "Geo-Zone Redundant Storage (GZRS)"}, {"letter": "D", "text": "Locally Redundant Storage (LRS)"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nLRS is the least expensive Azure Storage redundancy option, making it suitable for development workloads where minimizing costs is the highest priority.\n\n### Why the other answers are incorrect\n\n- **A. Zone Redundant Storage (ZRS):** Replicates data synchronously across three availability zones in the primary region. It protects against zone failures but costs more than LRS.\n- **B. Geo-Redundant Storage (GRS):** Replicates data locally in the primary region and asynchronously to a secondary region. It provides regional disaster protection at additional cost.\n- **C. Geo-Zone Redundant Storage (GZRS):** Combines zone redundancy in the primary region with asynchronous replication to a secondary region. It provides greater resilience but costs more than LRS.\n\n### Key concept to remember\n\n| Redundancy | Copies | Annual durability (at least) | Replication |\n|---|---:|---:|---|\n| LRS | 3 | 11 nines | One physical location |\n| ZRS | 3 | 12 nines | Three availability zones |\n| GRS | 6 | 16 nines | Two regions, local redundancy |\n| GZRS | 6 | 16 nines | Two regions, zone redundancy in primary region |\n\n**Exam distinction:** Minimum cost = LRS; availability zone failure protection = ZRS; regional disaster protection = GRS; combined zone and geographical redundancy = GZRS; read access to secondary region = RA-GRS or RA-GZRS.\n\nLRS protects against individual hardware failures but does not guarantee protection against loss of an entire datacenter. Storage redundancy is not a substitute for backups. Geo-replication is asynchronous, so recent writes may be lost during a regional disaster.\n\n**Exam keywords:** Minimum expense, development workloads, local replication, storage redundancy, LRS.", "chapter": 7}, {"id": 82, "sourceId": 82, "title": "Azure Virtual Machine Scale Sets", "prompt": "Contoso needs Azure capacity to support spikes in request traffic to their load-balanced web farm during the holiday shopping season. A consultant recommends deploying the website to a virtual machine scale set in Azure. Will this meet the requirement?", "options": [{"letter": "A", "text": "YES"}, {"letter": "B", "text": "NO"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure Virtual Machine Scale Sets (VMSS) can automatically increase or decrease the number of VM instances based on demand, making them suitable for seasonal traffic spikes.\n\n### Why the other answer is incorrect\n\n- **B. NO:** Virtual Machine Scale Sets are designed to manage and scale groups of virtual machines. When autoscaling is configured, additional instances can be deployed during high demand and removed when traffic decreases, without manually deploying each VM.\n\n### Key concept to remember\n\nAzure Virtual Machine Scale Sets support horizontal scaling and elasticity. A load balancer distributes traffic across available instances. For example, a web farm could scale from two to six VMs during the holiday season and return to two afterward.\n\n| Scaling operation | Description |\n|---|---|\n| Scale out | Add more VM instances |\n| Scale in | Remove VM instances |\n| Scale up | Increase CPU, RAM or capacity of a VM |\n| Scale down | Decrease CPU, RAM or capacity of a VM |\n\n| Azure service | Main purpose |\n|---|---|\n| Virtual Machine Scale Sets | Manage and scale groups of VMs |\n| Azure Load Balancer | Distribute network traffic across instances |\n| Availability Sets | Protect against hardware and maintenance-related failures |\n| Availability Zones | Protect against datacenter-level failures when workloads span zones |\n| Azure Monitor | Collect metrics and monitor resource utilization |\n\nAutoscaling can be configured using metrics such as CPU utilization or predefined schedules.\n\n**Exam distinction:** Scalability = ability to change capacity; elasticity = adjusting capacity according to changing demand; load balancing = distributing traffic across available instances.\n\n**Exam keywords:** VM Scale Sets, VMSS, autoscaling, seasonal demand, traffic spikes, horizontal scaling, elasticity.", "chapter": 5}, {"id": 83, "sourceId": 83, "title": "Azure Table Storage", "prompt": "Which type of Azure storage stores NoSQL data in Azure, including a schemaless key/attribute store?", "options": [{"letter": "A", "text": "Queue Storage"}, {"letter": "B", "text": "Table Storage"}, {"letter": "C", "text": "Blob Storage"}, {"letter": "D", "text": "File Storage"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure Table Storage is a NoSQL service providing a schemaless key/attribute store. Entities in the same table can have different sets of properties.\n\n### Why the other answers are incorrect\n\n- **A. Queue Storage:** Stores messages for asynchronous communication between application components, not NoSQL entities.\n- **C. Blob Storage:** Stores unstructured object data such as images, videos and backups, rather than providing a key/attribute database model.\n- **D. File Storage:** Provides managed file shares through protocols such as SMB and NFS, rather than NoSQL data storage.\n\n### Key concept to remember\n\nAzure Table Storage uses a flexible, non-relational data model. Each entity is uniquely identified by the combination of PartitionKey and RowKey. Entities in the same table may have different properties. For example, one customer entity may contain a City property while another contains Email and Age properties. Unlike relational SQL databases, Table Storage does not natively support relational joins. Azure Cosmos DB for Table also supports the table data model, with additional capabilities such as global distribution.\n\n| Azure Storage type | Main purpose |\n|---|---|\n| Table Storage | Schemaless NoSQL data |\n| Blob Storage | Unstructured object data |\n| Queue Storage | Asynchronous messages |\n| Azure Files | Managed file shares |\n| Disk Storage | Virtual machine disks |\n\n**Exam distinction:** Schemaless, non-relational, key/attribute storage = Azure Table Storage.\n\n**Exam keywords:** NoSQL, schemaless, key/attribute store, entities, properties, PartitionKey, RowKey.", "chapter": 7}, {"id": 84, "sourceId": 84, "title": "Microsoft Defender for Cloud", "prompt": "You need to identify deviations from Microsoft security best practices in your Azure cloud infrastructure. Which service should you use?", "options": [{"letter": "A", "text": "Azure Advisor"}, {"letter": "B", "text": "Microsoft Defender for Cloud"}, {"letter": "C", "text": "Azure Monitor"}, {"letter": "D", "text": "Azure Key Vault"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nMicrosoft Defender for Cloud continuously assesses cloud resources, identifies deviations from security best practices and provides recommendations to improve security posture.\n\n### Why the other answers are incorrect\n\n- **A. Azure Advisor:** Provides general optimization recommendations across security, reliability, cost, performance and operational excellence. Defender for Cloud is the dedicated cloud security posture assessment solution.\n- **C. Azure Monitor:** Collects metrics, logs and telemetry to monitor resource health, availability and performance.\n- **D. Azure Key Vault:** Securely stores and manages secrets, encryption keys and certificates rather than assessing infrastructure security posture.\n\n### Key concept to remember\n\nDefender for Cloud provides security recommendations, Secure Score and regulatory compliance assessments. Its capabilities include Cloud Security Posture Management (CSPM), which identifies misconfigurations, and Cloud Workload Protection Platform (CWPP), which detects threats and protects workloads. Some capabilities require paid plans.\n\n| Service | Main purpose |\n|---|---|\n| Microsoft Defender for Cloud | Security posture, recommendations and workload protection |\n| Microsoft Sentinel | Security event analysis and incident response (SIEM/SOAR) |\n| Azure Advisor | General resource optimization recommendations |\n| Azure Monitor | Resource health, metrics, logs and alerts |\n| Azure Policy | Enforce configuration and compliance standards |\n| Azure Key Vault | Protect secrets, keys and certificates |\n\n**Exam distinction:** Identify security misconfigurations = Defender for Cloud; enforce configuration standards = Azure Policy; analyze security incidents = Microsoft Sentinel; store secrets = Azure Key Vault.\n\n**Exam keywords:** Security best practices, security posture, misconfigurations, Secure Score, CSPM, security recommendations.", "chapter": 8}, {"id": 85, "sourceId": 85, "title": "Regulatory Compliance", "prompt": "Contoso IT is planning to migrate all on-premises data to Azure. The Legal Department has asked for verification that Azure complies with Contoso's regulatory obligations, such as HIPAA and PCI DSS. Which Azure service can be used to monitor for regulatory compliance?", "options": [{"letter": "A", "text": "Azure App Insights"}, {"letter": "B", "text": "Azure Advisor"}, {"letter": "C", "text": "Azure Monitor"}, {"letter": "D", "text": "Microsoft Defender for Cloud"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nMicrosoft Defender for Cloud provides a Regulatory Compliance dashboard that assesses cloud resources against regulatory standards such as HIPAA and PCI DSS, identifies compliance gaps and provides remediation recommendations.\n\n### Why the other answers are incorrect\n\n- **A. Azure App Insights:** Monitors application performance, availability, exceptions and request failures. It does not assess cloud infrastructure against regulatory compliance standards.\n- **B. Azure Advisor:** Provides general recommendations across cost, security, reliability, performance and operational excellence, rather than dedicated regulatory compliance assessments.\n- **C. Azure Monitor:** Collects metrics, logs and telemetry and generates alerts. Its data can support compliance investigations, but it is not the dedicated regulatory compliance assessment service.\n\n### Key concept to remember\n\nDefender for Cloud assesses supported resources against assigned regulatory standards and identifies compliance gaps. Some controls require manual assessment and some capabilities require paid plans. HIPAA concerns US healthcare information, PCI DSS concerns payment card data, and ISO 27001 concerns information security management.\n\n| Service | Main purpose |\n|---|---|\n| Microsoft Defender for Cloud | Assess cloud security and regulatory compliance |\n| Service Trust Portal | Access Microsoft's compliance certifications and audit reports |\n| Azure Policy | Evaluate and enforce resource configuration standards |\n| Microsoft Purview | Data governance, information protection and compliance management |\n| Azure Advisor | General resource optimization recommendations |\n| Azure Monitor | Metrics, logs and operational alerts |\n\nMicrosoft's compliance certifications do not automatically make customer workloads compliant. Customers remain responsible for their configurations, data and applicable regulatory obligations under the shared responsibility model.\n\n**Exam distinction:** Monitor workload regulatory compliance = Defender for Cloud; verify Microsoft's certifications and audit reports = Service Trust Portal; enforce configuration standards = Azure Policy.\n\n**Exam keywords:** Regulatory compliance, HIPAA, PCI DSS, compliance dashboard, security posture, compliance assessments.", "chapter": 8}, {"id": 86, "sourceId": 86, "title": "Azure Cloud Shell", "prompt": "Which tool provides an authenticated browser-based Bash or PowerShell terminal for managing Azure resources?", "options": [{"letter": "A", "text": "Azure Cloud Shell"}, {"letter": "B", "text": "Azure Advisor"}, {"letter": "C", "text": "Azure Service Health"}, {"letter": "D", "text": "Azure Files"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nCloud Shell provides the browser terminal. Advisor recommends changes; Service Health reports incidents; Files provides shares.\n\n### Key concept to remember\n\nCloud Shell provides the browser terminal.", "chapter": 11}, {"id": 87, "sourceId": 87, "title": "Azure Reservations", "prompt": "As part of a migration of on-premises VM workloads to Azure VMs, Contoso wants to minimize costs. Since the VMs will be running in Azure for an extended period of time (years), what option should they consider to reduce hosting costs?", "options": [{"letter": "A", "text": "Azure Cost Management"}, {"letter": "B", "text": "Azure Reservations"}, {"letter": "C", "text": "Azure Advisor"}, {"letter": "D", "text": "VM Scale Sets"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure Reservations reduce costs for eligible Azure resources through a one-year or three-year commitment. They are particularly suitable for long-running workloads with predictable resource requirements.\n\n### Why the other answers are incorrect\n\n- **A. Azure Cost Management:** Tracks expenditure, forecasts costs and manages budgets, but does not directly provide reservation discounts.\n- **C. Azure Advisor:** Recommends cost-saving opportunities, including reservations, but Azure Reservations provides the actual discounted pricing.\n- **D. VM Scale Sets:** Manage and scale groups of VMs according to demand when autoscaling is configured. They can reduce unnecessary consumption but do not provide long-term commitment discounts.\n\n### Key concept to remember\n\n| Pricing model | Best suited for |\n|---|---|\n| Pay-as-you-go | Short-term or unpredictable workloads |\n| Azure Reservations | Stable, predictable, long-running workloads |\n| Azure Savings Plan for Compute | Flexible long-term compute spending commitments |\n| Azure Spot VMs | Interruptible workloads that tolerate eviction |\n| Azure Hybrid Benefit | Customers with eligible existing software licenses |\n\nReservations can be paid upfront or monthly. The commitment remains applicable even if eligible usage is insufficient to fully utilize the reservation. VM reservation discounts generally cover compute costs, not additional storage or networking expenses. A reservation discount does not itself guarantee VM capacity.\n\n**Exam distinction:** Predictable workloads running for years = Azure Reservations; flexible compute spending commitment = Azure Savings Plan; track spending and budgets = Cost Management; recommend savings = Advisor.\n\n**Exam keywords:** Long-term workloads, predictable usage, one-year commitment, three-year commitment, reserved instances, cost optimization.", "chapter": 9}, {"id": 88, "sourceId": 88, "title": "Azure VPN Gateway", "prompt": "A ____ is a virtual network gateway that sends encrypted traffic between an Azure VNET and an on-premises location over the Internet", "options": [{"letter": "A", "text": "App gateway"}, {"letter": "B", "text": "Web proxy"}, {"letter": "C", "text": "VPN gateway"}, {"letter": "D", "text": "Private endpoint"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure VPN Gateway sends encrypted traffic between an Azure virtual network and an on-premises location over the public Internet.\n\n### Why the other answers are incorrect\n\n- **A. App gateway:** Azure Application Gateway is a Layer 7 HTTP/HTTPS load balancer. It does not establish VPN tunnels between on-premises networks and Azure.\n- **B. Web proxy:** Acts as an intermediary between clients and web servers, forwarding or filtering requests rather than establishing network-to-network VPN tunnels.\n- **D. Private endpoint:** Provides private IP access to supported Azure services within a virtual network. It does not establish a VPN connection to on-premises infrastructure.\n\n### Key concept to remember\n\n| Service | Main purpose |\n|---|---|\n| VPN Gateway | Encrypted network connections over the Internet |\n| ExpressRoute | Private connectivity without traversing the public Internet |\n| Application Gateway | Layer 7 HTTP/HTTPS load balancing |\n| Azure Load Balancer | Layer 4 TCP/UDP load balancing |\n| Private Endpoint | Private access to supported Azure services |\n| Local Network Gateway | Represents the remote network and VPN device configuration |\n\nSite-to-Site VPN connects an on-premises network to Azure using an encrypted IPsec tunnel. Point-to-Site VPN connects an individual client device to Azure. VNet-to-VNet VPN connects Azure virtual networks using VPN gateways.\n\n**Exam distinction:** Encrypted connection over the public Internet = VPN Gateway; private connectivity = ExpressRoute; web traffic distribution = Application Gateway; private IP access to supported services = Private Endpoint.\n\n**Exam keywords:** VPN Gateway, encrypted traffic, IPsec, public Internet, hybrid cloud, Site-to-Site VPN, virtual network gateway.", "chapter": 6}, {"id": 89, "sourceId": 89, "title": "Azure Advisor", "prompt": "Contoso IT Operations has been tasked with providing recommendations on how to reducing cost of running Azure VMs. Which service should they use to gather recommendations?", "options": [{"letter": "A", "text": "Microsoft Defender for Cloud"}, {"letter": "B", "text": "Azure Advisor"}, {"letter": "C", "text": "Azure Monitor"}, {"letter": "D", "text": "Azure App Insights"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure Advisor analyzes existing Azure resources and provides personalized cost optimization recommendations, including resizing underutilized VMs and purchasing Azure Reservations.\n\n### Why the other answers are incorrect\n\n- **A. Microsoft Defender for Cloud:** Focuses on cloud security posture, regulatory compliance and workload protection rather than cost optimization.\n- **C. Azure Monitor:** Collects metrics, logs and telemetry to monitor resource utilization, health and performance. Advisor provides actionable cost optimization recommendations.\n- **D. Azure App Insights:** Monitors application performance, response times, exceptions and availability rather than VM hosting cost optimization.\n\n### Key concept to remember\n\nAzure Advisor provides recommendations in five categories: cost, security, reliability, performance and operational excellence. Cost recommendations may include resizing or shutting down underutilized VMs, purchasing reservations and considering savings plans. Recommendations do not automatically implement every suggested change.\n\n| Azure feature | Main purpose |\n|---|---|\n| Azure Advisor | Recommend cost optimizations |\n| Azure Pricing Calculator | Estimate costs before deployment |\n| Azure Cost Management | Analyze spending, forecasts and budgets |\n| Azure Reservations | Reduce costs through long-term commitments |\n| Azure Tags | Categorize resources for cost allocation |\n| Azure Monitor | Monitor resource utilization and performance |\n\n**Exam distinction:** Recommend improvements = Azure Advisor; track spending = Azure Cost Management; estimate planned deployment costs = Azure Pricing Calculator; monitor technical performance = Azure Monitor.\n\n**Exam keywords:** Cost optimization, recommendations, underutilized VMs, rightsizing, Azure Advisor, best practices.", "chapter": 9}, {"id": 90, "sourceId": 90, "title": "Azure Cost Management", "prompt": "Contoso is planning to move several on-premises services to Azure PaaS and IaaS solutions. The CIO has asked for a tool to estimate the cost of hosting these resources in Azure. Tom suggests Azure Cost Management to estimate costs prior to migration. Does Tom's solution meet the solution criteria?", "options": [{"letter": "A", "text": "YES"}, {"letter": "B", "text": "NO"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure Cost Management monitors, analyzes and forecasts Azure expenditure. Azure Pricing Calculator is the appropriate tool for estimating the cost of planned resources before migration.\n\n### Why the other answer is incorrect\n\n- **A. YES:** Cost Management provides cost analysis, budgets, alerts and forecasts, but is not the appropriate tool for estimating a new deployment based on planned resource configurations.\n\n### Key concept to remember\n\n| Azure tool | Main purpose |\n|---|---|\n| Azure Pricing Calculator | Estimate costs before deployment |\n| Azure Cost Management | Analyze spending, budgets and forecasts |\n| Azure Advisor | Recommend cost optimizations |\n| Azure Reservations | Reduce costs through long-term commitments |\n| Azure TCO Calculator (legacy) | Compare on-premises and cloud infrastructure costs |\n\n**Exam distinction:** Estimate costs prior to migration = Azure Pricing Calculator; track expenditure and configure budgets = Azure Cost Management; obtain cost-saving recommendations = Azure Advisor.\n\n**Exam trap:** Forecasting expenditure based on existing usage is different from estimating the cost of a planned deployment.\n\n**Exam keywords:** Prior to migration, estimated costs, planned resources, Pricing Calculator, Cost Management, budgets, forecasts.", "chapter": 9}, {"id": 91, "sourceId": 91, "title": "Azure Resource Groups", "prompt": "To manage service lifecycle with more granularity, Contoso cloud architects have designed a model that involves a large number of resource groups. Will Contoso incur additional costs for the resources groups?", "options": [{"letter": "A", "text": "YES"}, {"letter": "B", "text": "NO"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure Resource Groups are logical containers used to organize and manage Azure resources. Creating resource groups does not incur additional charges. Customers pay for billable resources and services deployed within them.\n\n### Why the other answer is incorrect\n\n- **A. YES:** Creating additional resource groups does not directly increase Azure expenditure. Resources deployed within them may incur charges.\n\n### Key concept to remember\n\n| Azure component | Direct cost |\n|---|---|\n| Management Groups | Free |\n| Subscriptions | No inherent container fee |\n| Resource Groups | Free |\n| Virtual Machines | Billable |\n| Storage Accounts | Usage-based charges |\n| Azure SQL Database | Billable |\n\nA resource belongs to only one resource group at a time. A resource group can contain resources in different regions. Resources sharing a management lifecycle should generally be grouped together. Deleting a resource group deletes its contained resources, subject to applicable protections. Azure RBAC, Azure Policy and resource locks can be applied at resource group scope.\n\n**Exam distinction:** Management Groups organize subscriptions; subscriptions establish billing and management boundaries; Resource Groups organize resources; Tags categorize resources for cost reporting.\n\n**Exam trap:** Creating 100 resource groups does not inherently cost more than creating one resource group containing the same resources.\n\n**Exam keywords:** Resource groups, logical containers, resource lifecycle, no additional cost, Azure resource hierarchy.", "chapter": 4}, {"id": 92, "sourceId": 92, "title": "Azure Availability Zones", "prompt": "You plan to deploy several Azure VMs. The applications running on these VMs should remain available if a single Azure datacenter fails. You opt to deploy VMs to multiple availability zones. Does your solution meet the solution criteria?", "options": [{"letter": "A", "text": "YES"}, {"letter": "B", "text": "NO"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure Availability Zones are physically separate locations within an Azure region, with independent power, cooling and networking. Deploying redundant VMs across zones helps protect applications against datacenter-level failures.\n\n### Why the other answer is incorrect\n\n- **B. NO:** Availability Zones are designed to protect against datacenter-level failures. With appropriate application redundancy and traffic distribution, unaffected instances can continue serving requests.\n\n### Key concept to remember\n\n| Azure feature | Main purpose |\n|---|---|\n| Availability Sets | Protect against hardware and maintenance-related failures |\n| Availability Zones | Protect against datacenter-level failures |\n| Multi-region deployment | Protect against regional failures |\n| VM Scale Sets | Manage and scale groups of VMs |\n| Azure Load Balancer | Distribute traffic across healthy instances |\n\nAvailability Zones are connected through high-speed, low-latency networks.\n\n**Important:** Deploying VMs across zones does not automatically guarantee application availability. Application redundancy, data replication and appropriate traffic routing must also be configured.\n\n**Exam distinction:** Hardware failure or planned maintenance = Availability Sets; datacenter failure = Availability Zones; regional failure = multi-region deployment; increased traffic demand = VM Scale Sets.\n\n**Exam keywords:** Availability Zones, datacenter failure, high availability, fault tolerance, physical isolation, redundancy.", "chapter": 4}, {"id": 93, "sourceId": 93, "title": "Azure Migrate", "prompt": "Which service helps discover, assess and migrate on-premises workloads to Azure?", "options": [{"letter": "A", "text": "Azure Monitor"}, {"letter": "B", "text": "Azure Migrate"}, {"letter": "C", "text": "Azure DNS"}, {"letter": "D", "text": "Azure Policy"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure Migrate supports migration assessment and execution. Monitor observes telemetry; DNS resolves names; Policy governs configurations.\n\n### Key concept to remember\n\nAzure Migrate supports migration assessment and execution.", "chapter": 7}, {"id": 94, "sourceId": 94, "title": "Azure App Service", "prompt": "Azure App Service supports which of the following application type(s)?", "options": [{"letter": "A", "text": "Web apps"}, {"letter": "B", "text": "Mobile apps"}, {"letter": "C", "text": "API apps"}, {"letter": "D", "text": "All the above"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure App Service is a fully managed Platform as a Service (PaaS) that supports hosting web applications, REST APIs and mobile application backends without managing the underlying infrastructure.\n\n### Why the other answers are incomplete\n\n- **A. Web apps:** Supported, including applications built with ASP.NET Core, Java, Node.js and Python.\n- **B. Mobile apps:** Supported through hosting backend services for mobile applications.\n- **C. API apps:** Supported, including REST APIs consumed by other applications.\n\n### Key concept to remember\n\n| Azure service | Main purpose |\n|---|---|\n| Azure App Service | Host web applications, APIs and mobile backends |\n| Azure Functions | Execute event-driven serverless code |\n| Azure Logic Apps | Automate workflows and integrations |\n| Azure Virtual Machines | Host applications with operating system control |\n| Azure Kubernetes Service | Orchestrate containerized applications |\n| Azure Container Apps | Run containerized applications on a managed platform |\n\nApp Service supports HTTPS/TLS, custom domains, built-in authentication, CI/CD, scaling and deployment slots (depending on the hosting plan and configuration).\n\n**Important:** App Service hosts mobile application backends, not the native application installed on a smartphone.\n\n**Exam distinction:** Managed web and API hosting = App Service; event-driven serverless code = Functions; full operating system control = Virtual Machines; Kubernetes orchestration = AKS.\n\n**Exam keywords:** App Service, PaaS, web apps, mobile backends, API apps, managed hosting.", "chapter": 5}, {"id": 95, "sourceId": 95, "title": "Azure DNS", "prompt": "Which service hosts public DNS domains and private DNS zones in Azure?", "options": [{"letter": "A", "text": "Azure Firewall"}, {"letter": "B", "text": "Azure DNS"}, {"letter": "C", "text": "Azure VPN Gateway"}, {"letter": "D", "text": "Azure Advisor"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure DNS hosts DNS zones. Firewall filters traffic; VPN Gateway connects networks; Advisor provides recommendations.\n\n### Key concept to remember\n\nAzure DNS hosts DNS zones.", "chapter": 6}, {"id": 96, "sourceId": 96, "title": "Pay-As-You-Go (PAYG)", "prompt": "Tailspin Toys uses a pay-as-you-go (PAYG) subscription in Azure. PAYG generally provides lowest cost over time, but least flexibility in terms of shifting consumption to new services.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nPAYG provides high flexibility without a long-term commitment. Customers pay for billable consumption. Reservations can reduce costs for predictable, long-running workloads.\n\n### Why the other answer is incorrect\n\n- **A. TRUE:** The statement reverses the usual trade-off between flexibility and long-term discounts. PAYG generally has higher unit prices than commitment-based pricing.\n\n### Key concept to remember\n\n| Pricing model | Commitment | Best suited for |\n|---|---|---|\n| Pay-as-you-go | None | Unpredictable or short-lived workloads |\n| Azure Reservations | Typically 1 or 3 years | Predictable workloads |\n| Azure Savings Plan for Compute | 1 or 3 years | Flexible eligible compute usage |\n| Azure Spot VMs | No long-term commitment | Interruptible workloads |\n| Azure Hybrid Benefit | Eligible software licenses | Reducing licensing costs |\n\n**Important:** PAYG may be cheaper for short-lived or infrequently used resources. Commitment discounts are most useful when the commitment is sufficiently utilized.\n\n**Exam distinction:** Maximum flexibility without commitment = PAYG; predictable long-term workloads = Reservations; flexible compute spending commitment = Savings Plan; interruptible workloads = Spot VMs.\n\n**Exam keywords:** PAYG, flexibility, consumption-based pricing, long-term commitment, reservations, cost optimization.", "chapter": 9}, {"id": 97, "sourceId": 97, "title": "Azure Container Instances (ACI)", "prompt": "Azure Container Instances enable running containers without host servers to manage.", "options": [{"letter": "A", "text": "YES"}, {"letter": "B", "text": "NO"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure Container Instances (ACI) runs containers without requiring customers to provision or manage host servers or virtual machines. Microsoft manages the underlying infrastructure.\n\n### Why the other answer is incorrect\n\n- **B. NO:** ACI is specifically designed to run containers without managing servers or a Kubernetes orchestration platform.\n\n### Key concept to remember\n\n| Azure service | Main purpose |\n|---|---|\n| Azure Container Instances (ACI) | Run containers without managing servers |\n| Azure Kubernetes Service (AKS) | Managed Kubernetes orchestration |\n| Azure Container Apps (ACA) | Serverless containerized applications and microservices |\n| Azure Container Registry (ACR) | Store and manage container images |\n| Azure Virtual Machines | Run containers with greater infrastructure control |\n\nACI supports rapid deployment, Linux and Windows containers, and per-second billing based on allocated resources and execution duration. It is suitable for isolated tasks, batch processing and simple containerized workloads.\n\n**Important:** Serverless means customers do not manage the underlying servers, not that physical servers do not exist.\n\n**Exam distinction:** No host management = ACI; Kubernetes orchestration = AKS; serverless microservices and automatic scaling = Container Apps; container image storage = ACR.\n\n**Exam keywords:** ACI, containers, serverless, managed infrastructure, no host management, rapid deployment.", "chapter": 5}, {"id": 98, "sourceId": 98, "title": "Azure Container Instances and Elastic Bursting", "prompt": "Azure Container Instances enable elastic bursting for Azure Kubernetes Service.", "options": [{"letter": "A", "text": "YES"}, {"letter": "B", "text": "NO"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure Container Instances (ACI) supports elastic bursting for Azure Kubernetes Service (AKS) through virtual nodes. Eligible pods can run on ACI without provisioning additional VM-based cluster nodes.\n\n### Why the other answer is incorrect\n\n- **B. NO:** AKS can integrate with ACI through virtual nodes to provide additional container capacity on demand.\n\n### Key concept to remember\n\n| Service or feature | Main purpose |\n|---|---|\n| Azure Container Instances | Run containers without managing host servers |\n| Azure Kubernetes Service | Kubernetes container orchestration |\n| AKS Virtual Nodes | Extend AKS capacity through ACI |\n| Azure Container Apps | Serverless applications and microservices |\n| Azure Container Registry | Store container images |\n| AKS Cluster Autoscaler | Adjust the number of VM-based cluster nodes |\n\nElastic bursting helps accommodate workload spikes rapidly without provisioning additional VM-based nodes for eligible workloads.\n\n**Important:** Virtual nodes must be configured and workloads must meet the integration's compatibility requirements.\n\n**Exam distinction:** No host management = ACI; Kubernetes orchestration = AKS; elastic bursting from AKS to ACI = Virtual Nodes; scaling VM-based cluster nodes = Cluster Autoscaler.\n\n**Exam keywords:** ACI, AKS, elastic bursting, virtual nodes, on-demand capacity, serverless containers.", "chapter": 5}, {"id": 99, "sourceId": 99, "title": "Azure Virtual Network and Subnet Communication", "prompt": "Azure VMs in different subnets in the same virtual network can communicate by default.", "options": [{"letter": "A", "text": "YES"}, {"letter": "B", "text": "NO"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure VMs in different subnets within the same virtual network (VNet) can communicate by default using private IP addresses. Azure provides system routes between subnets.\n\n### Why the other answer is incorrect\n\n- **B. NO:** Subnets within a VNet are not isolated from one another by default. Network Security Groups (NSGs) can restrict traffic between them.\n\n### Key concept to remember\n\n| Scenario | Private communication by default |\n|---|---|\n| Same subnet | Yes |\n| Different subnets in the same VNet | Yes |\n| Different VNets | No |\n| Peered VNets | Yes, subject to security rules |\n| On-premises network and Azure VNet | No, requires connectivity |\n\n| Feature | Main purpose |\n|---|---|\n| VNet | Provide an isolated virtual network |\n| Subnet | Divide a VNet into smaller network segments |\n| NSG | Allow or deny inbound and outbound traffic |\n| VNet Peering | Connect separate VNets |\n| VPN Gateway | Establish encrypted network connections |\n| ExpressRoute | Provide private connectivity to Azure |\n\n**Important:** NSGs, custom routes and operating system firewalls can restrict communication within the same VNet.\n\n**Exam distinction:** Same VNet = communication allowed by default; different VNets = additional connectivity required; filter traffic = NSG; connect separate VNets = VNet Peering.\n\n**Exam trap:** A subnet does not automatically create a security isolation boundary.\n\n**Exam keywords:** VNet, subnets, private IP addresses, system routes, NSG, VNet Peering, default communication.", "chapter": 6}, {"id": 100, "sourceId": 100, "title": "Azure DDoS Protection", "prompt": "Azure DDoS Protection offers enhanced IP Protection and Network Protection tiers in addition to built-in infrastructure protection. Is this correct?", "options": [{"letter": "A", "text": "YES"}, {"letter": "B", "text": "NO"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nAzure provides baseline infrastructure protection and two enhanced tiers. NO is incorrect under current terminology; Basic and Standard are historical names.\n\n### Key concept to remember\n\nAzure provides baseline infrastructure protection and two enhanced tiers.", "chapter": 6}, {"id": 101, "sourceId": 101, "title": "Private cloud", "prompt": "A research institute needs cloud infrastructure dedicated to itself. A third-party provider will operate the hardware in its own datacenter. Which cloud model meets the requirement?", "options": [{"letter": "A", "text": "Multicloud"}, {"letter": "B", "text": "Public cloud"}, {"letter": "C", "text": "Hybrid cloud"}, {"letter": "D", "text": "Private cloud"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nDedication to one organization defines a private cloud, regardless of the hosting location.\n\n### Why the other answers are incorrect\n\n- **A. Multicloud:** This means using multiple cloud providers.\n- **B. Public cloud:** The underlying infrastructure is shared across customers.\n- **C. Hybrid cloud:** This would require integration of public and private environments.\n\n### Key concept to remember\n\nPrivate cloud does not require ownership of the physical datacenter.", "chapter": 1, "format": "scenario"}, {"id": 102, "sourceId": 102, "title": "Shared responsibility", "prompt": "For each statement about public cloud, select Yes or No: (1) Customers must secure the physical hosts of Azure public cloud services. (2) Customers have no responsibility for their own data in SaaS. (3) The provider is always responsible for guest OS patching.", "options": [{"letter": "A", "text": "Yes / Yes / Yes"}, {"letter": "B", "text": "No / No / Yes"}, {"letter": "C", "text": "Yes / Yes / No"}, {"letter": "D", "text": "Yes / No / Yes"}, {"letter": "E", "text": "Yes / No / No"}, {"letter": "F", "text": "No / No / No"}, {"letter": "G", "text": "No / Yes / No"}, {"letter": "H", "text": "No / Yes / Yes"}], "correct": "F", "correctLabel": "Correct answer", "details": "### Explanation\n\nPhysical infrastructure is the provider's responsibility, data remains the customer's, and guest OS patching depends on the service model.\n\n### Statement-by-statement correction\n\n- **Customers must secure the physical hosts of Azure public cloud services. — No.**\n- **Customers have no responsibility for their own data in SaaS. — No.**\n- **The provider is always responsible for guest OS patching. — No.**\n\n### Key concept to remember\n\nPhysical infrastructure is always provider-managed in public cloud; other responsibilities depend on service type.", "chapter": 1, "format": "statements", "items": ["Customers must secure the physical hosts of Azure public cloud services.", "Customers have no responsibility for their own data in SaaS.", "The provider is always responsible for guest OS patching."], "intro": "For each statement about public cloud, select Yes or No:", "revision": 4, "rationales": ["The provider, not the customer, secures public-cloud physical hosts.", "Data remains a customer responsibility even in SaaS.", "Guest OS patching depends on the service model; IaaS customers manage it."]}, {"id": 103, "sourceId": 103, "title": "Hybrid cloud", "prompt": "A hospital keeps a dedicated private cloud for clinical records and uses Azure for a connected public-facing appointment system. Which model describes this integrated environment?", "options": [{"letter": "A", "text": "Multicloud"}, {"letter": "B", "text": "Public cloud"}, {"letter": "C", "text": "Private cloud"}, {"letter": "D", "text": "Hybrid cloud"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nThe private cloud and public cloud are used together.\n\n### Why the other answers are incorrect\n\n- **A. Multicloud:** Using a private cloud and one public provider does not by itself mean multiple public providers.\n- **B. Public cloud:** This ignores the private cloud component.\n- **C. Private cloud:** This ignores the Azure public cloud component.\n\n### Key concept to remember\n\nHybrid describes integration of private and public environments, not simply ownership of hardware.", "chapter": 1, "format": "scenario"}, {"id": 104, "sourceId": 104, "title": "Consumption-based billing", "prompt": "Which TWO characteristics are associated with a consumption-based cloud model? (1) No need to buy physical servers upfront. (2) Usage or provisioned capacity affects charges. (3) All services have a fixed monthly fee. (4) Every stopped resource is free. Select the correct pair.", "options": [{"letter": "A", "text": "3 and 4"}, {"letter": "B", "text": "1 and 3"}, {"letter": "C", "text": "1 and 4"}, {"letter": "D", "text": "2 and 3"}, {"letter": "E", "text": "1 and 2"}, {"letter": "F", "text": "2 and 4"}], "correct": "E", "correctLabel": "Correct answer", "details": "### Explanation\n\nConsumption pricing avoids upfront hardware purchases and ties charges to billable usage or capacity.\n\n### Why the other answers are incorrect\n\n- **A. 3 and 4:** Neither is a general property of consumption pricing.\n- **B. 1 and 3:** Fixed monthly pricing is not universal.\n- **C. 1 and 4:** Statement(s) 4 are not correct; statement(s) 2 are required. Pay for billable usage, not necessarily only active execution; retained or allocated resources may be billed.\n- **D. 2 and 3:** Statement(s) 3 are not correct; statement(s) 1 are required. Pay for billable usage, not necessarily only active execution; retained or allocated resources may be billed.\n- **F. 2 and 4:** Stopped resources can still incur charges.\n\n### Key concept to remember\n\nPay for billable usage, not necessarily only active execution; retained or allocated resources may be billed.", "chapter": 1, "format": "multiple", "items": ["No need to buy physical servers upfront.", "Usage or provisioned capacity affects charges.", "All services have a fixed monthly fee.", "Every stopped resource is free."], "intro": "Which TWO characteristics are associated with a consumption-based cloud model?", "rationales": ["Cloud infrastructure is rented rather than bought upfront.", "Usage and allocated capacity are common billing meters.", "Fixed monthly pricing is not a universal characteristic.", "Allocated compute, disks and other retained resources can still incur charges."]}, {"id": 105, "sourceId": 105, "title": "Multicloud", "prompt": "A media company uses Azure for analytics and another public cloud provider for content delivery. It has no private cloud. Which term best describes its strategy?", "options": [{"letter": "A", "text": "Multicloud"}, {"letter": "B", "text": "Private cloud"}, {"letter": "C", "text": "Sovereign cloud"}, {"letter": "D", "text": "Hybrid cloud"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt uses more than one public cloud provider.\n\n### Why the other answers are incorrect\n\n- **B. Private cloud:** Resources are not dedicated private cloud infrastructure.\n- **C. Sovereign cloud:** No isolated regulatory cloud environment is required.\n- **D. Hybrid cloud:** No integrated private cloud is described.\n\n### Key concept to remember\n\nMulticloud describes provider diversity; hybrid describes public/private integration.", "chapter": 1, "format": "scenario"}, {"id": 106, "sourceId": 106, "title": "Capital expenditure", "prompt": "Purchasing a physical server for a company-owned datacenter is an example of _____.", "options": [{"letter": "A", "text": "Operational expenditure (OpEx)"}, {"letter": "B", "text": "Consumption-based billing"}, {"letter": "C", "text": "Capital expenditure (CapEx)"}, {"letter": "D", "text": "Elasticity"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nThe purchase is an upfront infrastructure investment.\n\n### Why the other answers are incorrect\n\n- **A. Operational expenditure (OpEx):** This generally refers to ongoing operating costs.\n- **B. Consumption-based billing:** This charges for usage or allocated capacity rather than buying the hardware.\n- **D. Elasticity:** This is adjustment of capacity to demand.\n\n### Key concept to remember\n\nCapEx and OpEx describe different spending models; operating a private datacenter can also incur OpEx.", "chapter": 1, "format": "completion"}, {"id": 107, "sourceId": 107, "title": "Spot pricing", "prompt": "A research job can be interrupted and restarted from checkpoints. The team accepts eviction to obtain discounted spare VM capacity. Which option fits?", "options": [{"letter": "A", "text": "Azure Reservations"}, {"letter": "B", "text": "Azure Spot Virtual Machines"}, {"letter": "C", "text": "Azure Hybrid Benefit"}, {"letter": "D", "text": "Pay-as-you-go at standard rates"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nSpot capacity is discounted but can be evicted.\n\n### Why the other answers are incorrect\n\n- **A. Azure Reservations:** Reservations discount eligible committed usage, not specifically evictable spare capacity.\n- **C. Azure Hybrid Benefit:** This uses eligible existing software licenses.\n- **D. Pay-as-you-go at standard rates:** This does not specifically use discounted spare capacity.\n\n### Key concept to remember\n\nUse Spot for interruption-tolerant workloads, not for workloads that must run continuously.", "chapter": 1, "format": "scenario"}, {"id": 108, "sourceId": 108, "title": "Savings plan", "prompt": "A company wants a one-year hourly compute spending commitment but expects its eligible compute usage to shift between different services. Which option is most appropriate?", "options": [{"letter": "A", "text": "Azure savings plan for compute"}, {"letter": "B", "text": "Azure Hybrid Benefit"}, {"letter": "C", "text": "Azure Spot VMs"}, {"letter": "D", "text": "Azure Reservations"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt discounts eligible compute usage against an hourly spending commitment.\n\n### Why the other answers are incorrect\n\n- **B. Azure Hybrid Benefit:** It relies on eligible licenses.\n- **C. Azure Spot VMs:** Spare capacity may be evicted and is not an hourly spending commitment.\n- **D. Azure Reservations:** Reservations are more targeted to eligible reserved usage rather than a flexible hourly spend commitment.\n\n### Key concept to remember\n\nSavings plans trade a spending commitment for discounts; reservations target eligible usage more specifically.", "chapter": 1, "format": "scenario"}, {"id": 109, "sourceId": 109, "title": "Serverless", "prompt": "Select the correct Yes/No sequence: (1) Serverless still runs on physical servers. (2) Customers must patch the host OS in a managed serverless service. (3) Charges depend on the service and hosting plan.", "options": [{"letter": "A", "text": "Yes / No / Yes"}, {"letter": "B", "text": "Yes / Yes / Yes"}, {"letter": "C", "text": "No / Yes / Yes"}, {"letter": "D", "text": "Yes / Yes / No"}, {"letter": "E", "text": "No / No / Yes"}, {"letter": "F", "text": "No / Yes / No"}, {"letter": "G", "text": "Yes / No / No"}, {"letter": "H", "text": "No / No / No"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nThe provider manages underlying servers and the pricing model depends on the offering.\n\n### Why the other answers are incorrect\n\n- **B. Yes / Yes / Yes:** 2 must be No. The provider manages underlying servers and the pricing model depends on the offering.\n- **C. No / Yes / Yes:** Servers exist and the host OS is provider-managed.\n- **D. Yes / Yes / No:** Host patching is not the customer's job and billing can vary.\n- **E. No / No / Yes:** Serverless does not eliminate physical servers.\n- **F. No / Yes / No:** 1 must be Yes; 2 must be No; 3 must be Yes. The provider manages underlying servers and the pricing model depends on the offering.\n- **G. Yes / No / No:** 3 must be Yes. The provider manages underlying servers and the pricing model depends on the offering.\n- **H. No / No / No:** 1 must be Yes; 3 must be Yes. The provider manages underlying servers and the pricing model depends on the offering.\n\n### Key concept to remember\n\nServerless is an infrastructure management abstraction, not a promise that all executions are free.", "chapter": 1, "format": "statements", "items": ["Serverless still runs on physical servers.", "Customers must patch the host OS in a managed serverless service.", "Charges depend on the service and hosting plan."], "intro": "Select Yes or No for each statement:", "rationales": ["Serverless abstracts physical servers rather than eliminating them.", "The managed serverless provider handles the host OS.", "Billing depends on the offering and selected hosting plan."]}, {"id": 110, "sourceId": 110, "title": "Public cloud use case", "prompt": "A startup needs to launch a service quickly, has no datacenter, and does not want to buy hardware. It has no dedicated infrastructure requirement. Which cloud model is the best starting point?", "options": [{"letter": "A", "text": "On-premises infrastructure"}, {"letter": "B", "text": "Public cloud"}, {"letter": "C", "text": "Hybrid cloud"}, {"letter": "D", "text": "Private cloud"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nProvider infrastructure enables rapid provisioning without purchasing hardware.\n\n### Why the other answers are incorrect\n\n- **A. On-premises infrastructure:** It would require operating infrastructure the startup does not have.\n- **C. Hybrid cloud:** There is no existing private cloud to integrate.\n- **D. Private cloud:** Dedicated infrastructure is not required by the scenario.\n\n### Key concept to remember\n\nChoose public cloud when rapid provisioning and avoiding hardware ownership are priorities.", "chapter": 1, "format": "scenario"}, {"id": 111, "sourceId": 111, "title": "Vertical scaling", "prompt": "A database VM has insufficient memory. You change its size from 8 GB RAM to 32 GB RAM without increasing the VM count. Which scaling approach is this?", "options": [{"letter": "A", "text": "Disaster recovery"}, {"letter": "B", "text": "Scale out"}, {"letter": "C", "text": "Scale up"}, {"letter": "D", "text": "Scale in"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nIncreasing capacity of an existing instance is vertical scaling.\n\n### Why the other answers are incorrect\n\n- **A. Disaster recovery:** Restores services after major disruption.\n- **B. Scale out:** Adds more instances.\n- **D. Scale in:** Removes instances.\n\n### Key concept to remember\n\nVertical scaling changes instance size; horizontal scaling changes instance count.", "chapter": 2, "format": "scenario"}, {"id": 112, "sourceId": 112, "title": "Scale in", "prompt": "A website has ten instances after a promotion. Demand returns to normal and autoscaling removes six instances. Which operation occurs?", "options": [{"letter": "A", "text": "Scale up"}, {"letter": "B", "text": "Scale in"}, {"letter": "C", "text": "Scale down"}, {"letter": "D", "text": "Scale out"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nHorizontal capacity is reduced by removing instances.\n\n### Why the other answers are incorrect\n\n- **A. Scale up:** Increases capacity of one instance.\n- **C. Scale down:** Reduces the size of an existing instance.\n- **D. Scale out:** Adds instances rather than removing them.\n\n### Key concept to remember\n\nScale in/out changes instance count; scale up/down changes instance size.", "chapter": 2, "format": "scenario"}, {"id": 113, "sourceId": 113, "title": "Availability and reliability", "prompt": "Match requirements: (1) Minimize service downtime. (2) Restore service after a regional catastrophe. (3) Keep operating when an individual component fails. Which mapping is correct?", "options": [{"letter": "A", "text": "1 High availability; 2 Fault tolerance; 3 Disaster recovery"}, {"letter": "B", "text": "1 Disaster recovery; 2 Fault tolerance; 3 High availability"}, {"letter": "C", "text": "1 High availability; 2 Disaster recovery; 3 Fault tolerance"}, {"letter": "D", "text": "1 Fault tolerance; 2 High availability; 3 Disaster recovery"}, {"letter": "E", "text": "1 Disaster recovery; 2 High availability; 3 Fault tolerance"}, {"letter": "F", "text": "1 Fault tolerance; 2 Disaster recovery; 3 High availability"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nEach term corresponds to the stated operational goal.\n\n### Correct associations\n\n- **Minimize service downtime.** → High availability\n- **Restore service after a regional catastrophe.** → Disaster recovery\n- **Keep operating when an individual component fails. Which mapping is correct?** → Fault tolerance\n\n### Key concept to remember\n\nHigh availability reduces downtime; fault tolerance withstands failures; disaster recovery restores service after major disruption.", "chapter": 2, "format": "matching", "items": ["Minimize service downtime.", "Restore service after a regional catastrophe.", "Keep operating when an individual component fails."], "intro": "Match requirements:", "targets": ["High availability", "Disaster recovery", "Fault tolerance"]}, {"id": 114, "sourceId": 114, "title": "Recovery point objective", "prompt": "A company can tolerate losing at most 15 minutes of transaction data after a disaster. Which objective is it defining?", "options": [{"letter": "A", "text": "Scale-in threshold"}, {"letter": "B", "text": "Recovery Point Objective (RPO)"}, {"letter": "C", "text": "Recovery Time Objective (RTO)"}, {"letter": "D", "text": "Service-level agreement (SLA)"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nRPO describes the acceptable data loss measured in time.\n\n### Why the other answers are incorrect\n\n- **A. Scale-in threshold:** A scaling rule controls instance capacity.\n- **C. Recovery Time Objective (RTO):** RTO is the target time to restore service.\n- **D. Service-level agreement (SLA):** An SLA is a service commitment, not this recovery objective.\n\n### Key concept to remember\n\nRPO = how much data loss; RTO = how long recovery may take.", "chapter": 2, "format": "scenario"}, {"id": 115, "sourceId": 115, "title": "Recovery time objective", "prompt": "A business requires a service to be restored within four hours following a major outage. Which concept describes this target?", "options": [{"letter": "A", "text": "Elasticity"}, {"letter": "B", "text": "Fault domain"}, {"letter": "C", "text": "Recovery Time Objective (RTO)"}, {"letter": "D", "text": "Recovery Point Objective (RPO)"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nIt specifies the target maximum restoration time.\n\n### Why the other answers are incorrect\n\n- **A. Elasticity:** Capacity adjustment to workload demand.\n- **B. Fault domain:** A physical failure boundary for infrastructure.\n- **D. Recovery Point Objective (RPO):** It specifies acceptable data loss.\n\n### Key concept to remember\n\nRTO measures time to restore operation, not data lost.", "chapter": 2, "format": "scenario"}, {"id": 116, "sourceId": 116, "title": "Reliability", "prompt": "Select the correct Yes/No sequence: (1) A backup alone guarantees uninterrupted availability. (2) Redundant components necessarily eliminate every possible outage. (3) A regional recovery plan can require failover procedures.", "options": [{"letter": "A", "text": "No / No / Yes"}, {"letter": "B", "text": "No / Yes / No"}, {"letter": "C", "text": "Yes / Yes / No"}, {"letter": "D", "text": "No / Yes / Yes"}, {"letter": "E", "text": "Yes / No / Yes"}, {"letter": "F", "text": "No / No / No"}, {"letter": "G", "text": "Yes / No / No"}, {"letter": "H", "text": "Yes / Yes / Yes"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nBackups support recovery, while redundancy and configured failover address different availability risks.\n\n### Statement-by-statement correction\n\n- **A backup alone guarantees uninterrupted availability. — No.**\n- **Redundant components necessarily eliminate every possible outage. — No.**\n- **A regional recovery plan can require failover procedures. — Yes.**\n\n### Key concept to remember\n\nBackup, availability and disaster recovery are complementary, not interchangeable.", "chapter": 2, "format": "statements", "items": ["A backup alone guarantees uninterrupted availability.", "Redundant components necessarily eliminate every possible outage.", "A regional recovery plan can require failover procedures."], "intro": "Select Yes or No for each statement:", "revision": 4, "rationales": ["Backups enable recovery rather than uninterrupted operation.", "Redundancy reduces risks but does not eliminate every outage.", "Regional disaster recovery can require failover and restoration procedures."]}, {"id": 117, "sourceId": 117, "title": "Predictability", "prompt": "A team uses monitoring and capacity planning to maintain expected response times under changing load. Which cloud benefit is most directly illustrated?", "options": [{"letter": "A", "text": "Data residency"}, {"letter": "B", "text": "Performance predictability"}, {"letter": "C", "text": "Cost predictability"}, {"letter": "D", "text": "Sovereignty"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nMonitoring and capacity planning help anticipate and manage performance.\n\n### Why the other answers are incorrect\n\n- **A. Data residency:** This concerns where data is stored or processed.\n- **C. Cost predictability:** This concerns estimating and controlling spending.\n- **D. Sovereignty:** This concerns legal or regulatory control over an environment.\n\n### Key concept to remember\n\nPredictability applies to both performance and cost; identify the measure in the scenario.", "chapter": 2, "format": "completion"}, {"id": 118, "sourceId": 118, "title": "Manageability of cloud", "prompt": "A service automatically replaces failed instances and adjusts its capacity based on workload. Which benefit is most directly illustrated?", "options": [{"letter": "A", "text": "Manageability of the cloud"}, {"letter": "B", "text": "Capital expenditure"}, {"letter": "C", "text": "Manageability in the cloud"}, {"letter": "D", "text": "Data sovereignty"}], "correct": "A", "correctLabel": "Correct answer", "details": "### Explanation\n\nCloud platform capabilities automate the operation of resources.\n\n### Why the other answers are incorrect\n\n- **B. Capital expenditure:** This is an upfront spending model.\n- **C. Manageability in the cloud:** This refers to the tools people use to manage resources.\n- **D. Data sovereignty:** This relates to legal and regulatory isolation.\n\n### Key concept to remember\n\nManageability of the cloud refers to built-in automation; manageability in the cloud refers to management interfaces and tools.", "chapter": 2, "format": "scenario"}, {"id": 119, "sourceId": 119, "title": "Cloud governance", "prompt": "Which TWO capabilities directly help enforce consistent cloud governance? (1) Policies restricting permitted configurations. (2) Repeatable infrastructure templates. (3) Increasing a VM's RAM. (4) Buying an external hard drive.", "options": [{"letter": "A", "text": "1 and 4"}, {"letter": "B", "text": "2 and 4"}, {"letter": "C", "text": "1 and 2"}, {"letter": "D", "text": "3 and 4"}, {"letter": "E", "text": "1 and 3"}, {"letter": "F", "text": "2 and 3"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nPolicies enforce rules and templates support consistent deployments.\n\n### Why the other answers are incorrect\n\n- **A. 1 and 4:** Statement(s) 4 are not correct; statement(s) 2 are required. Governance controls how resources are configured and used; scalability addresses capacity.\n- **B. 2 and 4:** A hard drive purchase is not a cloud governance mechanism.\n- **D. 3 and 4:** Neither is a governance control.\n- **E. 1 and 3:** Changing VM RAM does not enforce organizational standards.\n- **F. 2 and 3:** Statement(s) 3 are not correct; statement(s) 1 are required. Governance controls how resources are configured and used; scalability addresses capacity.\n\n### Key concept to remember\n\nGovernance controls how resources are configured and used; scalability addresses capacity.", "chapter": 2, "format": "multiple", "items": ["Policies restricting permitted configurations.", "Repeatable infrastructure templates.", "Increasing a VM's RAM.", "Buying an external hard drive."], "intro": "Which TWO capabilities directly help enforce consistent cloud governance?", "rationales": ["Azure Policy can restrict or audit resource configuration.", "Declarative templates support repeatable, standardized deployments.", "Changing VM capacity is a scaling operation, not a governance control.", "Buying physical storage is not a cloud governance control."]}, {"id": 120, "sourceId": 120, "title": "SLA and availability", "prompt": "Select Yes or No for each: (1) An SLA guarantees that no outage can ever occur. (2) Deploying any Azure resource guarantees 100% uptime. (3) Application architecture has no effect on overall availability.", "options": [{"letter": "A", "text": "No / Yes / Yes"}, {"letter": "B", "text": "Yes / Yes / No"}, {"letter": "C", "text": "Yes / No / Yes"}, {"letter": "D", "text": "Yes / Yes / Yes"}, {"letter": "E", "text": "No / Yes / No"}, {"letter": "F", "text": "Yes / No / No"}, {"letter": "G", "text": "No / No / Yes"}, {"letter": "H", "text": "No / No / No"}], "correct": "H", "correctLabel": "Correct answer", "details": "### Explanation\n\nAn SLA has contractual conditions, uptime is not guaranteed to be perfect, and architecture matters.\n\n### Statement-by-statement correction\n\n- **An SLA guarantees that no outage can ever occur. — No.**\n- **Deploying any Azure resource guarantees 100% uptime. — No.**\n- **Application architecture has no effect on overall availability. — No.**\n\n### Key concept to remember\n\nAn SLA is not identical to measured application uptime; dependencies and redundancy matter.", "chapter": 2, "format": "statements", "items": ["An SLA guarantees that no outage can ever occur.", "Deploying any Azure resource guarantees 100% uptime.", "Application architecture has no effect on overall availability."], "intro": "Select Yes or No for each:", "revision": 4, "rationales": ["An SLA is a defined service commitment, not an absolute guarantee of zero outages.", "Availability varies by service, configuration and architecture.", "Application architecture, redundancy and dependencies affect end-to-end availability."]}, {"id": 121, "sourceId": 121, "title": "IaaS guest responsibility", "prompt": "A company runs a third-party product on an Azure VM. The vendor requires custom kernel settings and installation of its own OS agent. Which service model provides the required control?", "options": [{"letter": "A", "text": "SaaS"}, {"letter": "B", "text": "Serverless function"}, {"letter": "C", "text": "IaaS"}, {"letter": "D", "text": "PaaS"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nVirtual machines provide guest OS control and customer-managed software.\n\n### Why the other answers are incorrect\n\n- **A. SaaS:** The provider supplies a complete application.\n- **B. Serverless function:** It abstracts server and host OS management.\n- **D. PaaS:** The underlying OS is managed by the provider.\n\n### Key concept to remember\n\nUse IaaS for OS-level control, accepting responsibility for the guest OS.", "chapter": 3, "format": "scenario"}, {"id": 122, "sourceId": 122, "title": "IaaS responsibilities", "prompt": "Which TWO tasks remain the customer's responsibility for an Azure IaaS VM? (1) Patching the guest OS. (2) Configuring the installed application. (3) Replacing failed physical host disks. (4) Maintaining datacenter cooling.", "options": [{"letter": "A", "text": "3 and 4"}, {"letter": "B", "text": "1 and 4"}, {"letter": "C", "text": "1 and 3"}, {"letter": "D", "text": "2 and 4"}, {"letter": "E", "text": "2 and 3"}, {"letter": "F", "text": "1 and 2"}], "correct": "F", "correctLabel": "Correct answer", "details": "### Explanation\n\nThe customer manages the guest OS and application configuration.\n\n### Why the other answers are incorrect\n\n- **A. 3 and 4:** Both are provider responsibilities.\n- **B. 1 and 4:** Statement(s) 4 are not correct; statement(s) 2 are required. IaaS moves physical infrastructure management to the provider, not guest OS administration.\n- **C. 1 and 3:** Physical host maintenance is the provider's job.\n- **D. 2 and 4:** Datacenter cooling is provider-managed.\n- **E. 2 and 3:** Statement(s) 3 are not correct; statement(s) 1 are required. IaaS moves physical infrastructure management to the provider, not guest OS administration.\n\n### Key concept to remember\n\nIaaS moves physical infrastructure management to the provider, not guest OS administration.", "chapter": 3, "format": "multiple", "items": ["Patching the guest OS.", "Configuring the installed application.", "Replacing failed physical host disks.", "Maintaining datacenter cooling."], "intro": "Which TWO tasks remain the customer's responsibility for an Azure IaaS VM?", "rationales": ["IaaS customers administer the guest OS.", "IaaS customers manage installed applications.", "Microsoft maintains the physical host hardware.", "Datacenter facilities are provider-managed."]}, {"id": 123, "sourceId": 123, "title": "PaaS development", "prompt": "A development team wants to deploy its own REST API and use a managed relational database, without maintaining either underlying operating system. Which service model should it favor?", "options": [{"letter": "A", "text": "SaaS"}, {"letter": "B", "text": "IaaS"}, {"letter": "C", "text": "Private cloud"}, {"letter": "D", "text": "PaaS"}], "correct": "D", "correctLabel": "Correct answer", "details": "### Explanation\n\nManaged application and database platforms abstract the operating systems.\n\n### Why the other answers are incorrect\n\n- **A. SaaS:** A ready-made application would not provide the required custom application hosting.\n- **B. IaaS:** The team would retain guest OS responsibility.\n- **C. Private cloud:** This is a deployment model, not a responsibility model.\n\n### Key concept to remember\n\nPaaS lets teams focus on code and data instead of server and OS maintenance.", "chapter": 3, "format": "scenario"}, {"id": 124, "sourceId": 124, "title": "SaaS responsibilities", "prompt": "Select the correct Yes/No sequence for Microsoft 365: (1) The customer manages account access. (2) Microsoft manages application updates. (3) The customer patches Microsoft's physical hosts.", "options": [{"letter": "A", "text": "No / Yes / No"}, {"letter": "B", "text": "No / Yes / Yes"}, {"letter": "C", "text": "Yes / Yes / No"}, {"letter": "D", "text": "Yes / No / No"}, {"letter": "E", "text": "Yes / Yes / Yes"}, {"letter": "F", "text": "No / No / Yes"}, {"letter": "G", "text": "Yes / No / Yes"}, {"letter": "H", "text": "No / No / No"}], "correct": "C", "correctLabel": "Correct answer", "details": "### Explanation\n\nCustomer access remains customer-managed, while the provider operates the application and physical hosts.\n\n### Why the other answers are incorrect\n\n- **A. No / Yes / No:** The customer is responsible for its accounts and access.\n- **B. No / Yes / Yes:** 1 must be Yes; 3 must be No. Customer access remains customer-managed, while the provider operates the application and physical hosts.\n- **D. Yes / No / No:** The provider manages application updates.\n- **E. Yes / Yes / Yes:** Physical hosts are provider-managed.\n- **F. No / No / Yes:** 1 must be Yes; 2 must be Yes; 3 must be No. Customer access remains customer-managed, while the provider operates the application and physical hosts.\n- **G. Yes / No / Yes:** 2 must be Yes; 3 must be No. Customer access remains customer-managed, while the provider operates the application and physical hosts.\n- **H. No / No / No:** 1 must be Yes; 2 must be Yes. Customer access remains customer-managed, while the provider operates the application and physical hosts.\n\n### Key concept to remember\n\nSaaS minimizes customer infrastructure responsibilities but does not remove responsibility for data and access.", "chapter": 3, "format": "statements", "items": ["The customer manages account access.", "Microsoft manages application updates.", "The customer patches Microsoft's physical hosts."], "intro": "Select Yes or No for each statement for Microsoft 365:", "rationales": ["The customer remains responsible for account access.", "Microsoft operates and updates the SaaS application.", "The physical hosts are managed and patched by Microsoft."]}, {"id": 125, "sourceId": 125, "title": "Service models", "prompt": "Match each requirement: (1) Use a ready-made collaboration application. (2) Deploy custom code to a managed runtime. (3) Install a custom operating system on a virtual machine.", "options": [{"letter": "A", "text": "1 SaaS; 2 IaaS; 3 PaaS"}, {"letter": "B", "text": "1 SaaS; 2 PaaS; 3 IaaS"}, {"letter": "C", "text": "1 PaaS; 2 SaaS; 3 IaaS"}, {"letter": "D", "text": "1 IaaS; 2 PaaS; 3 SaaS"}, {"letter": "E", "text": "1 PaaS; 2 IaaS; 3 SaaS"}, {"letter": "F", "text": "1 IaaS; 2 SaaS; 3 PaaS"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nThe requirements map to decreasing provider abstraction and increasing customer control.\n\n### Correct associations\n\n- **Use a ready-made collaboration application.** → SaaS\n- **Deploy custom code to a managed runtime.** → PaaS\n- **Install a custom operating system on a virtual machine.** → IaaS\n\n### Key concept to remember\n\nSelect service models by the level of customer control and management responsibility.", "chapter": 3, "format": "matching", "items": ["Use a ready-made collaboration application.", "Deploy custom code to a managed runtime.", "Install a custom operating system on a virtual machine."], "intro": "Match each requirement:", "targets": ["SaaS", "PaaS", "IaaS"]}, {"id": 126, "sourceId": 126, "title": "Serverless use case", "prompt": "A small application must run a short calculation each time a message arrives. The team does not want a continuously managed server. Which compute model is the best fit?", "options": [{"letter": "A", "text": "Dedicated IaaS VM"}, {"letter": "B", "text": "Event-driven serverless compute"}, {"letter": "C", "text": "Private cloud infrastructure"}, {"letter": "D", "text": "SaaS collaboration software"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nA function can run on a trigger using provider-managed infrastructure.\n\n### Why the other answers are incorrect\n\n- **A. Dedicated IaaS VM:** This requires greater server management.\n- **C. Private cloud infrastructure:** This does not directly provide event-triggered execution.\n- **D. SaaS collaboration software:** It does not run the team's custom calculation.\n\n### Key concept to remember\n\nServerless functions are suitable for intermittent, event-driven code; costs depend on the plan.", "chapter": 3, "format": "scenario"}, {"id": 127, "sourceId": 127, "title": "Cloud responsibility comparison", "prompt": "Select Yes or No: (1) Moving from IaaS to PaaS increases customer responsibility for guest OS patching. (2) Moving to SaaS removes all customer responsibility for data. (3) Microsoft operates physical infrastructure in all three public cloud service models.", "options": [{"letter": "A", "text": "No / Yes / Yes"}, {"letter": "B", "text": "Yes / Yes / Yes"}, {"letter": "C", "text": "Yes / No / Yes"}, {"letter": "D", "text": "Yes / Yes / No"}, {"letter": "E", "text": "No / No / No"}, {"letter": "F", "text": "No / No / Yes"}, {"letter": "G", "text": "No / Yes / No"}, {"letter": "H", "text": "Yes / No / No"}], "correct": "F", "correctLabel": "Correct answer", "details": "### Explanation\n\nProvider responsibilities expand with managed services, but customers retain data responsibilities.\n\n### Statement-by-statement correction\n\n- **Moving from IaaS to PaaS increases customer responsibility for guest OS patching. — No.**\n- **Moving to SaaS removes all customer responsibility for data. — No.**\n- **Microsoft operates physical infrastructure in all three public cloud service models. — Yes.**\n\n### Key concept to remember\n\nGreater abstraction reduces operational burden without eliminating customer security duties.", "chapter": 3, "format": "statements", "items": ["Moving from IaaS to PaaS increases customer responsibility for guest OS patching.", "Moving to SaaS removes all customer responsibility for data.", "Microsoft operates physical infrastructure in all three public cloud service models."], "intro": "Select Yes or No:", "revision": 4, "rationales": ["Moving to PaaS normally reduces customer guest OS maintenance.", "SaaS customers still manage their data and access.", "Microsoft operates the physical infrastructure for public-cloud IaaS, PaaS and SaaS."]}, {"id": 128, "sourceId": 128, "title": "Service model selection", "prompt": "A team is moving an existing Windows application without changing its code. The application requires administrative access to install a proprietary Windows service. Which hosting approach is appropriate?", "options": [{"letter": "A", "text": "Microsoft 365 (SaaS)"}, {"letter": "B", "text": "Azure Virtual Machines (IaaS)"}, {"letter": "C", "text": "Azure App Service (PaaS)"}, {"letter": "D", "text": "Azure Functions"}], "correct": "B", "correctLabel": "Correct answer", "details": "### Explanation\n\nThey permit installation of the required guest OS service.\n\n### Why the other answers are incorrect\n\n- **A. Microsoft 365 (SaaS):** It is a ready-to-use productivity suite.\n- **C. Azure App Service (PaaS):** It abstracts the underlying OS and is not intended for arbitrary OS-level services.\n- **D. Azure Functions:** It runs triggered code rather than arbitrary Windows services.\n\n### Key concept to remember\n\nLift-and-shift applications with OS dependencies often require IaaS.", "chapter": 3, "format": "scenario"}, {"id": 129, "sourceId": 129, "title": "Azure hierarchy", "prompt": "Arrange these scopes from broadest to narrowest: resource, subscription, management group, resource group.", "options": [{"letter": "A", "text": "Resource → Resource group → Subscription → Management group"}, {"letter": "B", "text": "Management group → Resource group → Subscription → Resource"}, {"letter": "C", "text": "Management group → Subscription → Resource group → Resource"}, {"letter": "D", "text": "Subscription → Management group → Resource group → Resource"}, {"letter": "E", "text":
